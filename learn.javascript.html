    <article>
  <p><strong>Word Count:</strong> ~1500</p>

  <h2>🔑 Introduction</h2>
  <p>
    In the previous lesson, we learned the basics of JavaScript and wrote our very first 
    program. Now, it’s time to dive deeper into one of the most essential topics: 
    <strong>variables and data types</strong>. Without variables, we wouldn’t be able to 
    store, update, or retrieve information in our programs.  
  </p>
  <p>
    In this lesson, we will cover:
  </p>
  <ul>
    <li>What are variables?</li>
    <li>The difference between <code>var</code>, <code>let</code>, and <code>const</code>.</li>
    <li>Rules and best practices for naming variables.</li>
    <li>JavaScript data types (primitive and reference types).</li>
    <li>Type conversion (explicit and implicit).</li>
    <li>Working with <code>typeof</code>.</li>
    <li>Common pitfalls and gotchas.</li>
    <li>Lots of examples and mini challenges.</li>
  </ul>

  <h2>📦 What Is a Variable?</h2>
  <p>
    A <strong>variable</strong> is like a container in which we store data. 
    You can think of it as a box with a label: the label is the variable name, 
    and the content inside is the value.
  </p>

  <pre><code>let message = "Hello, World!";
console.log(message); // Output: Hello, World!</code></pre>

  <p>
    In this example, <code>message</code> is the variable name, 
    and <code>"Hello, World!"</code> is the value it stores.
  </p>

  <h2>🔄 Declaring Variables</h2>
  <p>
    In JavaScript, there are three keywords to declare variables:
  </p>
  <ul>
    <li><code>var</code> – The old way (function-scoped).</li>
    <li><code>let</code> – Modern, block-scoped.</li>
    <li><code>const</code> – Block-scoped, cannot be reassigned.</li>
  </ul>

  <h3>1️⃣ var</h3>
  <p>
    Introduced in early JavaScript. It has <strong>function scope</strong>, 
    meaning it’s visible throughout a function, not just inside blocks.
  </p>
  <pre><code>var name = "Alice";
console.log(name); // Alice

var name = "Bob"; // Redeclaration allowed
console.log(name); // Bob</code></pre>

  <p><strong>⚠️ Problem:</strong> Using <code>var</code> can cause bugs due to 
  <em>hoisting</em> and redeclaration. That’s why modern JS prefers <code>let</code> and <code>const</code>.</p>

  <h3>2️⃣ let</h3>
  <p>
    Introduced in ES6 (2015). Block-scoped, meaning it only works inside the 
    block where it’s defined.
  </p>
  <pre><code>let age = 20;
age = 21; // Reassignment is allowed
console.log(age); // 21

// let age = 25; ❌ Error: Cannot redeclare variable</code></pre>

  <h3>3️⃣ const</h3>
  <p>
    Also introduced in ES6. Used when you want to declare constants – values 
    that never change. It is block-scoped and <strong>cannot be reassigned</strong>.
  </p>
  <pre><code>const PI = 3.14159;
console.log(PI);

// PI = 3; ❌ Error: Assignment to constant variable</code></pre>

  <h3>🧩 Example – var vs let vs const</h3>
  <pre><code>{
  var x = 10; // function-scoped
  let y = 20; // block-scoped
  const z = 30; // block-scoped
}
console.log(x); // ✅ Works
// console.log(y); // ❌ Error
// console.log(z); // ❌ Error</code></pre>

  <h2>📝 Rules for Naming Variables</h2>
  <ul>
    <li>Must start with a letter, underscore <code>_</code>, or dollar sign <code>$</code>.</li>
    <li>Cannot start with a number.</li>
    <li>Case-sensitive (<code>myVar</code> ≠ <code>myvar</code>).</li>
    <li>No reserved keywords (e.g., <code>let</code>, <code>const</code>, <code>if</code>).</li>
    <li>Use <strong>camelCase</strong> for best practice (<code>firstName</code>).</li>
  </ul>

  <pre><code>// ✅ Valid
let firstName = "Alice";
let _score = 100;
let $price = 9.99;

// ❌ Invalid
// let 1number = 5;
// let const = 10;</code></pre>

  <h2>📊 Data Types in JavaScript</h2>
  <p>
    JavaScript is a <strong>dynamically typed</strong> language, 
    meaning you don’t need to declare the data type of a variable; 
    it’s determined automatically.
  </p>

  <h3>Primitive Types (7 total)</h3>
  <ul>
    <li><strong>String</strong> – text.</li>
    <li><strong>Number</strong> – integers & decimals.</li>
    <li><strong>Boolean</strong> – true/false.</li>
    <li><strong>Undefined</strong> – variable declared but not assigned.</li>
    <li><strong>Null</strong> – intentional empty value.</li>
    <li><strong>Symbol</strong> – unique identifiers.</li>
    <li><strong>BigInt</strong> – large integers beyond 2⁵³ - 1.</li>
  </ul>

  <h3>Reference Types (Non-Primitive)</h3>
  <ul>
    <li><strong>Objects</strong></li>
    <li><strong>Arrays</strong></li>
    <li><strong>Functions</strong></li>
  </ul>

  <h2>🔤 Strings</h2>
  <pre><code>let name = "Alice"; // Double quotes
let city = 'Paris'; // Single quotes
let greeting = Hello, ${name}!; // Template literals
console.log(greeting); // Hello, Alice!</code></pre>

  <h2>🔢 Numbers</h2>
  <pre><code>let age = 30;
let price = 19.99;
let infinity = Infinity;
let notANumber = NaN;</code></pre>

  <h2>✔️ Boolean</h2>
  <pre><code>let isLoggedIn = true;
let isAdmin = false;</code></pre>

  <h2>🌀 Undefined vs Null</h2>
  <pre><code>let score;
console.log(score); // undefined

let user = null;
console.log(user); // null</code></pre>

  <h2>🔑 Symbols</h2>
  <pre><code>let id1 = Symbol("id");
let id2 = Symbol("id");
console.log(id1 === id2); // false (unique)</code></pre>

  <h2>🧮 BigInt</h2>
  <pre><code>let bigNumber = 123456789012345678901234567890n;
console.log(bigNumber);</code></pre>

  <h2>📦 Objects</h2>
  <pre><code>let person = {
  name: "Alice",
  age: 25,
  isStudent: true
};
console.log(person.name);</code></pre>

  <h2>📚 Arrays</h2>
  <pre><code>let colors = ["red", "green", "blue"];
console.log(colors[1]); // green</code></pre>

  <h2>⚙️ typeof Operator</h2>
  <pre><code>console.log(typeof "Hello");   // string
console.log(typeof 42);        // number
console.log(typeof true);      // boolean
console.log(typeof undefined); // undefined
console.log(typeof null);      // object (quirk in JS!)
console.log(typeof Symbol());  // symbol
console.log(typeof 123n);      // bigint</code></pre>

  <h2>🔄 Type Conversion</h2>
  <h3>Explicit Conversion</h3>
  <pre><code>let str = String(123);   // "123"
let num = Number("456"); // 456
let bool = Boolean(0);   // false</code></pre>

  <h3>Implicit Conversion (Type Coercion)</h3>
  <pre><code>console.log("5" + 1);  // "51" (string concatenation)
console.log("5" - 1);  // 4 (number subtraction)
console.log(true + 1); // 2</code></pre>

  <h2>⚠️ Common Pitfalls</h2>
  <ul>
    <li><code>null</code> is an object (historical bug in JS).</li>
    <li>Numbers can behave strangely due to floating-point math:  
      <pre><code>console.log(0.1 + 0.2); // 0.30000000000000004</code></pre></li>
    <li>Using <code>==</code> vs <code>===</code>:  
      <pre><code>console.log(5 == "5");  // true
console.log(5 === "5"); // false</code></pre></li>
  </ul>

  <h2>🧪 Practice Exercises</h2>
  <ol>
    <li>Create variables for your name, age, and favorite color. Print them.</li>
    <li>Try redeclaring a <code>let</code> variable. What happens?</li>
    <li>Use template literals to create a sentence using multiple variables.</li>
    <li>Convert a string into a number using <code>Number()</code>.</li>
    <li>Check the type of each variable using <code>typeof</code>.</li>
  </ol>

  <h2>🎯 Summary</h2>
  <ul>
    <li>Variables store data using <code>var</code>, <code>let</code>, and <code>const</code>.</li>
    <li>JavaScript has 7 primitive types and non-primitive types like objects, arrays, and functions.</li>
    <li><code>typeof</code> helps identify a variable’s type.</li>
    <li>Type conversion can be explicit or implicit (beware of coercion!).</li>
    <li>Always prefer <code>let</code> and <code>const</code> for clean, modern code.</li>
  </ul>

  <p>
    🎉 You now have a strong understanding of JavaScript variables and data types.  
    In the next lesson, we’ll explore <strong>Operators & Expressions</strong> in detail.
  </p>
</article>

    {title: " Control Flow in JavaScript", content: `<article>
  
  <p><strong>Word Count:</strong> ~1500</p>

  <h2>⚡ Introduction</h2>
  <p>
    So far, we’ve learned how to work with <strong>variables</strong>, <strong>data types</strong>, 
    and <strong>operators</strong>. But real programs need more than storing values and calculating results— 
    they need to <strong>make decisions</strong>. For example:
  </p>
  <ul>
    <li>Should a website show the login page or the dashboard?</li>
    <li>Is a student’s grade “Pass” or “Fail”?</li>
    <li>Which option in a dropdown menu did the user select?</li>
  </ul>
  <p>
    This is where <em>control flow</em> comes in. Control flow is the order in which individual 
    statements, instructions, or functions are executed or evaluated in a program.
  </p>
  <p>
    In JavaScript, the primary tools for controlling flow are:
  </p>
  <ul>
    <li><strong>Conditional statements</strong> (<code>if</code>, <code>else if</code>, <code>else</code>)</li>
    <li><strong>Switch statements</strong> (<code>switch</code>)</li>
    <li><strong>Loops</strong> (we’ll cover loops in the next lessons)</li>
  </ul>

  <h2>🔑 The <code>if</code> Statement</h2>
  <p>
    The <code>if</code> statement allows us to run a block of code only if a condition is true.
  </p>

  <pre><code>let age = 20;

if (age &gt;= 18) {
  console.log("You are an adult.");
}</code></pre>

  <p>
    In this case, since <code>age</code> is 20, which is greater than 18, the condition 
    evaluates to <code>true</code>, so the message prints.
  </p>

  <h2>🧩 The <code>else</code> Clause</h2>
  <p>
    Sometimes we want to do one thing if the condition is true, and another if it’s false. 
    That’s where <code>else</code> comes in.
  </p>

  <pre><code>let age = 15;

if (age &gt;= 18) {
  console.log("You are an adult.");
} else {
  console.log("You are a minor.");
}</code></pre>

  <p>
    Output: <code>You are a minor.</code>
  </p>

  <h2>🔗 The <code>else if</code> Ladder</h2>
  <p>
    What if we have multiple conditions to check? We use <code>else if</code>.
  </p>

  <pre><code>let score = 85;

if (score &gt;= 90) {
  console.log("Grade: A");
} else if (score &gt;= 80) {
  console.log("Grade: B");
} else if (score &gt;= 70) {
  console.log("Grade: C");
} else {
  console.log("Grade: F");
}</code></pre>

  <p>
    Since the score is 85, the output is <code>Grade: B</code>.
  </p>

  <h3>✅ Best Practices for If-Else</h3>
  <ul>
    <li>Put the most likely condition first for efficiency.</li>
    <li>Avoid deeply nested <code>if</code> structures—consider <code>switch</code> for clarity.</li>
    <li>Use braces <code>{ }</code> even for single-line conditions (for readability and safety).</li>
  </ul>

  <h2>🔄 Nested If Statements</h2>
  <p>
    You can place one <code>if</code> inside another. This is called nesting.
  </p>

  <pre><code>let user = "admin";
let isLoggedIn = true;

if (isLoggedIn) {
  if (user === "admin") {
    console.log("Welcome, admin!");
  } else {
    console.log("Welcome, user!");
  }
} else {
  console.log("Please log in first.");
}</code></pre>

  <p>
    While nesting is useful, it can make code harder to read if overused.
  </p>

  <h2>🎭 Truthy and Falsy Values</h2>
  <p>
    In JavaScript, conditions don’t always evaluate to just <code>true</code> or <code>false</code>. 
    Values are automatically converted to <strong>truthy</strong> or <strong>falsy</strong>.
  </p>
  <p><strong>Falsy values:</strong> <code>false</code>, <code>0</code>, <code>""</code> (empty string), <code>null</code>, <code>undefined</code>, <code>NaN</code></p>
  <p>Everything else is <strong>truthy</strong>.</p>

  <pre><code>if ("hello") {
  console.log("This runs because 'hello' is truthy.");
}

if (0) {
  console.log("This will NOT run, because 0 is falsy.");
}</code></pre>

  <h2>🧮 Using Logical Operators in Conditions</h2>
  <p>
    Logical operators (<code>&amp;&amp;</code>, <code>||</code>, <code>!</code>) are commonly used in 
    <code>if</code> statements.
  </p>

  <pre><code>let age = 25;
let hasTicket = true;

if (age &gt;= 18 &amp;&amp; hasTicket) {
  console.log("You can enter the concert.");
}

if (age &lt; 18 || !hasTicket) {
  console.log("You cannot enter.");
}</code></pre>

  <h2>🔀 The <code>switch</code> Statement</h2>
  <p>
    The <code>switch</code> statement is an alternative to multiple <code>else if</code>. 
    It’s often cleaner when checking one variable against many possible values.
  </p>

  <pre><code>let day = "Tuesday";

switch (day) {
  case "Monday":
    console.log("Start of the week!");
    break;
  case "Tuesday":
    console.log("Second day of the week.");
    break;
  case "Friday":
    console.log("Almost weekend!");
    break;
  default:
    console.log("Just another day.");
}</code></pre>

  <p>
    Since <code>day</code> is "Tuesday", the output is <code>Second day of the week.</code>
  </p>

  <h3>🔑 The <code>break</code> Statement</h3>
  <p>
    Without <code>break</code>, JavaScript continues executing the next cases (called 
    <strong>fall-through</strong> behavior).
  </p>

  <pre><code>let color = "red";

switch (color) {
  case "red":
    console.log("Color is red");
  case "blue":
    console.log("Color is blue");
  default:
    console.log("Unknown color");
}</code></pre>

  <p>
    Output:
  </p>
  <pre><code>Color is red
Color is blue
Unknown color</code></pre>

  <p>
    To prevent this, always use <code>break</code> unless fall-through is intentional.
  </p>

  <h2>🌀 Grouping Cases in Switch</h2>
  <p>
    Sometimes multiple cases share the same output. You can group them.
  </p>

  <pre><code>let fruit = "apple";

switch (fruit) {
  case "apple":
  case "banana":
  case "mango":
    console.log("This is a fruit.");
    break;
  default:
    console.log("Not a fruit.");
}</code></pre>

  <h2>⚖️ When to Use If-Else vs Switch</h2>
  <ul>
    <li>Use <code>if-else</code> for range checks or complex conditions.</li>
    <li>Use <code>switch</code> when comparing one variable to many exact values.</li>
  </ul>

  <h2>🛠️ Real-World Example: Login System</h2>
  <pre><code>let username = "admin";
let password = "1234";

if (username === "admin" &amp;&amp; password === "1234") {
  console.log("Login successful!");
} else if (username === "admin") {
  console.log("Wrong password.");
} else {
  console.log("User not found.");
}</code></pre>

  <h2>⚠️ Common Mistakes</h2>
  <ul>
    <li>Forgetting <code>break</code> in <code>switch</code> cases.</li>
    <li>Using <code>==</code> instead of <code>===</code> in conditions.</li>
    <li>Not handling the <code>default</code> case in a <code>switch</code>.</li>
    <li>Relying too much on nested <code>if</code>, which makes code messy.</li>
  </ul>

  <h2>🧪 Practice Exercises</h2>
  <ol>
    <li>Write a program that checks if a number is positive, negative, or zero using <code>if-else</code>.</li>
    <li>Use <code>if-else if</code> to assign grades based on a score.</li>

    <li>Practice grouping cases in <code>switch</code> for months (e.g., Jan, Mar, May → 31 days).</li>
  </ol>

  <h2>🎯 Summary</h2>
  <ul>
    <li><code>if</code>, <code>else if</code>, <code>else</code> are used for decision making.</li>
    <li><code>switch</code> is better for multiple exact matches.</li>
    <li>Truthy and falsy values affect conditions.</li>
    <li>Logical operators help combine conditions.</li>
    <li>Use <code>===</code> for accurate comparisons, and always include <code>break</code> in switches.</li>
  </ul>

  <p>
    🎉 Awesome work! You now understand how to control program flow with conditions.  
    Next up: <strong>Lesson 5: Loops in JavaScript (for, while, do-while)</strong> — 
    where we’ll repeat actions efficiently.
  </p>
</article>

     <article>
  <p><strong>Word Count:</strong> ~1500</p>

  <h2>⚡ Introduction</h2>
  <p>
    Imagine you are asked to print the numbers <code>1</code> to <code>100</code>. Without loops, 
    you would need to write <code>console.log()</code> one hundred times! That would be repetitive, 
    boring, and impossible to maintain. This is why programming languages like JavaScript 
    provide <strong>loops</strong>.
  </p>
  <p>
    A <strong>loop</strong> allows us to repeat a block of code multiple times until a condition is met. 
    Loops help reduce repetition, make code cleaner, and solve problems that involve 
    <em>iteration</em> (repeating tasks).
  </p>
  <p>
    In JavaScript, the most common loops are:
  </p>
  <ul>
    <li><code>for</code> loop</li>
    <li><code>while</code> loop</li>
    <li><code>do...while</code> loop</li>
  </ul>

  <h2>🔄 The <code>for</code> Loop</h2>
  <p>
    The <code>for</code> loop is used when you know <em>exactly</em> how many times you want to repeat code.
    Its structure has three parts:
  </p>
  <pre><code>for (initialization; condition; update) {
  // code block
}</code></pre>

  <ul>
    <li><strong>Initialization</strong> → runs once before the loop starts (e.g., <code>let i = 0</code>)</li>
    <li><strong>Condition</strong> → checked before every iteration (loop continues if <code>true</code>)</li>
    <li><strong>Update</strong> → executed after each iteration (e.g., <code>i++</code>)</li>
  </ul>

  <h3>✅ Example 1: Print numbers 1–5</h3>
  <pre><code>for (let i = 1; i &lt;= 5; i++) {
  console.log("Number:", i);
}</code></pre>
  <p>Output:</p>
  <pre><code>Number: 1
Number: 2
Number: 3
Number: 4
Number: 5</code></pre>

  <h3>✅ Example 2: Sum of numbers 1–10</h3>
  <pre><code>let sum = 0;

for (let i = 1; i &lt;= 10; i++) {
  sum += i;
}

console.log("Sum =", sum);</code></pre>
  <p>Output: <code>Sum = 55</code></p>

  <h2>🌀 Nested <code>for</code> Loops</h2>
  <p>
    Loops can be placed inside other loops. These are called nested loops and are often 
    used for working with 2D structures like grids or tables.
  </p>
  <h3>✅ Example: Multiplication Table</h3>
  <pre><code>for (let i = 1; i &lt;= 3; i++) {
  for (let j = 1; j &lt;= 3; j++) {
    console.log(i + " x " + j + " = " + (i * j));
  }
}</code></pre>

  <h2>🔄 The <code>while</code> Loop</h2>
  <p>
    A <code>while</code> loop repeats as long as a condition is true. 
    Unlike <code>for</code>, the number of iterations may not be known beforehand.
  </p>
  <pre><code>while (condition) {
  // code block
}</code></pre>

  <h3>✅ Example: Count 1–5 with while</h3>
  <pre><code>let i = 1;

while (i &lt;= 5) {
  console.log(i);
  i++;
}</code></pre>

  <h3>✅ Example: Guessing Game (simplified)</h3>
  <pre><code>let secret = 7;
let guess = 0;

while (guess !== secret) {
  guess = Math.floor(Math.random() * 10) + 1;
  console.log("Guess:", guess);
}

console.log("You guessed it!");</code></pre>

  <h2>🔄 The <code>do...while</code> Loop</h2>
  <p>
    The <code>do...while</code> loop is similar to <code>while</code>, except it guarantees 
    the block runs at least once, even if the condition is false.
  </p>
  <pre><code>do {
  // code block
} while (condition);</code></pre>

  <h3>✅ Example: Run once even if condition is false</h3>
  <pre><code>let count = 10;

do {
  console.log("Count:", count);
  count++;
} while (count &lt; 5);</code></pre>
  <p>
    Output: <code>Count: 10</code> (even though condition was false initially).
  </p>

  <h2>⚡ Loop Control Statements</h2>
  <h3>🔹 The <code>break</code> Statement</h3>
  <p>
    Used to exit a loop immediately.
  </p>
  <pre><code>for (let i = 1; i &lt;= 10; i++) {
  if (i === 5) {
    break;
  }
  console.log(i);
}</code></pre>
  <p>Output: <code>1 2 3 4</code></p>

  <h3>🔹 The <code>continue</code> Statement</h3>
  <p>
    Skips the current iteration and jumps to the next one.
  </p>
  <pre><code>for (let i = 1; i &lt;= 5; i++) {
  if (i === 3) {
    continue;
  }
  console.log(i);
}</code></pre>
  <p>Output: <code>1 2 4 5</code></p>

  <h2>🧩 Infinite Loops (⚠️ Dangerous!)</h2>
  <p>
    If the condition never becomes false, a loop can run forever. 
    These are called <em>infinite loops</em>, and they can crash your program.
  </p>
  <pre><code>// Be careful! Infinite loop example:

  console.log("Running forever...");
}</code></pre>

  <h2>📚 Real-World Examples of Loops</h2>
  <h3>1️⃣ Iterating over an Array</h3>
  <pre><code>let fruits = ["apple", "banana", "mango"];

for (let i = 0; i &lt; fruits.length; i++) {
  console.log(fruits[i]);
}</code></pre>

  <h3>2️⃣ Searching for an Element</h3>
  <pre><code>let numbers = [1, 3, 5, 7, 9];

for (let i = 0; i &lt; numbers.length; i++) {
  if (numbers[i] === 7) {
    found = true;
    break;
  }
}

console.log(found ? "Found!" : "Not Found!");</code></pre>

  <h3>3️⃣ Form Validation</h3>
  <pre><code>let inputs = ["name", "", "email"];
let allFilled = true;

for (let i = 0; i &lt; inputs.length; i++) {
  if (inputs[i] === "") {
    allFilled = false;
    break;
  }
}

console.log(allFilled ? "Form is complete" : "Form is incomplete");</code></pre>

  <h2>⚖️ Choosing Between for, while, and do-while</h2>
  <ul>
    <li>Use <strong>for</strong> → when you know how many times you want to loop.</li>
    <li>Use <strong>while</strong> → when the loop continues until a condition is met.</li>
    <li>Use <strong>do...while</strong> → when you want the code to run at least once before checking the condition.</li>
  </ul>

  <h2>⚠️ Common Mistakes</h2>
  <ul>
    <li>Forgetting to update the counter (causes infinite loops).</li>
    <li>Using <code>==</code> instead of <code>===</code> in conditions.</li>
    <li>Misplacing <code>break</code> or <code>continue</code>.</li>
    <li>Nesting too many loops → leads to “spaghetti code.”</li>
  </ul>

  <h2>🧪 Practice Exercises</h2>
  <ol>
    <li>Write a <code>for</code> loop that prints numbers from 1 to 100.</li>

    {title: "Functions in JavaScript", content: `<article>
  <p><strong>Word Count:</strong> ~1500</p>

  <h2>⚡ Introduction</h2>
  <p>
    In programming, we often need to perform the same task multiple times. 
    Instead of rewriting the same block of code again and again, we use 
    <strong>functions</strong>. Functions allow us to group a set of instructions together, 
    give them a name, and reuse them whenever needed.
  </p>
  <p>
    In simple words: a <strong>function</strong> is like a recipe. You define it once, and you 
    can cook the dish as many times as you want just by calling it.
  </p>

  <h2>🔑 What is a Function?</h2>
  <p>
    A function is a block of reusable code designed to perform a single task. 
    Functions help keep programs <strong>organized, readable, and reusable</strong>.
  </p>

  <h3>✅ Syntax</h3>
  <pre><code>function functionName(parameters) {
  // code to be executed
}</code></pre>

  <h3>✅ Example: Simple Function</h3>
  <pre><code>function greet() {
  console.log("Hello, welcome to JavaScript!");
}

greet(); // Calling the function</code></pre>
  <p>
    Output: <code>Hello, welcome to JavaScript!</code>
  </p>

  <h2>📦 Function Parameters and Arguments</h2>
  <p>
    Functions can accept inputs called <strong>parameters</strong>. When calling a function, 
    we pass values called <strong>arguments</strong>.
  </p>

  <h3>✅ Example: Function with Parameters</h3>
  <pre><code>function greetUser(name) {
  console.log("Hello, " + name + "!");
}

greetUser("Alice");
greetUser("Bob");</code></pre>
  <p>
    Output:
  </p>
  <pre><code>Hello, Alice!
Hello, Bob!</code></pre>

  <h2>🔙 Return Values</h2>
  <p>
    Functions can return a result using the <code>return</code> keyword. 
    Returning makes functions more powerful because the output can be reused.
  </p>

  <h3>✅ Example: Function that Returns a Value</h3>
  <pre><code>function add(a, b) {
  return a + b;
}

let sum = add(5, 3);
console.log("Sum =", sum);</code></pre>
  <p>Output: <code>Sum = 8</code></p>

  <h2>📝 Function Declarations vs Expressions</h2>
  <h3>1️⃣ Function Declaration</h3>
  <pre><code>function multiply(x, y) {
  return x * y;
}</code></pre>

  <h3>2️⃣ Function Expression</h3>
  <pre><code>let multiply = function(x, y) {
  return x * y;
};</code></pre>
  <p>
    Both work the same way, but function expressions can be assigned to variables.
  </p>

  <h2>⚡ Arrow Functions (ES6)</h2>
  <p>
    Introduced in ES6, <strong>arrow functions</strong> provide a shorter syntax.
  </p>
  <pre><code>// Traditional
function square(x) {
  return x * x;
}

// Arrow function
const square = (x) =&gt; x * x;

console.log(square(4)); // 16</code></pre>

  <h2>📌 Default Parameters</h2>
  <p>
    JavaScript functions allow default values for parameters.
  </p>
  <pre><code>function greet(name = "Guest") {
  console.log("Hello, " + name);
}

greet();       // Hello, Guest
greet("Alice"); // Hello, Alice</code></pre>

  <h2>📦 Rest Parameters (...args)</h2>
  <p>
    Rest parameters let a function accept any number of arguments as an array.
  </p>
  <pre><code>function sumAll(...numbers) {
  let total = 0;
  for (let num of numbers) {
    total += num;
  }
  return total;
}

console.log(sumAll(1, 2, 3, 4)); // 10</code></pre>

  <h2>🔁 Functions and Scope</h2>
  <p>
    <strong>Scope</strong> determines where variables can be accessed. 
    JavaScript has <strong>global scope</strong> and <strong>local scope</strong>.
  </p>

  <h3>✅ Example: Local vs Global Scope</h3>
  <pre><code>let globalVar = "I am global";

function testScope() {
  let localVar = "I am local";
  console.log(globalVar); // Accessible
  console.log(localVar);  // Accessible
}

testScope();
console.log(localVar); // ❌ Error: not defined</code></pre>

  <h2>📌 Function Hoisting</h2>
  <p>
    Function declarations are “hoisted” to the top of their scope, 
    meaning they can be called before they’re defined.
  </p>

  <pre><code>sayHello();

function sayHello() {
  console.log("Hello!");
}</code></pre>

  <h2>🌀 Anonymous Functions</h2>
  <p>
    Functions without a name are called <strong>anonymous functions</strong>. 
    They are often used in event listeners or passed as arguments.
  </p>

  <pre><code>setTimeout(function() {
  console.log("This runs after 2 seconds");
}, 2000);</code></pre>

  <h2>⚡ Higher-Order Functions</h2>
  <p>
    A function that takes another function as an argument or returns a function 
    is called a <strong>higher-order function</strong>.
  </p>

  <pre><code>function operate(a, b, operation) {
  return operation(a, b);
}

function add(x, y) {
  return x + y;
}

console.log(operate(5, 3, add)); // 8</code></pre>

  <h2>📦 Callback Functions</h2>
  <p>
    When a function is passed as an argument to another function and then executed, 
    it’s called a <strong>callback</strong>.
  </p>

  <pre><code>function greetUser(name, callback) {
  console.log("Hello, " + name);
  callback();
}

function sayBye() {
  console.log("Goodbye!");
}

greetUser("Alice", sayBye);</code></pre>
  <p>Output:</p>
  <pre><code>Hello, Alice
Goodbye!</code></pre>

  <h2>🧩 Recursive Functions</h2>
  <p>
    A function that calls itself is called a <strong>recursive function</strong>. 
    Recursion is useful for tasks like factorial, Fibonacci, and traversing trees.
  </p>

  <pre><code>function factorial(n) {
  if (n === 0) {
    return 1;
  }
  return n * factorial(n - 1);
}

console.log(factorial(5)); // 120</code></pre>

  <h2>📚 Real-World Uses of Functions</h2>
  <ul>
    <li>Form validation (e.g., checking if an email is valid)</li>
    <li>Calculating totals in an e-commerce cart</li>
    <li>Reusable utilities like converting temperatures</li>
    <li>Event handling in web applications</li>
  </ul>

  <h2>⚠️ Common Mistakes</h2>
  <ul>
    <li>Forgetting to return a value when needed</li>
    <li>Confusing parameters with arguments</li>
    <li>Reusing variable names and causing scope issues</li>
    <li>Overusing global variables</li>
  </ul>

  <h2>🧪 Practice Exercises</h2>
  <ol>
    <li>Write a function that takes a number and returns whether it’s even or odd.</li>
    <li>Create a function that takes two numbers and returns the larger one.</li>
    <li>Write a recursive function to compute the Fibonacci sequence.</li>
    <li>Use an arrow function to calculate the area of a rectangle.</li>
    <li>Make a higher-order function that applies a discount to a list of prices.</li>
  </ol>

  <h2>🎯 Summary</h2>
  <ul>
    <li>Functions make code reusable and modular.</li>
    <li>They can accept inputs (parameters) and return outputs.</li>
    <li>JavaScript supports declarations, expressions, and arrow functions.</li>
    <li>Advanced concepts include recursion, callbacks, and higher-order functions.</li>
  </ul>

  <p>
    🎉 Well done! You’ve mastered functions in JavaScript.  
    Next up: <strong>Lesson 7: Objects in JavaScript</strong> — 
    where we’ll explore how to structure and organize data.
  </p>
</article>

    `},
    {title: "Objects in JavaScript", content: `<article>
  <p><strong>Word Count:</strong> ~1500</p>

  <h2>⚡ Introduction</h2>
  <p>
    In JavaScript, almost everything is an <strong>object</strong>. Objects allow you to group data 
    (properties) and behavior (methods) into a single entity. They are one of the most important 
    building blocks of JavaScript programming. If variables and data types are the foundation, 
    <strong>objects are the walls and furniture</strong> that make your program useful and structured.
  </p>

  <h2>🔑 What is an Object?</h2>
  <p>
    An object is a collection of key–value pairs. Keys are called <strong>properties</strong> 
    (or methods if the value is a function).
  </p>

  <h3>✅ Example: Creating a Simple Object</h3>
  <pre><code>let person = {
  name: "Alice",
  age: 25,
  isStudent: true
};

console.log(person.name);  // Alice
console.log(person.age);   // 25
console.log(person.isStudent); // true</code></pre>

  <p>
    Here, <code>name</code>, <code>age</code>, and <code>isStudent</code> are properties of the 
    <code>person</code> object.
  </p>

  <h2>📦 Creating Objects</h2>
  <h3>1️⃣ Object Literals</h3>
  <pre><code>let car = {
  brand: "Toyota",
  model: "Corolla",
  year: 2022
};</code></pre>

  <h3>2️⃣ Using <code>new Object()</code></h3>
  <pre><code>let car = new Object();
car.brand = "Toyota";
car.model = "Corolla";</code></pre>

  <h3>3️⃣ Using a Constructor Function</h3>
  <pre><code>function Car(brand, model) {
  this.brand = brand;
  this.model = model;
}

let myCar = new Car("Honda", "Civic");
console.log(myCar.brand); // Honda</code></pre>

  <h3>4️⃣ Using ES6 Classes</h3>
  <pre><code>class Car {
  constructor(brand, model) {
    this.brand = brand;
    this.model = model;
  }
}

let car1 = new Car("Tesla", "Model 3");
console.log(car1.model); // Model 3</code></pre>

  <h2>📌 Accessing Object Properties</h2>
  <p>There are two ways:</p>
  <ul>
    <li><strong>Dot notation</strong> – <code>object.property</code></li>
    <li><strong>Bracket notation</strong> – <code>object["property"]</code></li>
  </ul>

  <pre><code>let person = { name: "Bob", age: 30 };

console.log(person.name);     // Dot notation -> Bob
console.log(person["age"]);   // Bracket notation -> 30</code></pre>

  <h2>🛠️ Adding, Updating, and Deleting Properties</h2>
  <pre><code>let user = { username: "admin" };

// Add
user.email = "admin@example.com";

// Update
user.username = "superadmin";

// Delete
delete user.email;

console.log(user);</code></pre>

  <h2>⚡ Methods in Objects</h2>
  <p>
    If a property’s value is a function, it is called a <strong>method</strong>.
  </p>

  <pre><code>let calculator = {
  add: function(a, b) {
    return a + b;
  },
  multiply(a, b) {   // Shorthand method
    return a * b;
  }
};

console.log(calculator.add(3, 4));     // 7
console.log(calculator.multiply(3, 4)); // 12</code></pre>

  <h2>📍 The <code>this</code> Keyword</h2>
  <p>
    Inside an object method, <code>this</code> refers to the object itself.
  </p>

  <pre><code>let person = {
  name: "Charlie",
  greet: function() {
    console.log("Hello, my name is " + this.name);
  }
};

person.greet(); // Hello, my name is Charlie</code></pre>

  <h2>🔁 Nested Objects</h2>
  <pre><code>let student = {
  name: "David",
  grades: {
    math: 90,
    science: 85
  }
};

console.log(student.grades.math); // 90</code></pre>

  <h2>📦 Objects Inside Arrays</h2>
  <pre><code>let users = [
  { id: 1, name: "Alice" },
  { id: 2, name: "Bob" }
];

console.log(users[0].name); // Alice</code></pre>

  <h2>🧩 Object Destructuring</h2>
  <p>ES6 introduced destructuring to extract values easily.</p>
  <pre><code>let user = { name: "Eve", age: 28 };

let { name, age } = user;
console.log(name); // Eve
console.log(age);  // 28</code></pre>

  <h2>📦 Spread Operator with Objects</h2>
  <pre><code>let obj1 = { a: 1, b: 2 };
let obj2 = { ...obj1, c: 3 };

console.log(obj2); // { a: 1, b: 2, c: 3 }</code></pre>

  <h2>⚡ Object Methods (Built-in)</h2>
  <ul>
    <li><code>Object.keys(obj)</code> – returns all keys</li>
    <li><code>Object.values(obj)</code> – returns all values</li>
    <li><code>Object.entries(obj)</code> – returns key-value pairs</li>
    <li><code>Object.assign(target, source)</code> – copies properties</li>
    <li><code>Object.freeze(obj)</code> – makes object immutable</li>
  </ul>

  <pre><code>let book = { title: "JS Guide", author: "John" };

console.log(Object.keys(book));   // ["title", "author"]
console.log(Object.values(book)); // ["JS Guide", "John"]</code></pre>

  <h2>🌀 Object References and Copying</h2>
  <p>
    Objects are assigned by reference, not by value.
  </p>
  <pre><code>let obj1 = { name: "Sam" };
let obj2 = obj1; // Both refer to same object

obj2.name = "Tom";
console.log(obj1.name); // Tom</code></pre>

  <h3>✅ Copying with <code>Object.assign</code></h3>
  <pre><code>let obj1 = { x: 10 };
let obj2 = Object.assign({}, obj1);

obj2.x = 20;
console.log(obj1.x); // 10</code></pre>

  <h3>✅ Copying with Spread</h3>
  <pre><code>let obj1 = { x: 5 };
let obj2 = { ...obj1 };

obj2.x = 100;
console.log(obj1.x); // 5</code></pre>

  <h2>🧩 JSON (JavaScript Object Notation)</h2>
  <p>
    JSON is a text format for storing and transferring data, based on objects.
  </p>
  <pre><code>let user = { name: "Anna", age: 22 };

let jsonStr = JSON.stringify(user); // Convert object to JSON string
console.log(jsonStr); // {"name":"Anna","age":22}

let newUser = JSON.parse(jsonStr);  // Convert JSON string to object
console.log(newUser.name); // Anna</code></pre>

  <h2>⚠️ Common Mistakes with Objects</h2>
  <ul>
    <li>Forgetting that objects are references (changing one changes the other)</li>
    <li>Using <code>for...in</code> without filtering inherited properties</li>
    <li>Overusing global objects and polluting the namespace</li>
    <li>Not freezing objects when immutability is required</li>
  </ul>

  <h2>📚 Real-World Use Cases</h2>
  <ul>
    <li>Storing user profiles in apps</li>
    <li>Keeping configuration settings</li>
    <li>Handling API responses (which usually return JSON objects)</li>
    <li>Grouping related functions (like Math object: <code>Math.max()</code>)</li>
  </ul>

  <h2>🧪 Practice Exercises</h2>
  <ol>
    <li>Create an object <code>book</code> with properties: title, author, year. Add a method <code>getSummary</code> that returns a string summary.</li>
    <li>Write a function that takes an object and returns the number of keys.</li>
    <li>Make an array of objects representing students (name, grade). Print names of students with grade &gt; 80.</li>
    <li>Use destructuring to extract <code>username</code> and <code>email</code> from a <code>user</code> object.</li>
    <li>Convert a JavaScript object into JSON and back to an object.</li>
  </ol>

  <h2>🎯 Summary</h2>
  <ul>
    <li>Objects group properties (data) and methods (functions).</li>
    <li>They can be created using literals, constructors, or classes.</li>
    <li><code>this</code> refers to the object inside methods.</li>
    <li>Objects can be nested, copied, destructured, and frozen.</li>
    <li>JSON is based on JavaScript objects and is widely used in APIs.</li>
  </ul>

  <p>
    🎉 Excellent! You’ve learned all about objects in JavaScript.  
    Next up: <strong>Lesson 8: Arrays in JavaScript</strong>, where we’ll dive into 
    another fundamental structure for handling lists of data.
  </p>
</article>

    `},
    {title: "Arrays in JavaScript", content: `<article>
  <p><strong>Word Count:</strong> ~1500</p>

  <h2>⚡ Introduction</h2>
  <p>
    In JavaScript, an <strong>array</strong> is a special type of object used to 
    store multiple values in a single variable. Unlike regular variables that hold 
    only one value, arrays let us store <strong>ordered collections</strong> of data 
    such as numbers, strings, objects, or even other arrays.
  </p>
  <p>
    Arrays are one of the most powerful and commonly used data structures 
    in JavaScript. They’re essential when working with lists of data like 
    user records, products, messages, or search results.
  </p>

  <h2>🔑 What is an Array?</h2>
  <p>
    An array is an ordered collection of values, where each value is 
    called an <strong>element</strong>, and each element has an index. 
    Array indices in JavaScript are <strong>zero-based</strong>, 
    meaning the first element is at index <code>0</code>.
  </p>

  <h3>✅ Example: Creating an Array</h3>
  <pre><code>let fruits = ["Apple", "Banana", "Cherry"];
console.log(fruits[0]); // Apple
console.log(fruits[1]); // Banana</code></pre>

  <h2>📦 Creating Arrays</h2>
  <h3>1️⃣ Using Array Literals</h3>
  <pre><code>let numbers = [10, 20, 30, 40];</code></pre>

  <h3>2️⃣ Using the Array Constructor</h3>
  <pre><code>let numbers = new Array(10, 20, 30);</code></pre>

  <h3>3️⃣ Creating Empty Arrays</h3>
  <pre><code>let emptyArray = [];
let anotherEmpty = new Array();</code></pre>

  <h2>📌 Accessing Array Elements</h2>
  <pre><code>let colors = ["Red", "Green", "Blue"];
console.log(colors[0]); // Red
console.log(colors[2]); // Blue</code></pre>

  <p>If you access an index that doesn’t exist, you get <code>undefined</code>.</p>
  <pre><code>console.log(colors[5]); // undefined</code></pre>

  <h2>🛠️ Adding & Updating Elements</h2>
  <pre><code>let animals = ["Dog", "Cat"];
animals[2] = "Elephant"; // Add
animals[1] = "Tiger";    // Update

console.log(animals); // ["Dog", "Tiger", "Elephant"]</code></pre>

  <h2>🧹 Removing Elements</h2>
  <pre><code>let fruits = ["Apple", "Banana", "Cherry"];
delete fruits[1]; 
console.log(fruits); // ["Apple", empty, "Cherry"]</code></pre>

  <p>
    ❌ Not recommended, because it leaves an empty slot. 
    Instead, use <code>splice()</code> for proper removal.
  </p>

  <h2>🔁 Array Length</h2>
  <pre><code>let arr = [1, 2, 3, 4];
console.log(arr.length); // 4</code></pre>

  <h2>⚡ Common Array Methods</h2>
  <h3>1️⃣ push() and pop()</h3>
  <pre><code>let fruits = ["Apple", "Banana"];
fruits.push("Cherry"); // Add at end
console.log(fruits);   // ["Apple", "Banana", "Cherry"]

fruits.pop(); // Remove last element
console.log(fruits);   // ["Apple", "Banana"]</code></pre>

  <h3>2️⃣ shift() and unshift()</h3>
  <pre><code>let numbers = [2, 3, 4];
numbers.unshift(1); // Add at start
console.log(numbers); // [1, 2, 3, 4]

numbers.shift(); // Remove first element
console.log(numbers); // [2, 3, 4]</code></pre>

  <h3>3️⃣ splice()</h3>
  <p>Used to add, remove, or replace elements.</p>
  <pre><code>let colors = ["Red", "Green", "Blue"];
colors.splice(1, 1, "Yellow"); 
console.log(colors); // ["Red", "Yellow", "Blue"]</code></pre>

  <h3>4️⃣ slice()</h3>
  <p>Returns a shallow copy of a portion of an array.</p>
  <pre><code>let arr = [10, 20, 30, 40];
let newArr = arr.slice(1, 3);
console.log(newArr); // [20, 30]</code></pre>

  <h3>5️⃣ concat()</h3>
  <pre><code>let a = [1, 2];
let b = [3, 4];
let combined = a.concat(b);
console.log(combined); // [1, 2, 3, 4]</code></pre>

  <h3>6️⃣ indexOf() and includes()</h3>
  <pre><code>let fruits = ["Apple", "Banana", "Cherry"];
console.log(fruits.indexOf("Banana")); // 1
console.log(fruits.includes("Grapes")); // false</code></pre>

  <h2>🌀 Iterating Over Arrays</h2>
  <h3>✅ for loop</h3>
  <pre><code>let arr = [1, 2, 3];
for (let i = 0; i &lt; arr.length; i++) {
  console.log(arr[i]);
}</code></pre>

  <h3>✅ for...of loop</h3>
  <pre><code>for (let value of arr) {
  console.log(value);
}</code></pre>

  <h3>✅ forEach()</h3>
  <pre><code>arr.forEach(function(num) {
  console.log(num);
});</code></pre>

  <h2>⚡ Higher-Order Array Methods</h2>
  <h3>1️⃣ map()</h3>
  <p>Creates a new array by transforming each element.</p>
  <pre><code>let numbers = [1, 2, 3];
let squares = numbers.map(x =&gt; x * x);
console.log(squares); // [1, 4, 9]</code></pre>

  <h3>2️⃣ filter()</h3>
  <pre><code>let ages = [10, 20, 30, 40];
let adults = ages.filter(age =&gt; age &gt;= 18);
console.log(adults); // [20, 30, 40]</code></pre>

  <h3>3️⃣ reduce()</h3>
  <pre><code>let numbers = [1, 2, 3, 4];
let sum = numbers.reduce((acc, val) =&gt; acc + val, 0);
console.log(sum); // 10</code></pre>

  <h3>4️⃣ find() and findIndex()</h3>
  <pre><code>let arr = [5, 12, 8, 130];
console.log(arr.find(x =&gt; x &gt; 10)); // 12
console.log(arr.findIndex(x =&gt; x &gt; 10)); // 1</code></pre>

  <h3>5️⃣ sort()</h3>
  <pre><code>let fruits = ["Banana", "Apple", "Cherry"];
fruits.sort();
console.log(fruits); // ["Apple", "Banana", "Cherry"]</code></pre>

  <p>⚠️ By default, <code>sort()</code> treats elements as strings. Use a compare function for numbers:</p>
  <pre><code>let nums = [10, 2, 5];
nums.sort((a, b) =&gt; a - b);
console.log(nums); // [2, 5, 10]</code></pre>

  <h2>🧩 Multidimensional Arrays</h2>
  <pre><code>let matrix = [
  [1, 2],
  [3, 4],
  [5, 6]
];

console.log(matrix[1][0]); // 3</code></pre>

  <h2>📦 Array Destructuring</h2>
  <pre><code>let numbers = [10, 20, 30];
let [a, b, c] = numbers;

  <p><strong>Word Count:</strong> ~1500</p>

  <h2>⚡ Introduction</h2>
  <p>
    Functions are one of the most important building blocks of JavaScript. 
    A <strong>function</strong> is a reusable block of code designed to perform 
    a specific task. Instead of writing the same code multiple times, 
    we define a function once and use it whenever needed. Functions make code 
    <em>modular, reusable, and easier to maintain</em>.
  </p>
  <p>
    Along with functions comes the concept of <strong>scope</strong>, 
    which determines where variables and functions are accessible in your program. 
    Understanding scope helps avoid bugs and prevents accidental overwriting of values.
  </p>

  <h2>📌 Defining a Function</h2>
  <h3>1️⃣ Function Declaration</h3>
  <pre><code>function greet() {
  console.log("Hello, World!");
}
greet(); // Hello, World!
</code></pre>

  <h3>2️⃣ Function Expression</h3>
  <pre><code>const greet = function() {
  console.log("Hello from function expression!");
};
greet();</code></pre>

  <h3>3️⃣ Arrow Function (ES6)</h3>
  <pre><code>const greet = () => {
  console.log("Hello from arrow function!");
};
greet();</code></pre>

  <p>
    Arrow functions are shorter but behave differently with <code>this</code>, 
    which we’ll explore later.
  </p>

  <h2>🎯 Function Parameters & Arguments</h2>
  <p>
    Parameters act like placeholders when defining a function. Arguments are the 
    actual values passed when calling the function.
  </p>
  <pre><code>function add(a, b) {
  return a + b;
}
console.log(greet()); // Hello, Guest!
console.log(greet("Alice")); // Hello, Alice!</code></pre>

  <h3>Rest Parameters</h3>
  <p>We can collect multiple arguments into a single parameter using <code>...</code>.</p>
  <pre><code>function sum(...numbers) {
  return numbers.reduce((a, b) => a + b, 0);
}
console.log(sum(1, 2, 3, 4)); // 10</code></pre>

  <h2>🔁 Returning Values</h2>
  <p>
    Functions can return values using the <code>return</code> keyword. 
    If no <code>return</code> is specified, the function returns <code>undefined</code>.
  </p>
  <pre><code>function square(n) {
  return n * n;
}
console.log(square(4)); // 16</code></pre>

  <h2>⚡ Function Scope</h2>
  <p>
    Scope defines where variables are accessible. In JavaScript, 
    we have:
  </p>
  <ul>
    <li><strong>Global Scope</strong> – Accessible anywhere.</li>
    <li><strong>Local/Function Scope</strong> – Accessible only inside the function.</li>
    <li><strong>Block Scope</strong> – (Introduced in ES6 with <code>let</code> and <code>const</code>).</li>
  </ul>

  <h3>Global Scope Example</h3>
  <pre><code>let globalVar = "I am global";

function showGlobal() {
  console.log(globalVar); 
}
showGlobal(); // I am global</code></pre>

  <h3>Local Scope Example</h3>
  <pre><code>function test() {
  let localVar = "I am local";
  console.log(localVar);
}
test();
// console.log(localVar); ❌ Error: localVar is not defined</code></pre>

  <h3>Block Scope Example</h3>
  <pre><code>{
  let blockVar = "Inside block";
  console.log(blockVar); // Works inside block
}
// console.log(blockVar); ❌ Error: blockVar is not defined</code></pre>

  <h2>🌐 Lexical Scope & Closures</h2>
  <p>
    Functions in JavaScript follow <strong>lexical scope</strong>, meaning 
    they remember the scope in which they were created. This leads to the concept of 
    <strong>closures</strong>.
  </p>

  <h3>Closure Example</h3>
  <pre><code>function outer() {
  let count = 0;

  function inner() {
    count++;
    return count;
  }
  return inner;
}

const counter = outer();
console.log(counter()); // 1
console.log(counter()); // 2</code></pre>

  <p>
    Here, <code>inner()</code> still has access to <code>count</code> 
    even after <code>outer()</code> has finished executing. This is closure in action.
  </p>

  <h2>📌 Hoisting in Functions</h2>
  <p>
    JavaScript <strong>hoists</strong> function declarations, 
    meaning you can call them before defining.
  </p>
  <pre><code>sayHello(); // Works
function sayHello() {
  console.log("Hello!");
}</code></pre>

  <p>
    But <strong>function expressions</strong> and <strong>arrow functions</strong> 
    are <em>not hoisted</em>.
  </p>
  <pre><code>sayHi(); // ❌ Error
const sayHi = function() {
  console.log("Hi!");
};</code></pre>

  <h2>⚡ Arrow Functions vs Regular Functions</h2>
  <p>
    The key difference lies in how they handle <code>this</code>.
  </p>
  <pre><code>const obj = {
  name: "Alice",
  regular: function() {
    console.log(this.name);
  },
  arrow: () => {
    console.log(this.name);
  }
};

obj.regular(); // Alice
obj.arrow();   // undefined (arrow doesn't bind its own this)</code></pre>

  <h2>🧩 Immediately Invoked Function Expressions (IIFE)</h2>
  <p>
    An <strong>IIFE</strong> is a function that runs immediately after being defined. 
    It is useful for creating isolated scopes.
  </p>
  <pre><code>(function() {
  console.log("IIFE executed!");
})();</code></pre>

  <h2>🧪 Practice Examples</h2>
  <ol>
    <li>Write a function to check if a number is prime.</li>
    <li>Write a function that reverses a string.</li>
    <li>Create a closure-based counter function with <code>increment()</code> and <code>reset()</code>.</li>
    <li>Use an arrow function to calculate the factorial of a number.</li>
    <li>Demonstrate the difference between <code>var</code>, <code>let</code>, and <code>const</code> inside functions.</li>
  </ol>

  <h2>📚 Real-World Applications</h2>
  <ul>
    <li>Functions are used for reusable code blocks (e.g., calculating totals in shopping carts).</li>
    <li>Closures power private variables in JavaScript libraries.</li>
    <li>Arrow functions are widely used in callbacks (event listeners, promises).</li>
    <li>IIFEs are used in older JavaScript to prevent global variable pollution.</li>
    <li>Scope control ensures variables don’t overwrite each other.</li>
  </ul>

  <h2>🎯 Summary</h2>
  <ul>
    <li>Functions allow reusable and modular code.</li>
    <li>Parameters can have defaults and rest operators.</li>
    <li>Scope determines variable accessibility: global, function, block.</li>
    <li>Closures enable functions to remember their lexical environment.</li>
    <li>Arrow functions are concise but handle <code>this</code> differently.</li>
    <li>IIFEs create isolated scopes.</li>
  </ul>

  <p>
    🎉 Congratulations! You now have a deep understanding of 
    <strong>Functions & Scope</strong> in JavaScript.  
    Next up: <strong>Lesson 11: Objects in Depth (Prototypes & Methods)</strong>.
  </p>
</article>

  <p><strong>Word Count:</strong> ~1500</p>

  <h2>⚡ Introduction</h2>
  <p>
    In JavaScript, <strong>objects</strong> are one of the most powerful 
    and flexible data structures. They are used to represent real-world entities 
    such as users, cars, or bank accounts. An object is essentially a collection

  </ul>

  <h2>📌 Object Methods & The <code>this</code> Keyword</h2>
  <p>
    Functions stored as object properties are called <strong>methods</strong>. 
    When invoked, they often need to access the object itself. This is where 
    <code>this</code> comes into play.
  </p>


};

  <p>
    Here, <code>this</code> refers to the object that called the method.
  </p>

  <h3>Arrow Functions & <code>this</code></h3>
  <p>

    they inherit it from the surrounding scope.
  </p>
};
user.greet(); // undefined
</code></pre>

  <p>
    In this case, <code>this</code> is not the object, but the 
    outer scope (likely <code>window</code> in browsers).
  </p>

  <h2>🔑 Property Descriptors</h2>
  <p>
    Every property in an object has metadata called a 
    <strong>property descriptor</strong>. We can use 
    <code>Object.getOwnPropertyDescriptor()</code> to inspect it.
  </p>

  <pre><code>const car = { brand: "Toyota" };
console.log(Object.getOwnPropertyDescriptor(car, "brand"));
/* 
{
  value: "Toyota",

  enumerable: true,
  configurable: true
}
*/</code></pre>

  <h3>Defining Properties</h3>
  <pre><code>Object.defineProperty(car, "year", {
  value: 2025,
  writable: false,
  enumerable: false,
  configurable: false
});
console.log(car.year); // 2025
car.year = 2030; // ❌ No effect, not writable
</code></pre>

  <ul>
    <li><strong>writable</strong>: Can the value be changed?</li>
    <li><strong>enumerable</strong>: Will it appear in loops?</li>
    <li><strong>configurable</strong>: Can the property be deleted or modified?</li>
  </ul>

  <h2>📦 Object Copying & Merging</h2>
  <h3>Shallow Copy with Object.assign()</h3>
  <pre><code>const obj1 = { a: 1 };
const obj2 = { b: 2 };
const merged = Object.assign({}, obj1, obj2);
console.log(merged); // { a: 1, b: 2 }</code></pre>

  <h3>Spread Operator</h3>
  <pre><code>const combined = { ...obj1, ...obj2 };
console.log(combined); // { a: 1, b: 2 }</code></pre>

  <h3>Deep Copy Issue</h3>
  <pre><code>const nested = { a: { b: 1 } };
const copy = { ...nested };
copy.a.b = 2;
console.log(nested.a.b); // 2 (both reference same object)
</code></pre>

  <p>
    To truly deep copy, you need libraries like <code>Lodash</code> 
    or structuredClone in modern JS:
  </p>
  <pre><code>const deepCopy = structuredClone(nested);</code></pre>

  <h2>🌀 Prototypes & Inheritance</h2>
  <p>
    JavaScript uses <strong>prototypal inheritance</strong>. 
    Each object has an internal link to another object called its 
    <strong>prototype</strong>. When you try to access a property 
    that doesn’t exist on the object, JavaScript looks up the chain.
  </p>

  <h3>Prototype Example</h3>
  <pre><code>const animal = {
  eats: true
};

const dog = Object.create(animal);
dog.barks = true;

console.log(dog.eats); // true (inherited)
console.log(dog.barks); // true</code></pre>

  <h3>Functions & Prototypes</h3>
  <p>
    Every function in JavaScript has a <code>prototype</code> property 
    that is used when creating objects with <code>new</code>.
  </p>

  <pre><code>function Person(name) {
  this.name = name;
}


const alice = new Person("Alice");
alice.sayHi(); // Hi, I’m Alice
</code></pre>

  <h2>🏗️ Classes (Syntactic Sugar)</h2>
  <p>
    ES6 introduced <strong>classes</strong>, which are cleaner 
    syntax for constructor functions and prototypes.
  </p>

  <pre><code>class Animal {
  constructor(name) {
    this.name = name;
  }


}
}

const d = new Dog("Rex");
d.speak(); // Rex barks.
</code></pre>

  <h2>📚 Built-in Object Methods</h2>
  <ul>
    <li><code>Object.keys(obj)</code> → array of property names</li>
    <li><code>Object.values(obj)</code> → array of property values</li>
    <li><code>Object.entries(obj)</code> → array of [key, value] pairs</li>
    <li><code>Object.freeze(obj)</code> → makes object immutable</li>
    <li><code>Object.seal(obj)</code> → prevents adding/removing props but allows modification</li>
  </ul>

  <pre><code>const book = { title: "JS Guide", pages: 300 };
console.log(Object.keys(book));   // ["title", "pages"]
console.log(Object.values(book)); // ["JS Guide", 300]
console.log(Object.entries(book)); // [["title","JS Guide"],["pages",300]]</code></pre>

  <h2>🧩 Object Iteration</h2>
  <pre><code>const obj = { a: 1, b: 2, c: 3 };

// for...in loop
for (let key in obj) {
  console.log(key, obj[key]);
}

// Object.keys
Object.keys(obj).forEach(key => {
  console.log(key, obj[key]);
});
</code></pre>

  <h2>🧪 Practice Exercises</h2>
  <ol>
    <li>Create an object <code>student</code> with properties and a method <code>introduce()</code>.</li>

  </ol>

  <h2>🎯 Summary</h2>
  <ul>
    <li>Objects can have methods and use <code>this</code> for self-reference.</li>
    <li>Property descriptors control <code>writable</code>, <code>enumerable</code>, and <code>configurable</code>.</li>
    <li>Shallow copy copies only top-level, deep copy clones nested objects.</li>
    <li>Prototypal inheritance allows sharing of methods and properties.</li>
    <li>ES6 classes provide a modern, cleaner syntax for prototypes.</li>
    <li>Built-in methods like <code>Object.keys</code>, <code>Object.values</code>, and <code>Object.entries</code> simplify object handling.</li>
  </ul>

  <p>
    🎉 Congratulations! You now understand JavaScript objects at a deeper level.  
    Next up: <strong>Lesson 12: Arrays in Depth (Advanced Methods & Iteration)</strong>.
  </p>
</article>

    `},{title: "DOM Manipulation (Part 1)", content: `<article>
  <p><strong>Word Count:</strong> ~1500</p>

  <h2>⚡ Introduction</h2>
  <p>
    JavaScript becomes truly powerful when it interacts with the <strong>DOM</strong> 
    (Document Object Model). The DOM represents the structure of your web page as a tree 
    of objects. Every tag you write in HTML – such as <code>&lt;h1&gt;</code>, 
    <code>&lt;p&gt;</code>, <code>&lt;div&gt;</code>, or <code>&lt;button&gt;</code> – 
    becomes a node in this tree, which JavaScript can access and manipulate.
  </p>
  <p>
    DOM Manipulation is the foundation of building dynamic, interactive websites. In this 
    lesson, we’ll cover:
  </p>
  <ul>
    <li>How the DOM works</li>
    <li>Different ways to select elements</li>
    <li>Modifying content with <code>innerHTML</code> and <code>textContent</code></li>
    <li>Best practices and performance considerations</li>
  </ul>

  <h2>📖 The DOM in a Nutshell</h2>
  <p>
    The DOM is like a live map of your webpage. Imagine your HTML:
  </p>

  <pre><code>&lt;!DOCTYPE html&gt;
&lt;html&gt;
  &lt;body&gt;
    &lt;h1 id="title"&gt;Hello, World!&lt;/h1&gt;
    &lt;p class="intro"&gt;This is an example paragraph.&lt;/p&gt;
    &lt;button&gt;Click Me&lt;/button&gt;
  &lt;/body&gt;
&lt;/html&gt;
</code></pre>

  <p>
    In the DOM, the above page is represented as a tree of nodes: 
    the <code>html</code> element contains <code>body</code>, which contains 
    <code>h1</code>, <code>p</code>, and <code>button</code>. Each is accessible 
    through JavaScript.
  </p>

  <h2>🔎 Selecting Elements</h2>
  <p>
    The first step in DOM manipulation is selecting elements. JavaScript provides 
    several methods:
  </p>

  <h3>1. <code>getElementById()</code></h3>
  <p>Used to select an element by its unique <code>id</code>.</p>
  <pre><code>const heading = document.getElementById("title");
console.log(heading); // &lt;h1 id="title"&gt;Hello, World!&lt;/h1&gt;
</code></pre>

  <h3>2. <code>getElementsByClassName()</code></h3>
  <p>Selects elements by class name. Returns an <strong>HTMLCollection</strong> (array-like).</p>
  <pre><code>const paragraphs = document.getElementsByClassName("intro");
console.log(paragraphs[0]); // &lt;p class="intro"&gt;This is an example paragraph.&lt;/p&gt;
</code></pre>

  <h3>3. <code>getElementsByTagName()</code></h3>
  <p>Selects all elements with a given tag name.</p>
  <pre><code>const buttons = document.getElementsByTagName("button");
console.log(buttons.length); // 1
</code></pre>

  <h3>4. <code>querySelector()</code></h3>
  <p>
    Selects the <em>first matching element</em> using CSS selectors.
  </p>
  <pre><code>const firstParagraph = document.querySelector(".intro");
console.log(firstParagraph); // The first &lt;p&gt; with class "intro"
</code></pre>

  <h3>5. <code>querySelectorAll()</code></h3>
  <p>
    Selects <em>all matching elements</em> as a <strong>NodeList</strong>.
  </p>
  <pre><code>const allParagraphs = document.querySelectorAll("p");
allParagraphs.forEach(p =&gt; console.log(p.textContent));
</code></pre>

  <h3>⚠️ Difference between HTMLCollection and NodeList</h3>
  <ul>
    <li><strong>HTMLCollection</strong> → Live, updates automatically if the DOM changes.</li>
    <li><strong>NodeList</strong> → Static, does not auto-update.</li>
  </ul>

  <h2>✏️ Modifying Content</h2>
  <p>
    Once an element is selected, we can modify its content. Two primary properties are:
    <code>innerHTML</code> and <code>textContent</code>.
  </p>

  <h3>1. <code>innerHTML</code></h3>
  <p>
    Allows you to set or get the HTML inside an element.
  </p>
  <pre><code>const div = document.querySelector("div");
div.innerHTML = "&lt;h2&gt;New Heading&lt;/h2&gt;&lt;p&gt;This is new text.&lt;/p&gt;";
</code></pre>

  <p>
    ⚠️ Be careful: <code>innerHTML</code> parses and renders HTML, 
    which makes it powerful but also vulnerable to <strong>XSS attacks</strong> 
    if you insert user-provided content.
  </p>

  <h3>2. <code>textContent</code></h3>
  <p>
    Works similarly but only sets/gets <em>plain text</em>, ignoring HTML tags.
  </p>
  <pre><code>const heading = document.getElementById("title");
heading.textContent = "&lt;b&gt;Safe Text&lt;/b&gt;";
console.log(heading.innerHTML); // &amp;lt;b&amp;gt;Safe Text&amp;lt;/b&amp;gt;
</code></pre>

  <p>
    Here, the tags are displayed literally instead of being parsed.
  </p>

  <h2>📚 Example: Building a Simple Editor</h2>
  <p>
    Let’s build a mini example where we change text dynamically:
  </p>

  <pre><code>&lt;h1 id="heading"&gt;Hello&lt;/h1&gt;
&lt;button id="btn"&gt;Change&lt;/button&gt;

&lt;script&gt;
  const btn = document.getElementById("btn");
  const heading = document.getElementById("heading");

  btn.addEventListener("click", () =&gt; {
    heading.innerHTML = "&lt;span style='color:red'&gt;Text Changed!&lt;/span&gt;";
  });
&lt;/script&gt;
</code></pre>

  <p>
    Here, clicking the button replaces the heading’s content with styled HTML.
  </p>

  <h2>🏗️ Best Practices</h2>
  <ul>
    <li>Prefer <code>textContent</code> for inserting text (safer).</li>
    <li>Use <code>innerHTML</code> only when you need to insert HTML markup.</li>
    <li>Use <code>querySelector</code> and <code>querySelectorAll</code> for flexibility.</li>
    <li>Avoid excessive DOM lookups – store selected elements in variables.</li>
  </ul>

  <h2>🧪 Practice Exercises</h2>
  <ol>
    <li>Create a page with a heading and button. On button click, change the heading text using <code>textContent</code>.</li>
    <li>Build a list (<code>&lt;ul&gt;</code>) and dynamically replace its items using <code>innerHTML</code>.</li>
    <li>Use <code>querySelectorAll</code> to select all paragraphs and change their text color.</li>
    <li>Experiment with <code>getElementById</code> vs <code>querySelector</code>.</li>
    <li>Show the difference between <code>innerHTML</code> and <code>textContent</code> in the same example.</li>
  </ol>

  <h2>🎯 Summary</h2>
  <ul>
    <li>The DOM represents your HTML as a tree of objects.</li>
    <li>You can select elements using <code>getElementById</code>, <code>getElementsByClassName</code>, <code>querySelector</code>, etc.</li>
    <li><code>innerHTML</code> lets you insert HTML markup, but can be unsafe if misused.</li>
    <li><code>textContent</code> is safer and should be preferred when working with plain text.</li>
    <li>DOM manipulation is the core of dynamic, interactive web pages.</li>
  </ul>

  <p>
    🎉 Congratulations! You’ve completed <strong>Part 1 of DOM Manipulation</strong>.  
    In the next lesson (Part 2), we’ll cover <strong>creating/removing elements, attributes, and classes</strong>.
  </p>
</article>

     <article>
  <p><strong>Word Count:</strong> ~1500</p>

  <h2>⚡ Introduction</h2>
  <p>
    In the last lesson, we explored how to <strong>select elements</strong> and 
    change their content using <code>innerHTML</code> and <code>textContent</code>. 
    Now we’ll take DOM manipulation further by learning how to 
    <strong>create new elements, remove existing ones, modify attributes, and 
    control classes</strong>.
  </p>
  <p>
    This lesson is crucial because most dynamic web applications – from to-do lists 
    to e-commerce carts – rely on adding and removing elements in real-time. 
  </p>

  <h2>🛠️ Creating Elements</h2>
  <p>
    JavaScript lets us create new elements dynamically using 
    <code>document.createElement()</code>.
  </p>

  <pre><code>// Create a new &lt;p&gt; element
const newParagraph = document.createElement("p");

// Add text to it
newParagraph.textContent = "This is a dynamically created paragraph.";

// Append to body
document.body.appendChild(newParagraph);
</code></pre>

  <p>
    The new paragraph will appear at the end of the page. Notice we used 
    <code>appendChild()</code> to attach it to the DOM.
  </p>

  <h3>📌 Inserting at Specific Locations</h3>
  <p>Besides <code>appendChild</code>, we have other methods:</p>
  <ul>
    <li><code>prepend()</code> → Adds element as the <em>first child</em></li>
    <li><code>before()</code> → Inserts element <em>before</em> a node</li>
    <li><code>after()</code> → Inserts element <em>after</em> a node</li>
    <li><code>replaceWith()</code> → Replaces an existing node</li>
  </ul>

  <pre><code>const container = document.querySelector("#container");
const newDiv = document.createElement("div");
newDiv.textContent = "Inserted at the beginning!";
container.prepend(newDiv);

const anotherDiv = document.createElement("div");
anotherDiv.textContent = "Inserted after container!";
container.after(anotherDiv);
</code></pre>

  <h2>🗑️ Removing Elements</h2>
  <p>
    Sometimes, we need to remove elements from the DOM. We can use:
  </p>
  <ul>
    <li><code>remove()</code> → Deletes the element itself</li>
    <li><code>removeChild()</code> → Deletes a child from its parent</li>
  </ul>

  <pre><code>const paragraph = document.querySelector("p");
paragraph.remove(); // Removes the paragraph

const parent = document.querySelector("#list");
const firstItem = parent.firstElementChild;
parent.removeChild(firstItem); // Removes first child
</code></pre>

  <h2>🔑 Working with Attributes</h2>
  <p>
    HTML elements often have attributes (like <code>src</code>, <code>href</code>, 
    <code>alt</code>, etc.). JavaScript gives us multiple ways to read and modify them.
  </p>

  <h3>1. <code>setAttribute()</code></h3>
  <pre><code>const link = document.querySelector("a");
link.setAttribute("href", "https://www.example.com");
link.setAttribute("target", "_blank");
</code></pre>

  <h3>2. <code>getAttribute()</code></h3>
  <pre><code>console.log(link.getAttribute("href")); // https://www.example.com
</code></pre>

  <h3>3. <code>removeAttribute()</code></h3>
  <pre><code>link.removeAttribute("target");
</code></pre>

  <h3>4. Direct Property Access</h3>
  <p>
    Many attributes can be accessed directly as properties:
  </p>
  <pre><code>const image = document.querySelector("img");
image.src = "new-image.jpg"; // Same as setAttribute("src", "new-image.jpg")
</code></pre>

  <h2>🎨 Working with Classes</h2>
  <p>
    Classes are critical for styling and functionality. JavaScript provides 
    <code>classList</code> to manage classes easily.
  </p>

  <h3>1. <code>add()</code></h3>
  <pre><code>const box = document.querySelector("#box");
box.classList.add("highlight");
</code></pre>

  <h3>2. <code>remove()</code></h3>
  <pre><code>box.classList.remove("highlight");
</code></pre>

  <h3>3. <code>toggle()</code></h3>
  <p>
    Adds the class if it doesn’t exist, removes it if it does.
  </p>
  <pre><code>box.classList.toggle("hidden");
</code></pre>

  <h3>4. <code>contains()</code></h3>
  <p>
    Checks if a class exists.
  </p>
  <pre><code>if (box.classList.contains("highlight")) {
  console.log("Box is highlighted!");
}
</code></pre>

  <h2>📚 Example: To-Do List App (Mini Project)</h2>
  <p>
    Let’s apply what we learned by creating a basic to-do list that lets users add 
    and remove tasks.
  </p>

  <pre><code>&lt;input type="text" id="taskInput" placeholder="Enter task"&gt;
&lt;button id="addBtn"&gt;Add Task&lt;/button&gt;
&lt;ul id="taskList"&gt;&lt;/ul&gt;

&lt;script&gt;
  const input = document.getElementById("taskInput");
  const button = document.getElementById("addBtn");
  const list = document.getElementById("taskList");

  button.addEventListener("click", () =&gt; {
    if (input.value.trim() !== "") {
      const li = document.createElement("li");
      li.textContent = input.value;

      const removeBtn = document.createElement("button");
      removeBtn.textContent = "❌";
      removeBtn.addEventListener("click", () =&gt; {
        li.remove();
      });

      li.appendChild(removeBtn);
      list.appendChild(li);

      input.value = "";
    }
  });
&lt;/script&gt;
</code></pre>

  <p>
    This simple app lets you:
  </p>
  <ul>
    <li>Create new <code>&lt;li&gt;</code> items dynamically.</li>
    <li>Attach <code>button</code> elements to each task.</li>
    <li>Remove items by clicking the ❌ button.</li>
  </ul>

  <h2>🏗️ Best Practices</h2>
  <ul>
    <li>Use <code>classList</code> instead of modifying <code>className</code> directly.</li>
    <li>Use <code>textContent</code> instead of <code>innerHTML</code> when inserting user input.</li>
    <li>Detach event listeners before removing nodes if needed (for performance).</li>
    <li>Minimize DOM manipulation inside loops – batch changes when possible.</li>
  </ul>

  <h2>🧪 Practice Exercises</h2>
  <ol>
    <li>Create a new button dynamically and insert it into a <code>&lt;div&gt;</code>.</li>
    <li>Build a gallery where clicking "Add Image" appends a new <code>&lt;img&gt;</code> element.</li>
    <li>Write a script to toggle a dark mode class on the <code>&lt;body&gt;</code>.</li>
    <li>Create a form that dynamically adds a list of submitted names.</li>
    <li>Experiment with <code>setAttribute</code> vs direct property assignment.</li>
  </ol>

  <h2>🎯 Summary</h2>
  <ul>
    <li><code>document.createElement()</code> lets you create new elements.</li>
    <li>Use <code>appendChild</code>, <code>prepend</code>, <code>before</code>, 
        and <code>after</code> to insert elements.</li>
    <li><code>remove()</code> and <code>removeChild()</code> delete nodes.</li>
    <li><code>setAttribute</code>, <code>getAttribute</code>, and <code>removeAttribute</code> 
        manage element attributes.</li>
    <li><code>classList</code> provides methods to add, remove, toggle, and check classes.</li>
    <li>Dynamic apps rely on these methods for real-time interactivity.</li>
  </ul>

  <p>
    🎉 Congratulations! You’ve now mastered <strong>DOM Manipulation Part 2</strong>.  
    Next, we’ll explore <strong>Events in JavaScript</strong> – how to listen to user actions 
    like clicks, keyboard presses, and more.
  </p>
</article>

  <p><strong>Word Count:</strong> ~1500</p>

  <h2>⚡ Introduction</h2>
  <p>
    Events are at the heart of web interactivity. An <strong>event</strong> is an action
    or occurrence recognized by the browser, such as a user clicking a button,
    pressing a key, resizing the window, or submitting a form.
  </p>
  <p>
    Without events, your website is static. With events, you can make it 
    <strong>responsive to user actions</strong> — like showing a popup when a button is
    clicked, validating a form when it’s submitted, or changing styles when the mouse
    hovers over an element.
  </p>

  <h2>📖 Types of Events in JavaScript</h2>
  <p>Here are the most common categories of events:</p>
  <ul>
    <li><strong>Mouse Events</strong> – <code>click</code>, <code>dblclick</code>, <code>mouseover</code>, <code>mouseout</code>, <code>mousemove</code></li>
    <li><strong>Keyboard Events</strong> – <code>keydown</code>, <code>keyup</code>, <code>keypress</code></li>
    <li><strong>Form Events</strong> – <code>submit</code>, <code>change</code>, <code>input</code>, <code>focus</code>, <code>blur</code></li>
    <li><strong>Window Events</strong> – <code>load</code>, <code>resize</code>, <code>scroll</code></li>
    <li><strong>Clipboard Events</strong> – <code>copy</code>, <code>cut</code>, <code>paste</code></li>
  </ul>

  <h2>🖱️ Mouse Events Example</h2>
  <pre><code>&lt;button id="btn"&gt;Click Me&lt;/button&gt;

&lt;script&gt;
  const btn = document.getElementById("btn");

  btn.addEventListener("click", () =&gt; {
    alert("Button clicked!");
  });

  btn.addEventListener("mouseover", () =&gt; {
    console.log("Mouse is over the button");
  });
&lt;/script&gt;
</code></pre>

  <h2>⌨️ Keyboard Events Example</h2>
  <pre><code>&lt;input type="text" id="name" placeholder="Type your name"&gt;

&lt;script&gt;
  const input = document.getElementById("name");

  input.addEventListener("keydown", (event) =&gt; {
    console.log("Key pressed:", event.key);
  });

  input.addEventListener("keyup", (event) =&gt; {
    console.log("Key released:", event.key);
  });
&lt;/script&gt;
</code></pre>

  <h2>📄 Form Events Example</h2>
  <pre><code>&lt;form id="myForm"&gt;
    &lt;input type="text" name="username" required&gt;
    &lt;button type="submit"&gt;Submit&lt;/button&gt;
&lt;/form&gt;

&lt;script&gt;
  const form = document.getElementById("myForm");

  form.addEventListener("submit", (event) =&gt; {
    event.preventDefault(); // Prevent page reload
    alert("Form submitted!");
  });
&lt;/script&gt;
</code></pre>

  <h2>📐 Window Events Example</h2>
  <pre><code>&lt;script&gt;
  window.addEventListener("resize", () =&gt; {
    console.log("Window resized:", window.innerWidth, "x", window.innerHeight);
  });

  window.addEventListener("scroll", () =&gt; {
    console.log("Scrolled at:", window.scrollY);
  });
&lt;/script&gt;
</code></pre>

  <h2>📌 Adding Event Listeners</h2>
  <p>There are three main ways to attach events:</p>

  <h3>1. Inline HTML Attribute</h3>
  <pre><code>&lt;button onclick="alert('Clicked!')"&gt;Click&lt;/button&gt;</code></pre>
  <p>⚠️ Not recommended (mixes HTML and JS).</p>

  <h3>2. Assigning to an Element’s Property</h3>
  <pre><code>const btn = document.getElementById("btn");
btn.onclick = () =&gt; {
  alert("Clicked!");
};
</code></pre>

  <h3>3. <code>addEventListener()</code> (Best Practice)</h3>
  <pre><code>btn.addEventListener("click", () =&gt; {
  alert("Clicked with addEventListener!");
});
</code></pre>

  <p>
    ✅ <code>addEventListener</code> is preferred because it allows multiple handlers 
    and better control.
  </p>

  <h2>📊 Event Object</h2>
  <p>
    When an event occurs, JavaScript automatically passes an <strong>event object</strong>
    containing information about the event.
  </p>

  <pre><code>btn.addEventListener("click", (event) =&gt; {
  console.log("Event type:", event.type);
  console.log("Target element:", event.target);
});
</code></pre>

  <p>
    Useful properties:
  </p>
  <ul>
    <li><code>event.type</code> – Type of event (e.g., "click")</li>
    <li><code>event.target</code> – The element that triggered the event</li>
    <li><code>event.key</code> – Key pressed (for keyboard events)</li>
    <li><code>event.clientX / clientY</code> – Mouse coordinates</li>
  </ul>

  <h2>🎯 Event Bubbling and Capturing</h2>
  <p>
    Events flow through the DOM in two phases: <strong>capturing</strong> (down) and
    <strong>bubbling</strong> (up).
  </p>

  <pre><code>&lt;div id="outer"&gt;
  &lt;button id="inner"&gt;Click&lt;/button&gt;
&lt;/div&gt;

&lt;script&gt;
  const outer = document.getElementById("outer");
  const inner = document.getElementById("inner");

  outer.addEventListener("click", () =&gt; {
    console.log("Outer div clicked (bubbling)");
  });

  inner.addEventListener("click", () =&gt; {
    console.log("Button clicked");
  });
&lt;/script&gt;
</code></pre>

  <p>
    By default, events use <strong>bubbling</strong>, meaning they start at the target
    and bubble up to ancestors. You can enable <strong>capturing</strong> by passing 
    <code>true</code> as the third argument in <code>addEventListener</code>.
  </p>

  <h2>🧹 Removing Event Listeners</h2>
  <pre><code>function sayHello() {
  alert("Hello!");
}

btn.addEventListener("click", sayHello);
btn.removeEventListener("click", sayHello);
</code></pre>

  <p>
    ⚠️ To remove an event listener, you must reference the same function object — 
    anonymous functions cannot be removed this way.
  </p>

  <h2>📚 Example: Interactive Color Changer</h2>
  <pre><code>&lt;button id="red"&gt;Red&lt;/button&gt;
&lt;button id="blue"&gt;Blue&lt;/button&gt;
&lt;div id="box" style="width:100px; height:100px; background:gray;"&gt;&lt;/div&gt;

&lt;script&gt;
  const box = document.getElementById("box");

  document.getElementById("red").addEventListener("click", () =&gt; {
    box.style.background = "red";
  });

  document.getElementById("blue").addEventListener("click", () =&gt; {
    box.style.background = "blue";
  });
&lt;/script&gt;
</code></pre>

  <p>
    Now the user can click a button to change the box color dynamically.
  </p>

  <h2>🏗️ Best Practices</h2>
  <ul>
    <li>Always use <code>addEventListener</code> instead of inline events.</li>
    <li>Remove listeners if they’re no longer needed (to avoid memory leaks).</li>
    <li>Use event delegation (listen on parent, check <code>event.target</code>) for lists or tables.</li>
    <li>Always prevent default behavior (e.g., form submission) when handling events manually.</li>
  </ul>

  <h2>🧪 Practice Exercises</h2>
  <ol>
    <li>Create a button that logs “Button clicked” when pressed.</li>
    <li>Make an input field that shows the current typed text in real time.</li>
    <li>Create a form and prevent it from reloading the page on submit.</li>
    <li>Write code to change the background color when the window is resized.</li>
    <li>Experiment with bubbling vs capturing on nested elements.</li>
  </ol>

  <h2>🎯 Summary</h2>
  <ul>
    <li>Events represent user actions or browser actions.</li>
    <li>Types include mouse, keyboard, form, window, and clipboard events.</li>
    <li><code>addEventListener</code> is the best way to attach handlers.</li>
    <li>The event object provides useful info like type, target, and key.</li>
    <li>Understand bubbling vs capturing for complex event handling.</li>
  </ul>

  <p>
    🎉 Congratulations! You’ve learned <strong>Events in JavaScript</strong>.  
    In the next lesson, we’ll dive into <strong>Forms & Validation</strong> — 
    where you’ll learn to handle user input securely and effectively.
  </p>
</article>

    `},{title: "Forms & Validation", content: `<article>
  <p><strong>Word Count:</strong> ~1500</p>

  <h2>📖 Introduction</h2>
  <p>
    Forms are the backbone of web interactivity. From signing up on a website,
    logging in, or making a payment, almost every site uses forms to collect user
    data. But collecting data isn’t enough — we must also <strong>validate</strong> it.
  </p>
  <p>
    <strong>Form validation</strong> ensures that users enter data in the correct format
    (like a proper email address, non-empty fields, valid passwords, etc.) before the
    form is submitted. This prevents errors, improves user experience, and protects
    your website from bad data.
  </p>

  <h2>📝 HTML Form Basics</h2>
  <p>
    Before using JavaScript, let’s recall how an HTML form looks:
  </p>

  <pre><code>&lt;form id="signupForm"&gt;
  &lt;label&gt;Username: &lt;input type="text" id="username" required&gt;&lt;/label&gt;&lt;br&gt;

  <h2>✅ Common Validation Rules</h2>

  <h2>👤 Example: Username Validation</h2>

  <pre><code>&lt;script&gt;

&lt;/script&gt;

  <h2>📧 Example: Email Validation</h2>
  <p>Use a regex (regular expression) to check if the email looks valid:</p>

  <pre><code>&lt;script&gt;
  const email = document.getElementById("email");

  <h2>🔑 Example: Password Strength</h2>

  <pre><code>&lt;script&gt;
  const password = document.getElementById("password");

  function validatePassword() {

  form.addEventListener("submit", (event) =&gt; {
    event.preventDefault();

  <h2>🖊️ Real-Time Validation</h2>

  <h2>⚖️ Combining Multiple Validations</h2>

  function validateForm() {

</code></pre>

  <h2>🧹 Cleaning Error Messages</h2>

&lt;script&gt;

  <h2>📚 Example: Full Signup Form</h2>

  &lt;input type="text" id="username" placeholder="Username"&gt;&lt;br&gt;
  &lt;input type="email" id="email" placeholder="Email"&gt;&lt;br&gt;

  <h2>🔒 Client-Side vs Server-Side Validation</h2>

  <p><strong>Word Count:</strong> ~1500</p>

  <h2>⚡ Introduction</h2>
  <p>
    Errors happen in every program. They might occur because of user mistakes, invalid
    input, missing files, or bugs in your code. Without proper error handling, your
    script may stop running entirely — creating a poor user experience.
  </p>
  <p>
    In JavaScript, we can use <strong>error handling techniques</strong> to manage these
    situations gracefully. This lesson covers <code>try...catch</code>, throwing custom
    errors, and debugging strategies.
  </p>

  <h2>🚨 Types of Errors in JavaScript</h2>
  <ul>
    <li><strong>Syntax Errors</strong> – Occur when code is written incorrectly (e.g., missing parenthesis).</li>
    <li><strong>Runtime Errors</strong> – Happen during execution (e.g., calling an undefined function).</li>
    <li><strong>Logical Errors</strong> – The code runs, but produces the wrong result.</li>
  </ul>

  <h2>🧱 The <code>try...catch</code> Statement</h2>
  <p>
    The <code>try...catch</code> block allows you to run code that might throw an
    error, and handle that error without stopping execution.
  </p>

  <pre><code>&lt;script&gt;
  try {
    let result = 10 / x; // x is not defined
    console.log(result);
  } catch (error) {
    console.error("An error occurred:", error.message);
  }
&lt;/script&gt;
</code></pre>

  <p>
    Here, instead of crashing, the error is caught and logged gracefully.
  </p>

  <h2>🧹 Using <code>finally</code></h2>
  <p>
    The <code>finally</code> block executes no matter what — whether there was an error
    or not. It’s often used for cleanup tasks.
  </p>

  <pre><code>&lt;script&gt;
  try {
    console.log("Trying risky code...");
    throw new Error("Something went wrong!");
  } catch (error) {
    console.log("Caught error:", error.message);
  } finally {
    console.log("This always runs (cleanup, closing connections, etc.)");
  }
&lt;/script&gt;
</code></pre>

  <h2>💡 Throwing Your Own Errors</h2>
  <p>
    Sometimes, you want to signal that something went wrong by <strong>throwing a
    custom error</strong>.
  </p>

  <pre><code>&lt;script&gt;
  function divide(a, b) {
    if (b === 0) {
      throw new Error("Cannot divide by zero");
    }
    return a / b;
  }

  try {
    console.log(divide(10, 0));
  } catch (error) {
    console.error("Custom error:", error.message);
  }
&lt;/script&gt;
</code></pre>

  <p>
    ✅ Best practice: Use <code>throw</code> to create meaningful error messages for
    invalid operations.
  </p>

  <h2>📂 Built-in Error Types</h2>
  <p>JavaScript provides several built-in error constructors:</p>
  <ul>
    <li><code>Error</code> – General error.</li>
    <li><code>SyntaxError</code> – Code syntax is invalid.</li>
    <li><code>ReferenceError</code> – Refers to something not defined.</li>
    <li><code>TypeError</code> – Wrong type of value (e.g., calling a number as a function).</li>
    <li><code>RangeError</code> – Number out of range.</li>
    <li><code>EvalError</code> – Issues with <code>eval()</code> function.</li>
  </ul>

  <h3>Example: ReferenceError</h3>
  <pre><code>&lt;script&gt;
  try {
    console.log(myVar); // myVar is not defined
  } catch (error) {
    console.error("Caught:", error.name, "-", error.message);
  }
&lt;/script&gt;
</code></pre>

  <h2>🔍 Debugging in JavaScript</h2>
  <p>
    Debugging means finding and fixing errors in code. Common debugging techniques:
  </p>
  <ul>
    <li><strong>Console Logging</strong> – Use <code>console.log()</code> to trace values.</li>
    <li><strong>Breakpoints</strong> – Use browser DevTools (F12) to pause and inspect code.</li>
    <li><strong>Debugger Statement</strong> – Add <code>debugger;</code> in your code to trigger a breakpoint.</li>
  </ul>

  <pre><code>&lt;script&gt;
  function calculateArea(width, height) {
    debugger; // Pauses execution here
    return width * height;
  }

  console.log(calculateArea(5, 10));
&lt;/script&gt;
</code></pre>

  <h2>🎯 Example: Validating User Input</h2>
  <p>
    Let’s combine error handling with input validation.
  </p>

  <pre><code>&lt;script&gt;
  function getAgeInput(age) {
    if (isNaN(age)) {
      throw new TypeError("Age must be a number");
    }
    if (age &lt;= 0) {
      throw new RangeError("Age must be greater than 0");
    }
    return age;
  }

  try {
    console.log(getAgeInput("abc"));
  } catch (error) {
    console.error("Validation failed:", error.message);
  }
&lt;/script&gt;
</code></pre>

  <h2>⚖️ Best Practices for Error Handling</h2>
  <ul>
    <li>Always use <code>try...catch</code> around risky operations (like API calls).</li>
    <li>Use <code>finally</code> to clean up resources.</li>
    <li>Throw meaningful errors instead of generic ones.</li>
    <li>Differentiate between error types (TypeError, ReferenceError, etc.).</li>
    <li>Don’t overuse try...catch — only use it where errors are expected.</li>
  </ul>

  <h2>📚 Example: Fetch API with Error Handling</h2>
  <pre><code>&lt;script&gt;
  async function fetchData() {
    try {
      const response = await fetch("https://invalid.url");
      if (!response.ok) {
        throw new Error("HTTP error: " + response.status);
      }
      const data = await response.json();
      console.log(data);
    } catch (error) {
      console.error("Fetching failed:", error.message);
    } finally {
      console.log("Request finished (success or fail).");
    }
  }

  fetchData();
&lt;/script&gt;
</code></pre>

  <h2>🧪 Practice Exercises</h2>
  <ol>
    <li>Write a function that throws an error when dividing by zero.</li>
    <li>Create a program that validates user input for email, throwing a custom error if invalid.</li>
    <li>Simulate a failed API request using <code>fetch()</code> and handle it gracefully.</li>
    <li>Use <code>debugger</code> to pause and inspect variable values in a loop.</li>
    <li>Experiment with different built-in error types (<code>ReferenceError</code>, <code>TypeError</code>, etc.).</li>
  </ol>

  <h2>🎯 Summary</h2>
  <ul>
    <li>JavaScript errors can be syntax, runtime, or logical errors.</li>
    <li><code>try...catch</code> is the main way to handle runtime errors.</li>
    <li><code>throw</code> lets you create custom errors.</li>
    <li><code>finally</code> runs cleanup code regardless of errors.</li>
    <li>Debugging tools like console, breakpoints, and <code>debugger</code> help fix bugs.</li>
  </ul>

  <p>
    🎉 Congratulations! You’ve learned how to handle errors in JavaScript using
    <strong>try...catch</strong>, <strong>throw</strong>, and debugging tools.  
    In the next lesson, we’ll explore <strong>Asynchronous JavaScript – Callbacks, Promises, and Async/Await</strong>.
  </p>
</article>

    <p><strong>Word Count:</strong> ~1500</p>

  <h2>⚡ Introduction</h2>
  <p>
    JavaScript has evolved significantly over the years. Before ES6 (2015), the language
    felt clunky compared to other modern languages. ES6 and later versions added many
    features that made code shorter, more readable, and more powerful. In this lesson,
    we’ll focus on four core ES6+ features you’ll use daily:
  </p>
  <ul>
    <li><strong>Destructuring</strong> – Extract values from arrays and objects easily.</li>
    <li><strong>Spread and Rest operators</strong> – Flexible ways to expand or gather values.</li>
    <li><strong>Default parameters</strong> – Provide fallback values in functions.</li>
    <li><strong>Modules</strong> – Organize code into reusable files.</li>
  </ul>

  <h2>🔎 Destructuring Assignment</h2>
  <p>
    Destructuring lets you “unpack” values from arrays or properties from objects into
    separate variables in a concise way.
  </p>

  <h3>Array Destructuring</h3>
  <pre><code>&lt;script&gt;
  const numbers = [10, 20, 30];
  const [a, b, c] = numbers;

  console.log(a); // 10
  console.log(b); // 20
  console.log(c); // 30
&lt;/script&gt;
</code></pre>

  <p>✅ Without destructuring, you’d have to write <code>const a = numbers[0];</code>.</p>

  <h4>Skipping Values</h4>
  <pre><code>&lt;script&gt;
  const [first, , third] = [1, 2, 3];
  console.log(first, third); // 1 3
&lt;/script&gt;
</code></pre>

  <h4>Using Defaults</h4>
  <pre><code>&lt;script&gt;
  const [x = 5, y = 10] = [7];
  console.log(x, y); // 7 10
&lt;/script&gt;
</code></pre>

  <h3>Object Destructuring</h3>
  <pre><code>&lt;script&gt;
  const person = { name: "Alice", age: 25 };
  const { name, age } = person;

  console.log(name); // Alice
  console.log(age);  // 25
&lt;/script&gt;
</code></pre>

  <h4>Renaming Variables</h4>
  <pre><code>&lt;script&gt;
  const { name: userName, age: userAge } = person;
  console.log(userName, userAge); // Alice 25
&lt;/script&gt;
</code></pre>

  <h4>Nested Destructuring</h4>
  <pre><code>&lt;script&gt;
  const student = {
    id: 101,
    info: {
      grade: "A",
      subject: "Math"
    }
  };

  const { info: { grade, subject } } = student;
  console.log(grade, subject); // A Math
&lt;/script&gt;
</code></pre>


  greet({ name: "Bob", age: 30 }); 
&lt;/script&gt;
</code></pre>

  <h2>🌊 Spread Operator (<code>...</code>)</h2>
  <p>
    The spread operator (<code>...</code>) expands arrays or objects into individual
    elements.
  </p>

  <h3>Expanding Arrays</h3>
  <pre><code>&lt;script&gt;
  const arr1 = [1, 2, 3];
  const arr2 = [4, 5, 6];
  const merged = [...arr1, ...arr2];

  console.log(merged); // [1, 2, 3, 4, 5, 6]
&lt;/script&gt;
</code></pre>

  <h3>Copying Arrays</h3>
  <pre><code>&lt;script&gt;
  const original = [1, 2, 3];
  const copy = [...original];

  copy.push(4);
  console.log(original); // [1, 2, 3]
  console.log(copy);     // [1, 2, 3, 4]
&lt;/script&gt;
</code></pre>

  <h3>Spreading in Function Calls</h3>
  <pre><code>&lt;script&gt;
  function sum(a, b, c) {
    return a + b + c;
  }

  const numbers = [1, 2, 3];
  console.log(sum(...numbers)); // 6

  <h3>Spreading Objects</h3>

  const obj1 = { name: "Alice" };

  const person = { ...obj1, ...obj2 };

  console.log(person); // { name: "Alice", age: 25 }
&lt;/script&gt;
</code></pre>

  <h2>📦 Rest Operator (<code>...</code>)</h2>
  <p>
    The rest operator gathers multiple values into an array. It looks like the spread
    operator, but is used differently.
  </p>

  <h3>Function Parameters</h3>
  <pre><code>&lt;script&gt;
  function sumAll(...nums) {
    return nums.reduce((total, n) =&gt; total + n, 0);
  }

  console.log(sumAll(1, 2, 3, 4, 5)); // 15
&lt;/script&gt;
</code></pre>

  <h3>Destructuring with Rest</h3>
  <pre><code>&lt;script&gt;
  const [first, ...others] = [10, 20, 30, 40];
  console.log(first);  // 10
  console.log(others); // [20, 30, 40]
&lt;/script&gt;
</code></pre>

  <h2>🎁 Default Parameters</h2>
  <p>
    Before ES6, you had to manually check if a function argument was undefined. With
    default parameters, you can give function arguments fallback values.
  </p>



  greet();         // Hello, Guest!
  greet("Alice");  // Hello, Alice!
&lt;/script&gt;
</code></pre>

  <h3>Using Expressions as Defaults</h3>
  <pre><code>&lt;script&gt;
  function multiply(a, b = a) {
    return a * b;
  }

  console.log(multiply(5));    // 25
  console.log(multiply(5, 2)); // 10
&lt;/script&gt;
</code></pre>

  <h2>📚 Modules in JavaScript</h2>
  <p>
    Modules allow you to split code across multiple files and reuse it. This makes
    applications more organized and maintainable.
  </p>

  <h3>Exporting</h3>
  <pre><code>// file: math.js
export function add(a, b) {
  return a + b;
}

export const PI = 3.14159;

export default function subtract(a, b) {

}
</code></pre>

  <h3>Importing</h3>
  <pre><code>// file: app.js

  <h3>Named vs Default Exports</h3>
  <ul>
    <li><strong>Named exports</strong> must be imported with the same name (<code>{ add }</code>).</li>

  </ul>

  <h2>⚖️ Best Practices</h2>
  <ul>
    <li>Use destructuring to keep code concise and readable.</li>

    <li>Always provide sensible default parameters in functions.</li>
    <li>Organize code with modules for scalability.</li>
    <li>Use named exports when exporting multiple items, and default for one main item.</li>
  </ul>

  <h2>🧪 Practice Exercises</h2>

  <h2>🎯 Summary</h2>

    <li><strong>Modules</strong> help structure large projects into reusable pieces.</li>
  </ul>

  <p>

  </p>
</article>

  <p><strong>Word Count:</strong> ~1500</p>

  <h2>⚡ Introduction</h2>
  <p>
    JavaScript is single-threaded, meaning it can only execute one thing at a time.
    But in real-world applications, we often deal with tasks that take time — like
    fetching data from a server, reading a file, or waiting for a user action.
    If JavaScript handled these synchronously, the entire page would freeze until
    the task finished.
  </p>
  <p>
    That’s why we need <strong>asynchronous programming</strong>. It lets JavaScript
    handle time-consuming tasks without blocking the rest of the program. In this
    lesson, we’ll cover:
  </p>
  <ul>
    <li>What asynchronous code is</li>
    <li>Callbacks and why they can be problematic</li>
    <li>Promises as a cleaner solution</li>
    <li>Async/Await for even simpler syntax</li>
  </ul>

  <h2>⏱️ Synchronous vs Asynchronous</h2>
  <h3>Synchronous Example</h3>
  <pre><code>&lt;script&gt;
  console.log("Start");
  console.log("Middle");
  console.log("End");
&lt;/script&gt;
</code></pre>
  <p>Output:</p>
  <pre><code>Start
Middle
End</code></pre>
  <p>Everything runs one after the other, no waiting.</p>

  <h3>Asynchronous Example</h3>
  <pre><code>&lt;script&gt;
  console.log("Start");

End
Async task done!</code></pre>

  <h2>📞 Callbacks</h2>
  <p>
    A <strong>callback</strong> is a function passed as an argument to another
    function, to be executed later.
  </p>

  <h3>Basic Callback Example</h3>
  <pre><code>&lt;script&gt;
  function greet(name, callback) {
    console.log("Hello " + name);
    callback();
  }

  function sayBye() {
    console.log("Goodbye!");
  }

  greet("Alice", sayBye);
&lt;/script&gt;
</code></pre>
  <p>Output:</p>
  <pre><code>Hello Alice
Goodbye!</code></pre>

  <h3>Callbacks with Asynchronous Tasks</h3>
  <pre><code>&lt;script&gt;
  function fetchData(callback) {
    console.log("Fetching data...");
    setTimeout(() =&gt; {
      callback("Data received!");
    }, 2000);
  }

  fetchData((message) =&gt; {
    console.log(message);
  });
&lt;/script&gt;
</code></pre>

  <h3>Callback Hell</h3>
  <p>
    When you have multiple asynchronous operations that depend on each other,
    callbacks can become messy and deeply nested.
  </p>
  <pre><code>&lt;script&gt;
  setTimeout(() =&gt; {
    console.log("Step 1");
    setTimeout(() =&gt; {
      console.log("Step 2");
      setTimeout(() =&gt; {
        console.log("Step 3");
      }, 1000);
    }, 1000);
  }, 1000);
&lt;/script&gt;
</code></pre>
  <p>This is often called <strong>callback hell</strong>.</p>

  <h2>🤝 Promises</h2>
  <p>
    A <strong>Promise</strong> is an object that represents the eventual completion
    (or failure) of an asynchronous operation. It has three states:
  </p>
  <ul>
    <li><code>pending</code> – initial state</li>
    <li><code>fulfilled</code> – operation completed successfully</li>
    <li><code>rejected</code> – operation failed</li>
  </ul>

  <h3>Creating a Promise</h3>
  <pre><code>&lt;script&gt;
  const promise = new Promise((resolve, reject) =&gt; {
    let success = true;

    if (success) {
      resolve("Task completed!");
    } else {
      reject("Task failed!");
    }
  });

  promise.then(result =&gt; {
    console.log(result);
  }).catch(error =&gt; {
    console.log(error);
  });
&lt;/script&gt;
</code></pre>

  <h3>Chaining Promises</h3>
  <pre><code>&lt;script&gt;
  function step1() {
    return new Promise(resolve =&gt; {
      setTimeout(() =&gt; resolve("Step 1 done"), 1000);
    });
  }

  function step2() {
    return new Promise(resolve =&gt; {
      setTimeout(() =&gt; resolve("Step 2 done"), 1000);
    });
  }

  step1()
    .then(result =&gt; {
      console.log(result);
      return step2();
    })
    .then(result =&gt; {
      console.log(result);
    });
&lt;/script&gt;
</code></pre>

  <h3>Promise.all</h3>
  <p>
    Runs multiple promises in parallel and waits for all to finish.
  </p>
  <pre><code>&lt;script&gt;
  const p1 = Promise.resolve("First");
  const p2 = Promise.resolve("Second");

  Promise.all([p1, p2]).then(values =&gt; {
    console.log(values); // ["First", "Second"]
  });
&lt;/script&gt;
</code></pre>

  <h2>⏳ Async/Await</h2>
  <p>
    <code>async/await</code> is built on top of promises and makes asynchronous
    code look synchronous.
  </p>

  <h3>Basic Example</h3>
  <pre><code>&lt;script&gt;
  async function fetchData() {
    return "Data loaded!";
  }

  fetchData().then(result =&gt; console.log(result));
&lt;/script&gt;
</code></pre>

  <h3>Await Example</h3>
  <pre><code>&lt;script&gt;
  function delay(ms) {
    return new Promise(resolve =&gt; setTimeout(resolve, ms));
  }

  async function runSteps() {
    console.log("Step 1");
    await delay(1000);

    console.log("Step 2");
    await delay(1000);

    console.log("Step 3");
  }

  runSteps();
&lt;/script&gt;
</code></pre>

  <h3>Try/Catch with Async/Await</h3>
  <pre><code>&lt;script&gt;
  async function getData() {
    try {

      let data = await response.json();
      console.log(data);
    } catch (error) {
      console.log("Error:", error);
    }
  }

  getData();
&lt;/script&gt;
</code></pre>

  <h2>⚖️ Best Practices</h2>
  <ul>
    <li>Use promises instead of callbacks to avoid messy nesting.</li>
    <li>Prefer <code>async/await</code> for readability when working with multiple async tasks.</li>
    <li>Always handle errors with <code>.catch</code> or <code>try/catch</code>.</li>
    <li>Use <code>Promise.all</code> for tasks that can run in parallel.</li>
  </ul>

  <h2>🧪 Practice Exercises</h2>

    <li>Write an async function that waits 3 seconds before logging "Done".</li>
    <li>Fetch data from a public API using async/await and handle errors gracefully.</li>
  </ol>

  <h2>🎯 Summary</h2>
  <ul>
    <li>Callbacks let us handle async tasks but can get messy.</li>
    <li>Promises solve callback hell and give cleaner syntax.</li>
    <li><code>async/await</code> makes async code look synchronous and easier to read.</li>
  </ul>

  <p>

    callbacks, promises, and async/await. In the next lesson, we’ll go deeper into
    <strong>Asynchronous JavaScript Part 2 – Fetch API, AJAX, and JSON</strong>.

  <h2>⚡ Introduction</h2>
  <p>
    In the previous lesson, you learned how JavaScript handles asynchronous code using

  <p>
    Most real-world applications need to send and receive data — whether it’s loading

  </p>
  <ul>
    <li><strong>AJAX</strong> – the old way of fetching data (still important historically).</li>
    <li><strong>Fetch API</strong> – the modern, promise-based method for HTTP requests.</li>
    <li><strong>JSON</strong> – the standard format for data exchange on the web.</li>

  <h2>📡 What Is AJAX?</h2>
  <p>
    AJAX stands for <strong>Asynchronous JavaScript and XML</strong>. It allows web
    pages to request data from a server without reloading the entire page. Although
    XML is in the name, today AJAX is mostly used with <strong>JSON</strong>.
  </p>

  <h3>How AJAX Works</h3>
  <ol>
    <li>JavaScript sends an HTTP request to the server.</li>
    <li>The server processes it and sends back a response.</li>
    <li>JavaScript updates the page dynamically, without a full reload.</li>
  </ol>

  <h3>AJAX with <code>XMLHttpRequest</code></h3>
  <pre><code>&lt;script&gt;
  const xhr = new XMLHttpRequest();
  xhr.open("GET", "https://jsonplaceholder.typicode.com/posts/1", true);

  xhr.onload = function () {
    if (xhr.status === 200) {
      console.log(JSON.parse(xhr.responseText));
    }
  };

  xhr.send();
&lt;/script&gt;
</code></pre>
  <p>
    While <code>XMLHttpRequest</code> works, it’s verbose and harder to manage.
    That’s why the <strong>Fetch API</strong> was introduced in ES6.
  </p>

  <h2>🌐 Fetch API</h2>
  <p>
    The Fetch API is a modern way to make network requests in JavaScript. It uses
    promises, making the syntax much cleaner.
  </p>

  <h3>Basic Fetch Example</h3>
  <pre><code>&lt;script&gt;
  fetch("https://jsonplaceholder.typicode.com/posts/1")
    .then(response =&gt; response.json())
    .then(data =&gt; console.log(data))
    .catch(error =&gt; console.error("Error:", error));
&lt;/script&gt;
</code></pre>
  <p>✅ Much simpler than <code>XMLHttpRequest</code>!</p>

  <h3>Fetch with Async/Await</h3>
  <pre><code>&lt;script&gt;
  async function getPost() {
    try {
      const response = await fetch("https://jsonplaceholder.typicode.com/posts/1");
      const data = await response.json();
      console.log(data);
    } catch (error) {
      console.error("Error:", error);
    }
  }

  getPost();
&lt;/script&gt;
</code></pre>

  <h2>📤 Sending Data with Fetch (POST Request)</h2>
  <p>
    Fetch can also send data to a server, usually in JSON format, with a POST request.
  </p>

  <pre><code>&lt;script&gt;
  async function createPost() {
    try {
      const response = await fetch("https://jsonplaceholder.typicode.com/posts", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"

        body: JSON.stringify({
          title: "My New Post",
          body: "This is the post content.",
          userId: 1
        })
      });

      const data = await response.json();
      console.log("Created:", data);
    } catch (error) {
      console.error("Error:", error);
    }
  }

  createPost();
&lt;/script&gt;
</code></pre>

  <h2>📥 Other HTTP Methods</h2>
  <ul>
    <li><code>GET</code> – retrieve data (default).</li>
    <li><code>POST</code> – send new data to the server.</li>
    <li><code>PUT</code> – update an existing resource.</li>
    <li><code>DELETE</code> – remove a resource.</li>
  </ul>

  <h3>PUT Example</h3>
  <pre><code>&lt;script&gt;
  async function updatePost() {
    const response = await fetch("https://jsonplaceholder.typicode.com/posts/1", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id: 1,
        title: "Updated Post",
        body: "Updated content",
        userId: 1
      })
    });

    const data = await response.json();
    console.log("Updated:", data);
  }

  updatePost();
&lt;/script&gt;
</code></pre>

  <h3>DELETE Example</h3>
  <pre><code>&lt;script&gt;
  async function deletePost() {
    const response = await fetch("https://jsonplaceholder.typicode.com/posts/1", {
      method: "DELETE"
    });

    console.log("Deleted:", response.status); // 200
  }

  deletePost();
&lt;/script&gt;
</code></pre>

  <h2>📑 JSON – JavaScript Object Notation</h2>
  <p>
    <strong>JSON</strong> is the most common format for sending and receiving data
    between clients and servers. It’s lightweight, text-based, and looks like
    JavaScript objects.
  </p>

  <h3>JSON Example</h3>
  <pre><code>{
    "name": "Alice",
    "age": 25,
    "isStudent": false,
    "hobbies": ["reading", "coding"]
  }
</code></pre>

  <h3>Working with JSON in JavaScript</h3>
  <ul>
    <li><code>JSON.stringify()</code> – convert JS objects to JSON strings.</li>
    <li><code>JSON.parse()</code> – convert JSON strings to JS objects.</li>
  </ul>

  <pre><code>&lt;script&gt;
  const obj = { name: "Bob", age: 30 };
  const json = JSON.stringify(obj);

  console.log(json); // {"name":"Bob","age":30}

  const parsed = JSON.parse(json);
  console.log(parsed.name); // Bob
&lt;/script&gt;
</code></pre>

  <h2>⚡ Error Handling with Fetch</h2>
  <p>
    Fetch only rejects on <strong>network errors</strong>, not on bad HTTP status
    codes. That means you should always check <code>response.ok</code>.
  </p>

  <pre><code>&lt;script&gt;
  async function safeFetch() {
    try {
      const response = await fetch("https://jsonplaceholder.typicode.com/404");

      if (!response.ok) {
        throw new Error("HTTP error " + response.status);
      }

      const data = await response.json();
      console.log(data);
    } catch (error) {
      console.error("Error:", error);
    }
  }

  safeFetch();
&lt;/script&gt;
</code></pre>

  <h2>⚖️ Best Practices</h2>
  <ul>
    <li>Use <code>fetch</code> instead of <code>XMLHttpRequest</code> for new code.</li>
    <li>Always handle errors with <code>try/catch</code> or <code>.catch()</code>.</li>
    <li>Use <code>async/await</code> for readability.</li>
    <li>Check <code>response.ok</code> to catch HTTP errors.</li>
    <li>Send and receive data as <strong>JSON</strong> unless you specifically need another format.</li>
  </ul>

    <li>Delete a post using a DELETE request.</li>
    <li>Convert a JavaScript object into JSON and send it to the server.</li>

  <h2>🎯 Summary</h2>
  <ul>
    <li><strong>AJAX</strong> (via <code>XMLHttpRequest</code>) was the old way of making async requests.</li>
    <li><strong>Fetch API</strong> is the modern, promise-based alternative.</li>
    <li><strong>JSON</strong> is the standard format for exchanging data on the web.</li>

    <li>Use async/await to make code cleaner and easier to understand.</li>
  </ul>

  <p>
    🎉 Congratulations! You’ve mastered asynchronous data handling in JavaScript

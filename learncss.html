    {title: "CSS Responsive Design ", content: `<article>

  <h2>📱 Introduction to Responsive Design</h2>
  <p>
    Responsive design is an essential skill for modern web developers. It ensures websites look great and function properly across devices—from smartphones and tablets to desktops and large monitors. With the increasing variety of screen sizes and resolutions, designing static layouts is no longer sufficient. Responsive design allows layouts, images, typography, and navigation to adapt seamlessly to different screens, improving user experience, engagement, and accessibility.
  </p>

  <h2>🔹 Mobile-First vs Desktop-First Approach</h2>
  <p>
    When designing for responsiveness, two approaches are commonly used: mobile-first and desktop-first. Both rely on CSS media queries but differ in their base styling and priorities.
  </p>

  <h3>1. Mobile-First Approach</h3>
  <p>
    Mobile-first design starts by writing styles optimized for smaller screens, then gradually adds enhancements for larger screens. This approach prioritizes performance, content accessibility, and usability on devices with limited screen space.
  </p>
  <pre><code>/* Mobile-first */
.container {
  font-size: 16px;
  padding: 10px;
}

@media (min-width: 768px) {
.container {
font-size: 18px;
padding: 20px;
}
}

@media (min-width: 1200px) {
.container {
font-size: 20px;
padding: 30px;
}
}</code></pre>

  <h3>2. Desktop-First Approach</h3>
  <p>
    Desktop-first design begins with styles for large screens and uses media queries to adjust for smaller devices. While less common today, it is sometimes used for legacy websites or applications primarily accessed on desktops.
  </p>
  <pre><code>/* Desktop-first */
.container {
  font-size: 20px;
  padding: 30px;
}

@media (max-width: 1200px) {
.container {
font-size: 18px;
padding: 20px;
}
}

@media (max-width: 768px) {
.container {
font-size: 16px;
padding: 10px;
}
}</code></pre>

  <h2>🔹 Media Queries</h2>
  <p>
    Media queries are the backbone of responsive design. They allow CSS to be applied conditionally based on device characteristics such as width, height, orientation, and resolution. The basic syntax is:
  </p>
  <pre><code>@media (condition) {
  /* CSS rules */
}</code></pre>
  <p>
    Examples of common media queries:
  </p>
  <ul>
    <li><code>@media (max-width: 768px)</code> – targets tablets and smaller screens.</li>
    <li><code>@media (min-width: 1200px)</code> – targets large desktops.</li>
    <li><code>@media (orientation: landscape)</code> – targets devices in landscape mode.</li>
    <li><code>@media (prefers-reduced-motion: reduce)</code> – targets users who prefer minimal animations.</li>
  </ul>

  <h2>🔹 Relative Units for Responsiveness</h2>
  <p>
    Using relative units instead of fixed units is key to creating fluid and scalable designs. Fixed units (like <code>px</code>) can break layouts on different screen sizes. Relative units adapt based on parent elements or viewport dimensions.
  </p>

  <h3>1. em</h3>
  <p>
    <code>em</code> is relative to the font size of the parent element. Useful for scalable spacing, typography, and component sizing.
  </p>
  <pre><code>p {
  font-size: 1.2em; /* 1.2 times parent font size */
}</code></pre>

  <h3>2. rem</h3>
  <p>
    <code>rem</code> is relative to the root (<code>html</code>) font size. It provides consistency across elements.
  </p>
  <pre><code>html { font-size: 16px; }
p { font-size: 1.5rem; } /* 24px */</code></pre>

  <h3>3. Percentages (%)</h3>
  <p>
    Percentages are relative to the parent element's dimensions and are commonly used for widths, heights, and padding.
  </p>
  <pre><code>.container {
  width: 80%; /* 80% of parent width */
  padding: 5%;
}</code></pre>

  <h3>4. Viewport Units (vw, vh, vmin, vmax)</h3>
  <p>
    These units are based on the viewport dimensions:
    <ul>
      <li><code>1vw</code> = 1% of viewport width</li>
      <li><code>1vh</code> = 1% of viewport height</li>
      <li><code>vmin</code> = 1% of the smaller viewport dimension</li>
      <li><code>vmax</code> = 1% of the larger viewport dimension</li>
    </ul>
  </p>
  <pre><code>h1 {
  font-size: 5vw; /* scales with viewport width */
}</code></pre>

  <h2>🔹 Viewport Meta Tag</h2>
  <p>
    For responsive layouts to work on mobile devices, you must include the viewport meta tag in your HTML <code>&lt;head&gt;</code> section:
  </p>
  <pre><code>&lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;</code></pre>
  <p>
    This ensures the browser renders the page at the device’s width and scales the content appropriately. Omitting it can lead to layouts appearing zoomed out or broken on mobile devices.
  </p>

  <h2>🔹 Breakpoints Best Practices</h2>
  <p>
    Breakpoints are screen widths where your design needs adjustments. Best practices include:
  </p>
  <ul>
    <li>Base breakpoints on content rather than devices (responsive breakpoints should fix design issues, not target specific gadgets).</li>
    <li>Use a small set of consistent breakpoints for maintainability (commonly 480px, 768px, 1024px, 1200px).</li>
    <li>Combine mobile-first approach with min-width queries for cleaner CSS.</li>
    <li>Test layouts on multiple devices or emulators, not just by resizing the browser.</li>
  </ul>

  <h2>⚡ Practical Exercises</h2>
  <ol>
    <li>Create a simple webpage and make it mobile-first using media queries for tablets and desktops.</li>
    <li>Replace fixed pixel widths with percentages, ems, or rems for container widths, padding, and fonts.</li>
    <li>Use viewport units to create headings and images that scale with screen size.</li>
    <li>Add the viewport meta tag and test the page on a mobile device.</li>
    <li>Experiment with different breakpoints to optimize layout for various screen widths.</li>
  </ol>

  <h2>📝 Best Practices</h2>
  <ul>
    <li>Start with a mobile-first approach and scale up for larger screens.</li>
    <li>Use relative units for fonts, spacing, and containers for fluid layouts.</li>
    <li>Use media queries strategically to avoid overly complex CSS.</li>
    <li>Combine CSS Grid and Flexbox for responsive, modular designs.</li>
    <li>Always include the viewport meta tag in HTML.</li>
  </ul>

  <h2>✅ Summary</h2>
  <p>
    Responsive design is critical in today’s multi-device world. By using a mobile-first approach, media queries, relative units, and viewport settings, you can create web pages that adapt seamlessly to any screen. Proper breakpoints and testing ensure your designs are consistent, functional, and visually appealing across all devices. The next lesson will explore <strong>CSS Transitions & Animations</strong>, adding motion and interactivity to your responsive designs.
  </p>
</article>

    `}

    {title: "CSS Transforms & Transitions", content: `<article>
  
  <h2>📌 Introduction to CSS Transforms & Transitions</h2>
  <p>
    CSS transforms and transitions are powerful tools for adding interactivity and motion to your website without using JavaScript. They allow elements to move, rotate, scale, and animate smoothly, enhancing user experience and engagement. While transforms modify the visual appearance of an element in a 2D or 3D space, transitions define the timing and animation of these changes, making them smooth instead of abrupt. In this lesson, we’ll cover all essential transform types, how transitions work, and practical examples including hover effects.
  </p>

  <h2>🔹 CSS Transform Property</h2>
  <p>
    The <code>transform</code> property lets you visually manipulate an element in 2D or 3D space. Multiple transform functions can be combined for complex effects.
  </p>

  <h3>1. Translate</h3>
  <p>
    <code>translate()</code> moves an element from its original position along the X, Y, or Z axes.
  </p>
  <pre><code>.box {
  transform: translateX(50px); /* moves element 50px to the right */
}

.box2 {
transform: translateY(30px); /* moves element 30px down */
}

.box3 {
transform: translate(40px, 20px); /* X=40px, Y=20px */
}</code></pre>

  <h3>2. Rotate</h3>
  <p>
    <code>rotate()</code> rotates an element around its origin (default is center) by a specified angle in degrees or radians.
  </p>
  <pre><code>.box {
  transform: rotate(45deg); /* rotates 45 degrees clockwise */
}</code></pre>

  <h3>3. Scale</h3>
  <p>
    <code>scale()</code> increases or decreases the size of an element. You can scale uniformly or separately along X and Y axes.
  </p>
  <pre><code>.box {
  transform: scale(1.5); /* 150% size */
}

.box2 {
transform: scaleX(2); /* double width */
}

.box3 {
transform: scale(1, 2); /* normal width, double height */
}</code></pre>

  <h3>4. Skew</h3>
  <p>
    <code>skew()</code> slants the element along X or Y axes, creating a skewed appearance.
  </p>
  <pre><code>.box {
  transform: skewX(20deg); /* slants element 20deg horizontally */
}

.box2 {
transform: skewY(15deg); /* slants element vertically */
}

.box3 {
transform: skew(10deg, 15deg); /* horizontal and vertical skew */
}</code></pre>

  <h3>5. Combine Transforms</h3>
  <p>
    Multiple transform functions can be applied simultaneously:
  </p>
  <pre><code>.box {
  transform: translate(50px, 20px) rotate(30deg) scale(1.2);
}</code></pre>

  <h2>🔹 CSS Transition Property</h2>
  <p>
    The <code>transition</code> property enables smooth changes of CSS properties over time. Instead of abrupt changes, transitions animate the changes based on specified duration, delay, and timing functions.
  </p>

  <h3>1. Transition Properties</h3>
  <ul>
    <li><strong>transition-property:</strong> The CSS property to animate (<code>all</code> for all properties).</li>
    <li><strong>transition-duration:</strong> How long the transition lasts (e.g., <code>0.5s</code>).</li>
    <li><strong>transition-delay:</strong> Wait time before starting the animation (e.g., <code>0.2s</code>).</li>
    <li><strong>transition-timing-function:</strong> Controls acceleration/deceleration of the animation. Common values:
      <ul>
        <li><code>ease</code>: slow start, fast middle, slow end</li>
        <li><code>linear</code>: constant speed</li>
        <li><code>ease-in</code>: slow start</li>
        <li><code>ease-out</code>: slow end</li>
        <li><code>ease-in-out</code>: slow start and end</li>
        <li><code>cubic-bezier(n,n,n,n)</code>: custom timing function</li>
      </ul>
    </li>
  </ul>

  <pre><code>.box {
  transition-property: transform, background-color;
  transition-duration: 0.5s;
  transition-timing-function: ease-in-out;
  transition-delay: 0.1s;
}</code></pre>

  <h3>2. Shorthand Transition</h3>
  <pre><code>.box {
  transition: transform 0.5s ease-in-out 0.1s;
}</code></pre>

  <h2>🔹 Hover Effects with Transitions</h2>
  <p>
    Combining <code>transform</code> and <code>transition</code> creates interactive hover effects. These effects are widely used for buttons, cards, images, and links to improve user experience.
  </p>

  <h3>1. Simple Scale on Hover</h3>
  <pre><code>.button {
  background-color: #3498db;
  color: white;
  padding: 15px 30px;
  border-radius: 5px;
  display: inline-block;
  transition: transform 0.3s ease;
}

.button:hover {
transform: scale(1.1);
}</code></pre>

  <h3>2. Rotate and Translate on Hover</h3>
  <pre><code>.card {
  width: 200px;
  height: 150px;
  background-color: #e74c3c;
  transition: transform 0.4s ease-in-out;
}

.card:hover {
transform: translateY(-10px) rotate(5deg);
}</code></pre>

  <h3>3. Color Change with Transition</h3>
  <pre><code>.link {
  color: #2c3e50;
  text-decoration: none;
  transition: color 0.3s ease;
}

.link:hover {
color: #e67e22;
}</code></pre>

  <h3>4. Combining Multiple Effects</h3>
  <pre><code>.image {
  width: 200px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.image:hover {
transform: scale(1.05) rotate(2deg);
box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}</code></pre>

  <h2>⚡ Practical Exercises</h2>
  <ol>
    <li>Create a button that scales and changes color smoothly on hover.</li>
    <li>Design a card that lifts slightly (translateY) and rotates on hover.</li>
    <li>Add a transition to images for subtle zoom effects on hover.</li>
    <li>Experiment with different <code>transition-timing-function</code> values to see how easing affects motion.</li>
    <li>Combine multiple transforms with delays to create staggered hover animations for multiple elements.</li>
  </ol>

  <h2>📝 Best Practices</h2>
  <ul>
    <li>Use transitions to enhance interactivity, but avoid overuse that may distract users.</li>
    <li>Prefer transform and opacity for smoother performance over properties like width or height.</li>
    <li>Combine transitions with hover or focus states for better UX.</li>
    <li>Use shorthand <code>transition</code> for cleaner code.</li>
    <li>Test animations across devices and browsers for consistency.</li>
  </ul>

  <h2>✅ Summary</h2>
  <p>
    CSS transforms and transitions provide an easy way to animate elements and create engaging user interactions without JavaScript. By mastering <code>translate</code>, <code>rotate</code>, <code>scale</code>, <code>skew</code>, and using <code>transition</code> with proper duration, timing, and delay, you can design smooth hover effects and dynamic interfaces. In the next lesson, we will explore <strong>CSS Animations</strong>, which offer full control over complex, keyframe-based animations.
  </p>
</article>

    `}

    {title: "CSS Animations", content: `<article>
  
  <h2>📌 Introduction to CSS Animations</h2>
  <p>
    CSS animations provide a powerful way to create dynamic, interactive web content without relying on JavaScript. Unlike transitions, which only animate between two states, CSS animations allow you to define multiple keyframes, giving precise control over the behavior of elements over time. Animations can run once, repeat infinitely, or even alternate between directions, enabling creative effects for banners, buttons, loaders, and entire layouts. In this lesson, we’ll cover keyframes, animation properties, shorthand syntax, infinite vs one-time animations, and performance best practices.
  </p>

  <h2>🔹 Keyframes (@keyframes)</h2>
  <p>
    Keyframes define the stages of an animation. Each keyframe represents a point in the animation timeline, typically using percentages from <code>0%</code> to <code>100%</code>, or the keywords <code>from</code> (0%) and <code>to</code> (100%). Within each keyframe, you specify the CSS properties to animate.
  </p>

  <pre><code>@keyframes slideIn {
  0% {
    transform: translateX(-100%);
    opacity: 0;
  }
  50% {
    transform: translateX(10%);
    opacity: 0.5;
  }
  100% {
    transform: translateX(0);
    opacity: 1;
  }
}</code></pre>

  <p>
    In this example, an element moves from left to right while fading in. Keyframes can include as many steps as needed to achieve complex motion.
  </p>

  <h2>🔹 Animation Properties</h2>
  <p>
    To use keyframes, you need to apply them to an element with CSS animation properties. Key properties include:
  </p>

  <ul>
    <li><strong>animation-name:</strong> the name of the keyframes (<code>slideIn</code>).</li>
    <li><strong>animation-duration:</strong> how long the animation runs (e.g., <code>2s</code>).</li>
    <li><strong>animation-timing-function:</strong> controls the pacing (<code>linear</code>, <code>ease-in</code>, <code>ease-out</code>, <code>ease-in-out</code>, <code>cubic-bezier()</code>).</li>
    <li><strong>animation-delay:</strong> wait time before starting the animation.</li>
    <li><strong>animation-iteration-count:</strong> how many times the animation runs (<code>1</code>, <code>infinite</code>, or a specific number).</li>
    <li><strong>animation-direction:</strong> determines if the animation reverses on alternate cycles (<code>normal</code>, <code>reverse</code>, <code>alternate</code>, <code>alternate-reverse</code>).</li>
    <li><strong>animation-fill-mode:</strong> defines the styles before or after the animation (<code>forwards</code>, <code>backwards</code>, <code>both</code>, <code>none</code>).</li>
  </ul>

  <pre><code>.box {
  animation-name: slideIn;
  animation-duration: 2s;
  animation-timing-function: ease-in-out;
  animation-delay: 0.5s;
  animation-iteration-count: 1;
  animation-fill-mode: forwards;
}</code></pre>

  <h2>🔹 Animation Shorthand</h2>
  <p>
    CSS allows combining multiple animation properties into a shorthand declaration:
  </p>

  <pre><code>.box {
  animation: slideIn 2s ease-in-out 0.5s 1 forwards;
}</code></pre>

  <p>
    The order in shorthand is: <code>animation-name</code> <code>duration</code> <code>timing-function</code> <code>delay</code> <code>iteration-count</code> <code>direction</code> <code>fill-mode</code>. Using shorthand simplifies code and makes it easier to read and maintain.
  </p>

  <h2>🔹 Infinite vs One-Time Animations</h2>
  <p>
    Animations can run once or loop indefinitely. Use the <code>animation-iteration-count</code> property to control repetition.
  </p>

  <ul>
    <li><strong>One-time animation:</strong> runs a set number of times (default is 1).</li>
    <li><strong>Infinite animation:</strong> loops forever using <code>infinite</code>.</li>
    <li><strong>Alternate direction:</strong> animation reverses direction on each cycle, which is useful for bouncing or pulsing effects.</li>
  </ul>

  <pre><code>.pulse {
  animation: pulseAnimation 1s ease-in-out infinite alternate;
}

@keyframes pulseAnimation {
  0% { transform: scale(1); }
  100% { transform: scale(1.1); }
}</code></pre>

  <h2>🔹 Practical Examples</h2>

  <h3>1. Fade-In Effect</h3>
  <pre><code>@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.box {
animation: fadeIn 1.5s ease forwards;
}</code></pre>

  <h3>2. Sliding Menu</h3>
  <pre><code>@keyframes slideMenu {
  0% { transform: translateX(-300px); }
  100% { transform: translateX(0); }
}

.menu {
animation: slideMenu 0.8s ease-out forwards;
}</code></pre>

  <h3>3. Bouncing Ball</h3>
  <pre><code>@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-50px); }
}

.ball {
animation: bounce 1s ease-in-out infinite;
}</code></pre>

  <h3>4. Color Change Animation</h3>
  <pre><code>@keyframes colorShift {
  0% { background-color: #3498db; }
  50% { background-color: #e74c3c; }
  100% { background-color: #3498db; }
}

.button {
animation: colorShift 3s linear infinite;
}</code></pre>

  <h2>🔹 Performance Tips for Animations</h2>
  <p>
    While CSS animations are efficient, poorly implemented animations can harm performance, especially on mobile devices. Follow these tips for smoother animations:
  </p>

  <ul>
    <li>Prefer <code>transform</code> and <code>opacity</code> over properties like <code>width</code>, <code>height</code>, <code>top</code>, or <code>left</code>, as they leverage GPU acceleration.</li>
    <li>Keep animations simple and avoid animating too many elements simultaneously.</li>
    <li>Use <code>will-change</code> sparingly to hint the browser about upcoming changes.</li>
    <li>Test animations on different devices and browsers for consistency.</li>
    <li>Avoid triggering reflows and repaints by animating layout-affecting properties.</li>
  </ul>

  <h2>⚡ Practical Exercises</h2>
  <ol>
    <li>Create a fade-in animation for text on page load.</li>
    <li>Design a sliding sidebar that animates in and out.</li>
    <li>Animate a bouncing ball infinitely to understand timing functions and alternate direction.</li>
    <li>Animate buttons to change color on hover using keyframes for a smooth loop.</li>
    <li>Experiment with different easing functions like <code>ease-in-out</code> and <code>cubic-bezier</code> for realistic motion.</li>
  </ol>

  <h2>📝 Best Practices</h2>
  <ul>
    <li>Use animations to enhance UX, not distract users.</li>
    <li>Test performance and avoid animating too many elements simultaneously.</li>
    <li>Use GPU-friendly properties like <code>transform</code> and <code>opacity</code>.</li>
    <li>Combine keyframes with transitions for flexible effects.</li>
    <li>Keep keyframe names meaningful and organize them in a separate CSS file for maintainability.</li>
  </ul>

  <h2>✅ Summary</h2>
  <p>
    CSS animations provide precise control over motion, allowing developers to create rich, engaging, and interactive experiences without JavaScript. By understanding keyframes, animation properties, infinite vs one-time loops, shorthand syntax, and performance considerations, you can animate elements effectively and responsibly. The next lesson will focus on <strong>CSS Variables & Custom Properties</strong>, which enhance maintainability and theming in modern CSS development.
  </p>
</article>

    `}

    {title: "CSS Filters & Effects", content: `<article>
  
  <h2>📌 Introduction to CSS Filters & Effects</h2>
  <p>
    CSS filters and effects allow developers to manipulate the appearance of elements directly in the browser, adding visual flair, enhancing readability, and creating engaging user experiences. Filters can adjust color, contrast, blur, brightness, and more, while effects like shadows and blending modes create depth and layering. Additionally, techniques like <code>clip-path</code> and <code>mask-image</code> allow for creative cropping and masking of elements without needing image editing software. In this lesson, we’ll cover the most commonly used filters, shadows, blending modes, and masking techniques.
  </p>

  <h2>🔹 CSS Filter Property</h2>
  <p>
    The <code>filter</code> property allows you to apply visual effects to HTML elements such as images, divs, and text. Filters can be combined for complex effects using a space-separated list.
  </p>

  <h3>1. Blur</h3>
  <p>
    <code>blur()</code> softens the content, creating a frosted or out-of-focus look. The value is in pixels.
  </p>
  <pre><code>.image {
  filter: blur(5px);
}</code></pre>

  <h3>2. Grayscale</h3>
  <p>
    <code>grayscale()</code> converts colors to shades of gray. The value ranges from 0 (original color) to 1 (full grayscale).
  </p>
  <pre><code>.photo {
  filter: grayscale(1); /* fully gray */
}

.photo-half {
filter: grayscale(0.5); /* 50% grayscale */
}</code></pre>

  <h3>3. Brightness</h3>
  <p>
    <code>brightness()</code> adjusts the brightness of an element. Values above 1 increase brightness, values below 1 decrease it.
  </p>
  <pre><code>.image {
  filter: brightness(1.5); /* 50% brighter */
}

.image-dark {
filter: brightness(0.7); /* 30% darker */
}</code></pre>

  <h3>4. Contrast</h3>
  <p>
    <code>contrast()</code> changes the difference between dark and light areas. Higher values increase contrast, lower values decrease it.
  </p>
  <pre><code>.image {
  filter: contrast(150%); /* more contrast */
}

.image-low-contrast {
filter: contrast(80%); /* less contrast */
}</code></pre>

  <h3>5. Combining Multiple Filters</h3>
  <pre><code>.image {
  filter: grayscale(0.5) blur(3px) brightness(1.2) contrast(120%);
}</code></pre>

  <h2>🔹 Drop Shadow vs Text Shadow</h2>
  <p>
    Shadows add depth to elements and improve readability. CSS provides two main types of shadows: <code>box-shadow</code> for containers and <code>text-shadow</code> for text.
  </p>

  <h3>1. Box Shadow</h3>
  <p>
    Creates shadows around elements such as divs, images, or buttons. Syntax: <code>offset-x offset-y blur-radius spread-radius color</code>.
  </p>
  <pre><code>.card {
  box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
}</code></pre>

  <h3>2. Text Shadow</h3>
  <p>
    Adds shadow effects to text, improving legibility or creating stylistic designs.
  </p>
  <pre><code>h1 {
  text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
}</code></pre>

  <h2>🔹 Mix-Blend Modes</h2>
  <p>
    <code>mix-blend-mode</code> controls how an element blends with its background or other elements. This is useful for overlay effects, artistic designs, or visual highlighting.
  </p>
  <pre><code>.overlay {
  background-color: rgba(255,0,0,0.5);
  mix-blend-mode: multiply; /* darkens underlying content */
}</code></pre>
  <p>
    Common blend modes include <code>multiply</code>, <code>screen</code>, <code>overlay</code>, <code>darken</code>, <code>lighten</code>, and <code>difference</code>.
  </p>

  <h2>🔹 Clip-Path Basics</h2>
  <p>
    <code>clip-path</code> allows you to define a visible portion of an element, hiding the rest. It supports basic shapes, polygons, circles, ellipses, and inset rectangles.
  </p>
  <pre><code>.circle {
  clip-path: circle(50% at 50% 50%);
}

.triangle {
clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
}

.inset-box {
clip-path: inset(10% 20% 10% 20%);
}</code></pre>

  <h2>🔹 Mask-Image Basics</h2>
  <p>
    <code>mask-image</code> works similarly to <code>clip-path</code> but allows gradient masks and complex transparency effects. You can use images or gradients to reveal portions of an element.
  </p>
  <pre><code>.masked {
  mask-image: linear-gradient(to bottom, transparent, black);
  -webkit-mask-image: linear-gradient(to bottom, transparent, black);
}</code></pre>
  <p>
    Masking is useful for fade-in effects, image transitions, or creative designs where parts of an element are partially visible.
  </p>

  <h2>⚡ Practical Exercises</h2>
  <ol>
    <li>Apply grayscale and blur filters to images on hover for interactive effects.</li>
    <li>Create a card with <code>box-shadow</code> and text inside with <code>text-shadow</code> for depth.</li>
    <li>Experiment with <code>mix-blend-mode</code> to overlay semi-transparent colors over images.</li>
    <li>Create a circle avatar using <code>clip-path: circle()</code> and a triangular badge using <code>polygon()</code>.</li>
    <li>Use <code>mask-image</code> to create a fade effect on the bottom of an image.</li>
  </ol>

  <h2>📝 Best Practices</h2>
  <ul>
    <li>Use GPU-accelerated filters like blur and opacity for smoother performance.</li>
    <li>Combine multiple filters carefully to avoid overly heavy rendering.</li>
    <li>Always include <code>-webkit-</code> prefixes for <code>mask-image</code> on Safari and Chrome for cross-browser compatibility.</li>
    <li>Use <code>clip-path</code> and <code>mask-image</code> creatively for non-rectangular designs.</li>
    <li>Test visual effects on multiple devices to ensure performance and usability.</li>
  </ul>

  <h2>✅ Summary</h2>
  <p>
    CSS filters and effects provide developers with creative control over visual presentation, from blurring and color adjustments to shadows, blending, and masking. By mastering <code>filter</code>, <code>box-shadow</code>, <code>text-shadow</code>, <code>mix-blend-mode</code>, <code>clip-path</code>, and <code>mask-image</code>, you can enhance user experience, add depth, and create unique visual designs. The next lesson will focus on <strong>CSS Typography & Advanced Text Effects</strong>, enabling better readability and styling of textual content.
  </p>
</article>

    `}

    {title: "Advanced CSS Features", content: `<article>
  
  <h2>📌 Introduction to Advanced CSS Features</h2>
  <p>
    Modern CSS offers a variety of advanced features that improve maintainability, flexibility, and responsiveness of web designs. With tools like CSS custom properties (variables), mathematical functions (<code>calc()</code>, <code>min()</code>, <code>max()</code>, <code>clamp()</code>), logical properties for layout, and dynamic CSS functions such as <code>attr()</code> and <code>var()</code>, developers can write cleaner, more adaptive, and easier-to-maintain code. This lesson explores these advanced features in detail, with practical examples to integrate them effectively into real-world projects.
  </p>

  <h2>🔹 Custom Properties (CSS Variables)</h2>
  <p>
    CSS custom properties allow you to store values in variables, making it easier to maintain and reuse CSS across a project. Variables start with two hyphens (<code>--</code>) and are accessed with the <code>var()</code> function.
  </p>

  <pre><code>:root {
  --primary-color: #3498db;
  --secondary-color: #e74c3c;
  --font-size: 16px;
}

body {
  font-size: var(--font-size);
  color: var(--primary-color);
}

button {
  background-color: var(--secondary-color);
  padding: 10px 20px;
  color: white;
}</code></pre>

  <p>
    Using variables improves maintainability because you can change a value in one place (<code>:root</code>) instead of updating multiple selectors.
  </p>

  <h2>🔹 Mathematical Functions: calc(), min(), max(), clamp()</h2>

  <h3>1. calc()</h3>
  <p>
    The <code>calc()</code> function allows you to perform calculations with CSS values, combining units like <code>px</code>, <code>%</code>, <code>em</code>, etc.
  </p>

  <pre><code>.container {
  width: calc(100% - 40px); /* full width minus padding */
  height: calc(50vh - 20px);
}</code></pre>

  <h3>2. min()</h3>
  <p>
    The <code>min()</code> function selects the smaller of two or more values. Useful for responsive sizing.
  </p>

  <pre><code>h1 {
  font-size: min(5vw, 36px); /* font scales but max 36px */
}</code></pre>

  <h3>3. max()</h3>
  <p>
    The <code>max()</code> function selects the largest value. Useful for ensuring minimum sizes.
  </p>

  <pre><code>p {
  font-size: max(14px, 2vw); /* at least 14px */
}</code></pre>

  <h3>4. clamp()</h3>
  <p>
    The <code>clamp()</code> function combines min, preferred, and max values. It is perfect for responsive typography and spacing.
  </p>

  <pre><code>h2 {
  font-size: clamp(16px, 2.5vw, 24px); /* min 16px, preferred 2.5vw, max 24px */
}</code></pre>

  <h2>🔹 Logical Properties</h2>
  <p>
    Logical properties are modern CSS properties that replace physical properties like <code>margin-left</code> or <code>padding-top</code>. They adapt automatically to the writing mode, making your layout more versatile for internationalization and responsive designs.
  </p>

  <ul>
    <li><strong>margin-inline:</strong> sets horizontal margins (left/right in LTR languages, reversed in RTL).</li>
    <li><strong>margin-block:</strong> sets vertical margins (top/bottom in LTR/RTL writing modes).</li>
    <li><strong>padding-inline:</strong> horizontal padding.</li>
    <li><strong>padding-block:</strong> vertical padding.</li>
  </ul>

  <pre><code>.card {
  margin-block: 20px; /* vertical spacing */
  margin-inline: 15px; /* horizontal spacing */
  padding-block: 10px;
  padding-inline: 20px;
}</code></pre>

  <p>
    Logical properties simplify layout maintenance and improve support for languages with different writing directions.
  </p>

  <h2>🔹 CSS Functions: attr() & var()</h2>
  <p>
    CSS includes dynamic functions that allow using HTML attributes or variables within styling.
  </p>

  <h3>1. var()</h3>
  <p>
    Used to access custom properties (variables), as discussed earlier.
  </p>
  <pre><code>button {
  background-color: var(--primary-color);
}</code></pre>

  <h3>2. attr()</h3>
  <p>
    The <code>attr()</code> function retrieves the value of an HTML attribute and uses it in CSS, mostly for content generation with <code>content</code> property.
  </p>

  <pre><code>a::after {
  content: " (" attr(href) ")";
  font-size: 0.8em;
  color: gray;
}</code></pre>

  <p>
    This adds the link URL automatically after every anchor element for enhanced UX and accessibility.
  </p>

  <h2>⚡ Practical Exercises</h2>
  <ol>
    <li>Define CSS variables for colors, font sizes, and spacing. Use <code>var()</code> across your stylesheet.</li>
    <li>Use <code>calc()</code> to adjust widths of columns and containers dynamically.</li>
    <li>Experiment with <code>min()</code>, <code>max()</code>, and <code>clamp()</code> for responsive font sizes.</li>
    <li>Replace physical margins and paddings with logical properties to support LTR and RTL layouts.</li>
    <li>Use <code>attr()</code> to automatically display HTML attribute values in content or tooltips.</li>
  </ol>

  <h2>📝 Best Practices</h2>
  <ul>
    <li>Use CSS variables for colors, fonts, spacing, and other repeated values to simplify updates.</li>
    <li>Use <code>calc()</code>, <code>min()</code>, <code>max()</code>, and <code>clamp()</code> to create responsive designs without media queries for some properties.</li>
    <li>Leverage logical properties to build layouts that adapt to different writing modes and languages.</li>
    <li>Combine <code>attr()</code> with pseudo-elements for dynamic content enhancements.</li>
    <li>Test advanced CSS features across multiple browsers to ensure compatibility.</li>
  </ul>

  <h2>✅ Summary</h2>
  <p>
    Advanced CSS features like custom properties, mathematical functions, logical properties, and dynamic functions empower developers to write maintainable, flexible, and responsive code. By mastering these tools, you can reduce repetition, adapt layouts for internationalization, and create dynamic styles without relying heavily on JavaScript. The next lesson will cover <strong>CSS Transitions, Transformations & Animations Combined</strong>, focusing on creating complex interactive effects by combining previously learned concepts.
  </p>
</article>

    `}

    {title: "CSS Best Practices & Architecture ", content: `<article>
  
  <h2>📌 Introduction to CSS Best Practices & Architecture</h2>
  <p>
    Writing CSS is easy at first, but as projects grow, poorly structured stylesheets can become difficult to maintain, debug, and scale. CSS best practices and architectural approaches help developers organize code efficiently, avoid conflicts, and maintain consistent design across large projects. In this lesson, we’ll explore naming conventions like BEM, OOCSS, and SMACSS, proper file organization, an overview of popular CSS frameworks, and strategies to avoid specificity wars.
  </p>

  <h2>🔹 Naming Conventions</h2>
  <p>
    Clear and consistent naming conventions prevent confusion and make CSS easier to maintain. Some widely used methodologies include BEM, OOCSS, and SMACSS.
  </p>

  <h3>1. BEM (Block, Element, Modifier)</h3>
  <p>
    BEM is a popular convention for structuring CSS classes. It divides components into blocks, elements, and modifiers:
  </p>
  <ul>
    <li><strong>Block:</strong> the main component (<code>.button</code>, <code>.card</code>).</li>
    <li><strong>Element:</strong> child components within a block, connected with double underscores (<code>__</code>), e.g., <code>.card__title</code>.</li>
    <li><strong>Modifier:</strong> represents variations of blocks or elements using double dashes (<code>--</code>), e.g., <code>.button--primary</code>.</li>
  </ul>
  <pre><code>&lt;div class="card"&gt;
  &lt;h2 class="card__title"&gt;Hello&lt;/h2&gt;
  &lt;p class="card__content"&gt;Some content&lt;/p&gt;
&lt;/div&gt;

.card { ... }
.card__title { ... }
.card__content { ... }
.card--highlight { background-color: yellow; }</code></pre>

  <h3>2. OOCSS (Object-Oriented CSS)</h3>
  <p>
    OOCSS encourages separating structure and skin, as well as container and content. The idea is to create reusable “objects”:
  </p>
  <pre><code>.media { display: flex; }
.media__img { width: 100px; }
.media__body { flex: 1; }
.text-primary { color: blue; }</code></pre>
  <p>
    This approach promotes reusability and modularity.
  </p>

  <h3>3. SMACSS (Scalable and Modular Architecture for CSS)</h3>
  <p>
    SMACSS categorizes CSS rules into 5 types: Base, Layout, Module, State, and Theme. This helps structure CSS logically and maintain large projects.
  </p>
  <ul>
    <li><strong>Base:</strong> default element styles (e.g., <code>body</code>, <code>h1</code>).</li>
    <li><strong>Layout:</strong> major structural components (e.g., <code>.header</code>, <code>.footer</code>).</li>
    <li><strong>Module:</strong> reusable components (e.g., <code>.card</code>, <code>.button</code>).</li>
    <li><strong>State:</strong> variations like <code>.is-active</code>, <code>.hidden</code>.</li>
    <li><strong>Theme:</strong> site-wide style changes like color schemes.</li>
  </ul>

  <h2>🔹 File Organization</h2>
  <p>
    Proper file organization is critical for scalability and maintainability. A typical modern CSS project might use multiple files:
  </p>
  <ul>
    <li><code>reset.css</code> – resets default browser styles for consistency.</li>
    <li><code>variables.css</code> – stores custom properties (colors, spacing, font sizes).</li>
    <li><code>base.css</code> – contains base element styles (body, h1-h6, p, a).</li>
    <li><code>components.css</code> – styles for reusable components (buttons, cards, modals).</li>
    <li><code>layout.css</code> – styles for overall page structure (grid, header, footer).</li>
    <li><code>utilities.css</code> – small helper classes for margins, padding, colors, and typography.</li>
  </ul>
  <p>
    This modular approach makes it easier to maintain large stylesheets and avoid conflicts.
  </p>

  <h2>🔹 CSS Frameworks Overview</h2>
  <p>
    CSS frameworks provide prebuilt components and utilities that accelerate development. They also enforce consistency and cross-browser compatibility.
  </p>

  <h3>1. Bootstrap</h3>
  <ul>
    <li>Popular for responsive grid system and components.</li>
    <li>Includes prebuilt utilities and JavaScript components.</li>
    <li>Pros: quick setup, well-documented, large community.</li>
    <li>Cons: heavier file size, less flexibility if you want custom design.</li>
  </ul>

  <h3>2. Tailwind CSS</h3>
  <ul>
    <li>Utility-first CSS framework.</li>
    <li>Allows composing designs using small utility classes like <code>p-4</code>, <code>text-center</code>, <code>bg-blue-500</code>.</li>
    <li>Pros: highly customizable, no unused CSS when purged, promotes consistency.</li>
    <li>Cons: can produce verbose HTML if not used with components/templates.</li>
  </ul>

  <h3>3. Other Frameworks</h3>
  <ul>
    <li>Bulma: lightweight, modern flex-based framework.</li>
    <li>Foundation: enterprise-level responsive framework.</li>
    <li>Materialize: implements Google Material Design.</li>
  </ul>

  <h2>🔹 Avoiding Specificity Wars</h2>
  <p>
    Specificity wars occur when CSS selectors compete for priority, making styles hard to override. To avoid this:
  </p>
  <ul>
    <li>Prefer classes over IDs for styling; classes are reusable and less specific.</li>
    <li>Use BEM, OOCSS, or SMACSS for predictable, modular naming.</li>
    <li>Avoid excessive nesting in CSS (especially with preprocessors like SCSS).</li>
    <li>Use utility classes for small reusable styles instead of overcomplicating selectors.</li>
    <li>Reserve <code>!important</code> for exceptional cases only; overuse leads to maintenance nightmares.</li>
  </ul>

  <h2>⚡ Practical Exercises</h2>
  <ol>
    <li>Refactor an existing CSS project using BEM or SMACSS methodology.</li>
    <li>Split CSS files into modular sections: variables, base, components, layout, utilities.</li>
    <li>Create a small project using Tailwind CSS to experience utility-first workflow.</li>
    <li>Compare Bootstrap and Tailwind approaches in a simple responsive layout.</li>
    <li>Analyze CSS specificity in your project and reduce conflicts by using consistent class naming.</li>
  </ol>

  <h2>📝 Best Practices</h2>
  <ul>
    <li>Follow a clear naming convention for consistency and maintainability.</li>
    <li>Organize CSS files modularly and logically to simplify updates.</li>
    <li>Use frameworks when they speed up development but remain flexible to override styles.</li>
    <li>Keep specificity low; rely on class-based selectors and modular CSS.</li>
    <li>Document CSS structure for team collaboration and future scalability.</li>
  </ul>

  <h2>✅ Summary</h2>
  <p>
    CSS best practices and architecture are critical for building maintainable, scalable, and efficient stylesheets. By adopting naming conventions like BEM, OOCSS, or SMACSS, organizing files logically, leveraging CSS frameworks when appropriate, and avoiding specificity wars, developers can manage large projects effectively and reduce technical debt. The final lesson will cover <strong>CSS Optimization, Performance & Modern Techniques</strong> to ensure your stylesheets are fast, efficient, and ready for production.
  </p>
</article>

    `}

    {title: "Real-World CSS Project", content: `<article>
  
  <h2>📌 Introduction</h2>
  <p>
    After completing 19 lessons on CSS, it’s time to consolidate your knowledge with a real-world project. In this lesson, we will build a responsive, animated landing page using all the core CSS concepts: Flexbox, Grid, transitions, hover effects, media queries, and best practices. This project will reinforce your understanding of CSS, demonstrate how to structure a professional layout, and give you hands-on experience with real-world styling challenges.
  </p>

  <h2>🔹 Project Planning & Layout</h2>
  <p>
    Before writing any code, sketch your landing page layout. Typical sections include:
  </p>
  <ul>
    <li><strong>Header:</strong> Logo, navigation menu.</li>
    <li><strong>Hero Section:</strong> Prominent heading, tagline, CTA button, background image or gradient.</li>
    <li><strong>Features/Services:</strong> Cards displaying key services or products.</li>
    <li><strong>Testimonials:</strong> User feedback or reviews.</li>
    <li><strong>Footer:</strong> Contact info, social links, legal information.</li>
  </ul>
  <p>
    Use a combination of Flexbox for alignment and Grid for structured layouts such as feature cards.
  </p>

  <h2>🔹 Setting Up the Project</h2>
  <p>
    Organize your files following best practices:
  </p>
  <ul>
    <li><code>index.html</code> – main HTML file</li>
    <li><code>css/reset.css</code> – reset default browser styles</li>
    <li><code>css/variables.css</code> – colors, fonts, spacing variables</li>
    <li><code>css/base.css</code> – base typography and element styles</li>
    <li><code>css/components.css</code> – buttons, cards, navigation</li>
    <li><code>css/layout.css</code> – header, footer, hero, main sections</li>
    <li><code>css/responsive.css</code> – media queries and breakpoints</li>
  </ul>

  <h2>🔹 Building the Header</h2>
  <pre><code>&lt;header class="header"&gt;
  &lt;div class="header__logo"&gt;MyBrand&lt;/div&gt;
  &lt;nav class="header__nav"&gt;
    &lt;a href="#" class="header__link"&gt;Home&lt;/a&gt;
    &lt;a href="#" class="header__link"&gt;Services&lt;/a&gt;

  <h2>🔹 Hero Section with Animation</h2>
  <p>
    Hero sections often include large headings, call-to-action buttons, and images or backgrounds. Add subtle animations for headings or images using <code>@keyframes</code> and <code>transition</code>.
  </p>

  <pre><code>&lt;section class="hero"&gt;
  &lt;h1 class="hero__title"&gt;Welcome to MyBrand&lt;/h1&gt;
  &lt;p class="hero__subtitle"&gt;We deliver exceptional services&lt;/p&gt;
  &lt;a href="#services" class="hero__cta"&gt;Get Started&lt;/a&gt;

  <pre><code>.hero {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  height: 80vh;
  background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
  color: white;
}

.hero__title {
  font-size: clamp(32px, 5vw, 64px);
  animation: fadeInDown 1s ease forwards;
}

@keyframes fadeInDown {
  0% { opacity: 0; transform: translateY(-50px); }
  100% { opacity: 1; transform: translateY(0); }
}

.hero__cta {
  margin-top: 20px;
  padding: 15px 30px;
  background-color: white;
  color: var(--primary-color);
  border-radius: 5px;
  text-decoration: none;
  font-weight: bold;
  transition: transform 0.3s ease, background-color 0.3s ease;
}

.hero__cta:hover {
  transform: scale(1.05);
  background-color: var(--secondary-color);
  color: white;
}</code></pre>

  <h2>🔹 Features Section with Grid</h2>
  <p>

  </p>

  <pre><code>&lt;section class="features"&gt;
  &lt;div class="features__grid"&gt;
    &lt;div class="features__card"&gt;&lt;h3&gt;Fast&lt;/h3&gt;&lt;p&gt;Lightning speed services.&lt;/p&gt;&lt;/div&gt;
    &lt;div class="features__card"&gt;&lt;h3&gt;Reliable&lt;/h3&gt;&lt;p&gt;Consistent quality.&lt;/p&gt;&lt;/div&gt;

  &lt;/div&gt;
&lt;/section&gt;</code></pre>

  <pre><code>.features__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

}

.features__card:hover {

}</code></pre>

  ];

  let currentLesson = 0;

  // Generate lesson list dynamically
  const lessonListDiv = document.getElementById("lessonList");
  lessons.forEach((lesson, index) => {
    const div = document.createElement("div");
    div.className = "lesson-card";
    div.innerText = "Lesson " + (index+1) + ": " + lesson.title;
    div.onclick = () => openLesson(index);
    lessonListDiv.appendChild(div);
  });

  function openLesson(index) {
    currentLesson = index;
    document.getElementById("home").classList.remove("active");
    document.getElementById("lessonPage").classList.add("active");
    showLesson();
  }

  function showLesson() {
    const lesson = lessons[currentLesson];
    document.getElementById("lessonContent").innerHTML = `
      <h2>Lesson ${currentLesson+1}: ${lesson.title}</h2>
      <p>${lesson.content}</p>
    `;
  }

  function nextLesson() {
    if (currentLesson < lessons.length - 1) {
      currentLesson++;
      showLesson();
    } else {
      alert("🎉 You finished all lessons!");
    }
  }

  function prevLesson() {
    if (currentLesson > 0) {
      currentLesson--;
      showLesson();
    } else {
      alert("This is the first lesson!");
    }
  }

  function goHome() {
    document.getElementById("lessonPage").classList.remove("active");
    document.getElementById("home").classList.add("active");
  }
</script>

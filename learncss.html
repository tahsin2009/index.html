    {title: "Introduction to CSS", content: `<article>


  <h2>💡 What Is CSS?</h2>
  <p>
    CSS stands for <strong>Cascading Style Sheets</strong>. It is the language used to describe how HTML elements should look on a webpage. 
    If HTML provides the <em>structure</em> of a website (like the bricks and walls of a house), then CSS provides the <em>style</em> (the paint, furniture, and decoration). 
    Without CSS, websites would look plain—just black text on a white background. With CSS, you can control colors, fonts, spacing, layouts, animations, and much more.
  </p>

  <pre><code>&lt;!-- Example without CSS --&gt;
&lt;h1&gt;Hello, World!&lt;/h1&gt;
&lt;p&gt;This is my first website.&lt;/p&gt;

&lt;!-- Example with CSS --&gt;
&lt;style&gt;
  h1 {
    color: blue;
    font-family: Arial, sans-serif;
    text-align: center;
  }
  p {
    color: gray;
    font-size: 18px;
  }
&lt;/style&gt;
&lt;h1&gt;Hello, World!&lt;/h1&gt;
&lt;p&gt;This is my first website.&lt;/p&gt;
  </code></pre>

  <p>
    In the second example, the CSS changes the color, font, and alignment of the text. This shows how CSS transforms a plain structure into something attractive and user-friendly.
  </p>

  <h2>📜 The Role of CSS in Web Development</h2>
  <ul>
    <li><strong>Presentation:</strong> CSS defines the colors, typography, and layout of a webpage.</li>
    <li><strong>Separation of concerns:</strong> HTML handles structure, while CSS handles style. This keeps code clean and manageable.</li>
    <li><strong>Consistency:</strong> One CSS file can style an entire website, ensuring all pages look uniform.</li>
    <li><strong>Responsiveness:</strong> CSS adapts websites to different screen sizes (desktop, tablet, mobile).</li>
    <li><strong>Performance:</strong> Well-written CSS reduces code repetition and loads faster compared to styling inline in HTML.</li>
  </ul>

  <h2>📖 A Brief History of CSS</h2>
  <p>
    CSS was first proposed in 1994 by Håkon Wium Lie, who worked with Tim Berners-Lee (the inventor of the World Wide Web). 
    The first official specification, <strong>CSS1</strong>, was released in 1996. Since then, CSS has evolved a lot:
  </p>
  <ul>
    <li><strong>CSS1 (1996):</strong> Basic styling—fonts, colors, backgrounds.</li>
    <li><strong>CSS2 (1998):</strong> Added positioning, z-index, media types.</li>
    <li><strong>CSS2.1 (2004):</strong> Bug fixes and improvements, became widely adopted.</li>
    <li><strong>CSS3 (2011+):</strong> Introduced modular system, animations, transitions, gradients, flexbox, grid, and more.</li>
  </ul>
  <p>
    Today, CSS is still evolving, with modern features like <code>CSS Grid</code>, <code>clamp()</code>, and <code>variables</code> making web design more powerful and flexible.
  </p>

  <h2>🖊️ How CSS Works</h2>
  <p>
    CSS works by applying <em>rules</em> to HTML elements. Each rule consists of:
  </p>
  <ul>
    <li><strong>Selector:</strong> Which HTML element(s) the style applies to.</li>
    <li><strong>Property:</strong> What aspect you want to change (color, font-size, margin).</li>
    <li><strong>Value:</strong> The specific setting for that property.</li>
  </ul>

  <pre><code>selector {
  property: value;
}

p {
  color: red;
  font-size: 16px;
}
  </code></pre>

  <p>
    In this example, the <code>p</code> selector targets all paragraphs, making their text red and font size 16px.
  </p>

  <h2>🔗 Ways to Add CSS to HTML</h2>
  <p>There are three main ways to include CSS in a webpage:</p>

  <h3>1. Inline CSS</h3>
  <p>Applied directly inside an HTML element using the <code>style</code> attribute.</p>
  <pre><code>&lt;p style="color: green; font-size: 20px;"&gt;Hello with inline CSS!&lt;/p&gt;
  </code></pre>
  <p><strong>Use case:</strong> Quick styling of single elements (not recommended for large projects).</p>

  <h3>2. Internal CSS</h3>
  <p>Written inside a <code>&lt;style&gt;</code> tag in the HTML <code>&lt;head&gt;</code> section.</p>
  <pre><code>&lt;style&gt;
  h1 {
    color: purple;
  }
&lt;/style&gt;
  </code></pre>
  <p><strong>Use case:</strong> Small projects or single-page websites.</p>

  <h3>3. External CSS</h3>
  <p>Stored in a separate <code>.css</code> file and linked with <code>&lt;link&gt;</code> in the HTML <code>&lt;head&gt;</code>.</p>
  <pre><code>&lt;link rel="stylesheet" href="styles.css"&gt;
  </code></pre>
  <p><strong>Use case:</strong> Best practice for medium to large websites, promotes reusability and clean code.

    `},
    {title: "CSS Syntax & Selectors", content: `<article>

  <h2>🧩 Why Syntax & Selectors Matter</h2>
  <p>
    If HTML is the skeleton of a web page, CSS is the clothing and style that makes it appealing. But before you can
    make your website beautiful, you must learn how CSS is written and how to “point” your styles at the correct
    elements. This is where syntax and selectors come in. Think of syntax as the grammar of the CSS language, and
    selectors as addresses that tell CSS which elements to dress up. Without a solid grasp of these two, you’ll
    constantly run into confusion or buggy results.
  </p>

  <h2>📜 The Structure of a CSS Rule</h2>
  <p>
    A CSS rule is a combination of three parts: a <em>selector</em>, one or more <em>properties</em>, and the
    corresponding <em>values</em>.
  </p>

  <pre><code>selector {
  property: value;
}

p {
  color: red;
  font-size: 16px;
}
  </code></pre>

  <p>
    In this example:
  </p>
  <ul>
    <li><strong>Selector:</strong> <code>p</code> — selects all paragraph elements.</li>
    <li><strong>Properties:</strong> <code>color</code>, <code>font-size</code>.</li>
    <li><strong>Values:</strong> <code>red</code>, <code>16px</code>.</li>
  </ul>
  <p>
    Together, this rule makes all paragraphs appear red with a font size of 16 pixels.
  </p>

  <h2>🔍 The Basic Types of Selectors</h2>
  <p>
    CSS gives you different ways to select elements, from very broad (all elements) to very specific (a single element
    with a unique ID). Let’s look at the most essential ones:
  </p>

  <h3>1. Universal Selector (<code>*</code>)</h3>
  <p>
    The universal selector matches every element on the page. It’s often used for resets, where you want to wipe out
    browser default styles before applying your own.
  </p>
  <pre><code>* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
  </code></pre>
  <p>
    This ensures every element starts with no margin or padding, and <code>box-sizing</code> is standardized.
  </p>

  <h3>2. Element Selector</h3>
  <p>
    Element selectors target HTML tags directly. They are simple and good for applying broad styling.
  </p>
  <pre><code>h1 {
  color: navy;
}
p {
  line-height: 1.6;
}
  </code></pre>
  <p>
    Every <code>&lt;h1&gt;</code> will be navy, and every <code>&lt;p&gt;</code> will have comfortable spacing.
  </p>

  <h3>3. Class Selector (<code>.classname</code>)</h3>
  <p>
    Classes allow you to style groups of elements with the same label. In HTML, you assign them using
    <code>class="..."</code>. In CSS, you target them with a period (<code>.</code>).
  </p>
  <pre><code>&lt;p class="highlight"&gt;Important note&lt;/p&gt;

.highlight {
background-color: yellow;
} </code></pre>

  <p>
    This lets you reuse <code>.highlight</code> on multiple elements whenever you want them highlighted.
  </p>

  <h3>4. ID Selector (<code>#id</code>)</h3>
  <p>
    An ID is meant to uniquely identify a single element. Use it sparingly and only for one element per page. In CSS,
    IDs are targeted with a hash symbol (<code>#</code>).
  </p>
  <pre><code>&lt;h1 id="main-title"&gt;Welcome!&lt;/h1&gt;

#main-title {
font-size: 36px;
color: darkgreen;
} </code></pre>

  <p>
    The <code>#main-title</code> ID makes the heading larger and green. IDs have higher priority than classes when
    conflicts arise.
  </p>

  <h2>💬 Comments in CSS</h2>
  <p>
    Comments are like sticky notes inside your code. They don’t affect rendering but are critical for keeping code
    readable. In CSS, comments start with <code>/*</code> and end with <code>*/</code>.
  </p>
  <pre><code>/* Global styles */
body {
  font-family: Arial, sans-serif;
}

/* Footer styles */
#footer {
color: gray;
font-size: 12px;
} </code></pre>

  <h2>⚖️ Specificity: Which Rule Wins?</h2>
  <p>
    What happens when two different rules target the same element? CSS uses a scoring system called
    <strong>specificity</strong>.
  </p>
  <ul>
    <li><strong>Element selectors</strong> are weakest.</li>
    <li><strong>Class selectors</strong> are stronger.</li>
    <li><strong>ID selectors</strong> are stronger still.</li>
    <li><strong>Inline styles</strong> (style attribute in HTML) override all external CSS.</li>
  </ul>

  <pre><code>p { color: blue; }        /* Weakest */
.note { color: red; }     /* Stronger */
#intro { color: green; }  /* Strongest */
  </code></pre>

  <p>
    If a paragraph has both <code>class="note"</code> and <code>id="intro"</code>, the green color from the ID wins.
  </p>

  <h2>🧠 Real-World Analogy for Specificity</h2>
  <p>
    Imagine a school. The rule “All students wear blue uniforms” is like an element selector. “Students in class 10
    wear red ties” is like a class selector. And “The head boy wears a golden badge” is like an ID selector. The more
    specific the rule, the fewer people it applies to—but the stronger its authority.
  </p>

  <h2>🖼️ Mini Example: Putting It All Together</h2>
  <pre><code>&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
  &lt;style&gt;
    * { margin: 0; padding: 0; }
    h1 { color: navy; }
    .note { color: darkred; }
    #footer { font-size: 12px; color: gray; }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Welcome&lt;/h1&gt;
  &lt;p class="note"&gt;This is an important note.&lt;/p&gt;
  &lt;p id="footer"&gt;© 2025 My Website&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;
  </code></pre>

  <p>
    Here’s what happens:
  </p>
  <ul>
    <li><code>*</code> resets margins/padding.</li>
    <li>The <code>&lt;h1&gt;</code> turns navy.</li>
    <li>The note paragraph turns dark red via class.</li>
    <li>The footer shrinks and grays out via ID.</li>
  </ul>

  <h2>⚠️ Common Beginner Mistakes</h2>
  <ul>
    <li>Using IDs everywhere instead of classes. This makes your CSS harder to maintain.</li>
    <li>Forgetting curly braces or semicolons, causing CSS rules to break.</li>
    <li>Not commenting code, leading to confusion later.</li>
    <li>Overusing the universal selector, which can harm performance.</li>
  </ul>

  <h2>📝 Practice Exercises</h2>
  <ol>
    <li>Create a simple page with two headings, three paragraphs, and a footer. Style each differently using element, class, and ID selectors.</li>
    <li>Write universal CSS that changes the default font and sets a background color for the whole page.</li>
    <li>Apply conflicting rules (element vs class vs ID) and observe which wins.</li>
    <li>Add comments to explain each rule in your CSS file.</li>
  </ol>

  <h2>✅ Key Takeaways</h2>
  <ul>
    <li>CSS syntax = selector + property + value.</li>
    <li>Selectors let you target elements broadly or precisely.</li>
    <li>Comments improve readability without affecting rendering.</li>
    <li>Specificity decides which rule applies when conflicts occur.</li>
  </ul>

  <h2>🚀 What’s Next?</h2>
  <p>
    In the next lesson, we’ll expand into <strong>Advanced Selectors</strong>, including descendant selectors,
    attribute selectors, pseudo-classes, and pseudo-elements. These let you select elements with surgical precision.
  </p>
</article>
 `},
    {title: "Advanced CSS Selectors", content: `<article>
  
  <h2>🌱 Why Advanced Selectors Matter</h2>
  <p>
    In the previous lesson, you learned the basics of CSS selectors—universal, element, class, and ID. While these are
    useful, real-world projects often require more precision. For example, you might want to style a link only when a
    user hovers over it, or style only the first paragraph in a container. That’s where <strong>advanced selectors</strong> come in.
  </p>
  <p>
    Mastering advanced selectors helps you write cleaner, more efficient code by avoiding unnecessary classes or IDs.
    It makes your CSS more elegant and your HTML less cluttered.
  </p>

  <h2>🔗 Combinators: Selecting Based on Relationships</h2>
  <p>
    Combinators let you style elements based on their relationship in the HTML structure. Think of them as ways to
    “navigate the family tree” of HTML elements.
  </p>

  <h3>1. Descendant Selector (space)</h3>
  <p>
    The descendant selector targets elements nested inside another element, no matter how deep. It’s written as a space
    between two selectors.
  </p>
  <pre><code>div p {
  color: darkblue;
}
  </code></pre>
  <p>
    This styles all paragraphs inside a <code>&lt;div&gt;</code>, even if they are nested in multiple layers of child elements.
  </p>

  <h3>2. Child Selector (<code>&gt;</code>)</h3>
  <p>
    The child selector is stricter than the descendant selector. It only targets elements that are <em>direct</em>
    children of a parent.
  </p>
  <pre><code>div &gt; p {
  font-weight: bold;
}
  </code></pre>
  <p>
    This will make only the immediate paragraph children of <code>&lt;div&gt;</code> bold, ignoring nested ones.
  </p>

  <h3>3. Adjacent Sibling Selector (<code>+</code>)</h3>
  <p>
    This selector targets an element that immediately follows another element, sharing the same parent.
  </p>
  <pre><code>h2 + p {
  margin-top: 0;
}
  </code></pre>
  <p>
    Here, the first paragraph directly after an <code>&lt;h2&gt;</code> has its top margin removed.
  </p>

  <h3>4. General Sibling Selector (<code>~</code>)</h3>
  <p>
    Unlike the adjacent sibling, the general sibling selector targets all siblings that come after a specific element,
    not just the first one.
  </p>
  <pre><code>h2 ~ p {
  color: gray;
}
  </code></pre>
  <p>
    All paragraphs following an <code>&lt;h2&gt;</code> in the same parent container will be gray.
  </p>

  <h2>🔎 Attribute Selectors</h2>
  <p>
    Attribute selectors allow you to target elements based on their attributes and values. They are especially powerful
    for styling forms and links.
  </p>

  <h3>Basic Attribute Selector</h3>
  <pre><code>input[type="text"] {
  border: 1px solid #333;
}
  </code></pre>
  <p>
    This applies only to text input fields, leaving other input types (like checkboxes) unaffected.
  </p>

  <h3>Partial Attribute Matches</h3>
  <ul>
    <li><code>[attr^="value"]</code> — starts with</li>
    <li><code>[attr$="value"]</code> — ends with</li>
    <li><code>[attr*="value"]</code> — contains</li>
  </ul>
  <pre><code>a[href^="https"] { color: green; }  /* secure links */
a[href$=".pdf"] { color: red; }      /* PDF files */
a[href*="example"] { color: orange; } /* links containing 'example' */
  </code></pre>

  <h2>🎭 Pseudo-Classes</h2>
  <p>
    Pseudo-classes style elements in a specific state, like when a user hovers or when an element is the first child.
  </p>

  <h3>:hover</h3>
  <p>Changes appearance when the mouse pointer hovers over an element.</p>
  <pre><code>a:hover {
  text-decoration: underline;
}
  </code></pre>

  <h3>:focus</h3>
  <p>Applied when an element (usually input fields) gains focus, either by clicking or using the keyboard.</p>
  <pre><code>input:focus {
  outline: 2px solid dodgerblue;
}
  </code></pre>

  <h3>:nth-child()</h3>
  <p>
    Lets you select elements based on their position in a parent’s child list. It accepts formulas like <code>even</code>,
    <code>odd</code>, or <code>2n+1</code>.
  </p>
  <pre><code>li:nth-child(odd) {
  background: #f9f9f9;
}
  </code></pre>
  <p>
    This stripes list items, giving odd-numbered items a different background.
  </p>

  <h2>🎨 Pseudo-Elements</h2>
  <p>
    Pseudo-elements create virtual elements that don’t exist in HTML but can be styled in CSS. They are great for
    decorative touches.
  </p>

  <h3>::before</h3>
  <p>
    Inserts content before the element’s actual content. Often used for icons or visual markers.
  </p>
  <pre><code>p::before {
  content: "👉 ";
}
  </code></pre>

  <h3>::after</h3>
  <p>
    Similar to <code>::before</code>, but inserts content after the element’s content.
  </p>
  <pre><code>p::after {
  content: " ✅";
}
  </code></pre>

  <p>
    Together, <code>::before</code> and <code>::after</code> are essential for adding non-semantic decorations without
    extra HTML.
  </p>

  <h2>🧪 Putting It All Together</h2>
  <pre><code>&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
  &lt;style&gt;
    div p { color: navy; }
    div &gt; p { font-weight: bold; }
    h2 + p { color: crimson; }
    h2 ~ p { font-style: italic; }
    input[type="text"]:focus { border: 2px solid blue; }
    li:nth-child(even) { background: #eee; }
    p::before { content: "👉 "; }
    p::after { content: " ✅"; }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;div&gt;
    &lt;p&gt;Direct child paragraph&lt;/p&gt;
    &lt;section&gt;
      &lt;p&gt;Nested paragraph&lt;/p&gt;
    &lt;/section&gt;
  &lt;/div&gt;
  &lt;h2&gt;Heading&lt;/h2&gt;
  &lt;p&gt;Adjacent paragraph&lt;/p&gt;
  &lt;p&gt;General sibling paragraph&lt;/p&gt;
  &lt;input type="text" placeholder="Focus me"&gt;
  &lt;ul&gt;
    &lt;li&gt;Item 1&lt;/li&gt;
    &lt;li&gt;Item 2&lt;/li&gt;
    &lt;li&gt;Item 3&lt;/li&gt;
  &lt;/ul&gt;
&lt;/body&gt;
&lt;/html&gt;
  </code></pre>

  <p>
    This example demonstrates descendant, child, sibling selectors, attribute selectors, pseudo-classes, and
    pseudo-elements all working together.
  </p>

  <h2>📝 Practice Exercises</h2>
  <ol>
    <li>Use a child selector to style only the first-level list items in a navigation menu.</li>
    <li>Style all external links (those starting with <code>https</code>) in a different color.</li>
    <li>Create a hover effect for buttons that changes background color.</li>
    <li>Use <code>:nth-child()</code> to stripe a table with alternating row colors.</li>
    <li>Add a decorative arrow before each list item using <code>::before</code>.</li>
  </ol>

  <h2>🚀 What’s Next?</h2>
  <p>
    In the next lesson, we’ll dive into <strong>Colors & Backgrounds</strong>. You’ll learn how to use hex codes, RGB,
    HSL, gradients, and background images to bring your designs to life.
  </p>
</article>

    `},
    {title: "CSS Colors & Backgrounds", content: `<article>
  
  <h2>🌈 Why Colors & Backgrounds Matter</h2>
  <p>
    Colors and backgrounds are the foundation of web design. They set the mood of a website, improve readability, and
    highlight important elements. Imagine a page without color—it would feel empty and lifeless. With CSS, you gain
    precise control over how text, boxes, and backgrounds appear. This lesson will dive deep into every way you can use
    color and backgrounds, from simple HEX values to advanced gradients and overlays.
  </p>

  <h2>🎨 CSS Color Formats</h2>
  <p>
    CSS supports several different ways of writing colors. While they all serve the same purpose, each format has its
    advantages depending on the project.
  </p>

  <h3>1. HEX Colors</h3>
  <p>
    HEX (hexadecimal) is one of the most common color notations in CSS. It starts with a hash (<code>#</code>) followed
    by 3 or 6 characters, representing red, green, and blue values.
  </p>
  <pre><code>h1 {
  color: #ff0000; /* red */
}
p {
  color: #00ff00; /* green */
}
  </code></pre>
  <p>
    Shortened 3-digit HEX codes are allowed: <code>#f00</code> is the same as <code>#ff0000</code>.
  </p>

  <h3>2. RGB Colors</h3>
  <p>
    RGB stands for Red, Green, Blue. Values range from 0–255. This format is easier when adjusting color intensity.
  </p>
  <pre><code>h2 {
  color: rgb(0, 0, 255); /* blue */
}
  </code></pre>

  <h3>3. RGBA Colors</h3>
  <p>
    RGBA is just RGB with an added alpha channel (transparency). The alpha value ranges from 0 (completely transparent)
    to 1 (fully opaque).
  </p>
  <pre><code>div {
  background-color: rgba(255, 0, 0, 0.5); /* semi-transparent red */
}
  </code></pre>

  <h3>4. HSL Colors</h3>
  <p>
    HSL stands for Hue, Saturation, and Lightness. It’s more human-friendly for designing palettes since it separates
    “color” from “brightness.”
  </p>
  <pre><code>button {
  background: hsl(200, 100%, 50%); /* bright sky blue */
}
  </code></pre>
  <p>
    Hue is measured in degrees (0–360), saturation is a percentage (0% = gray, 100% = full color), and lightness is also
    a percentage (0% = black, 100% = white).
  </p>

  <h2>🖼️ Background Properties</h2>
  <p>
    Beyond text colors, CSS allows you to paint backgrounds of elements with solid colors, images, or gradients. Here
    are the main properties you’ll use:
  </p>

  <h3>Background Color</h3>
  <pre><code>body {
  background-color: #f4f4f4;
}
  </code></pre>
  <p>
    A neutral background color like light gray makes text more readable.
  </p>

  <h3>Background Image</h3>
  <p>
    You can set images as element backgrounds.
  </p>
  <pre><code>div {
  background-image: url("pattern.png");
}
  </code></pre>

  <h3>Background Repeat</h3>
  <p>
    By default, images repeat in both directions. Control this with <code>background-repeat</code>.
  </p>
  <pre><code>div {
  background-image: url("pattern.png");
  background-repeat: repeat-x; /* only horizontally */
}
  </code></pre>

  <h3>Background Size</h3>
  <p>
    Adjust how the background image fits inside the element.
  </p>
  <pre><code>header {
  background-image: url("banner.jpg");
  background-size: cover; /* fills entire area, crops if needed */
}
  </code></pre>
  <p>
    Options include <code>auto</code>, <code>contain</code>, <code>cover</code>, or exact units like <code>100px</code>.
  </p>

  <h3>Background Position</h3>
  <p>
    Defines where the image is anchored inside the element.
  </p>
  <pre><code>header {
  background-image: url("banner.jpg");
  background-position: center top;
}
  </code></pre>

  <h3>Background Attachment</h3>
  <p>
    This controls how the image behaves when the page scrolls.
  </p>
  <ul>
    <li><code>scroll</code> (default) — background scrolls with content.</li>
    <li><code>fixed</code> — background stays in place (parallax effect).</li>
    <li><code>local</code> — background scrolls with element’s content.</li>
  </ul>
  <pre><code>body {
  background-image: url("mountains.jpg");
  background-attachment: fixed;
}
  </code></pre>

  <h2>🌅 Gradients in CSS</h2>
  <p>
    CSS gradients let you blend colors smoothly without images. They are treated as background images, so you set them
    with <code>background-image</code>.
  </p>

  <h3>Linear Gradients</h3>
  <p>
    Colors flow in a straight line—top to bottom, left to right, or at any angle.
  </p>
  <pre><code>div {
  background: linear-gradient(to right, red, yellow);
}
  </code></pre>

  <h3>Radial Gradients</h3>
  <p>
    Colors spread outward in a circular or elliptical shape.
  </p>
  <pre><code>div {
  background: radial-gradient(circle, blue, white);
}
  </code></pre>

  <h3>Conic Gradients</h3>
  <p>
    Colors rotate around a center point, similar to a pie chart.
  </p>
  <pre><code>div {
  background: conic-gradient(from 0deg, red, yellow, green, blue, red);
}
  </code></pre>

  <h2>🪞 Transparency & Overlays</h2>
  <p>
    Transparency lets you layer colors and backgrounds for creative effects. You can achieve this with RGBA, HSLA, or
    the <code>opacity</code> property.
  </p>

  <h3>Opacity Property</h3>
  <pre><code>img {
  opacity: 0.7; /* 70% visible */
}
  </code></pre>

  <h3>Overlay Example</h3>
  <p>
    A common design pattern is to place a semi-transparent overlay over a background image to make text readable.
  </p>
  <pre><code>header {
  background-image: url("hero.jpg");
  position: relative;
}

header::before {
content: "";
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.5); /* dark overlay */
} </code></pre>

  <h2>🧪 Putting It All Together</h2>
  <pre><code>&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
  &lt;style&gt;
    body {
      background: linear-gradient(to right, #74ebd5, #9face6);
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      background-image: url("hero.jpg");
      background-size: cover;
      background-position: center;
      height: 300px;
      position: relative;
    }
    header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
    }
    h1 {
      position: relative;
      text-align: center;
      top: 120px;
      font-size: 3rem;
    }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;header&gt;
    &lt;h1&gt;Welcome to CSS Colors &amp; Backgrounds&lt;/h1&gt;
  &lt;/header&gt;
&lt;/body&gt;
&lt;/html&gt;
  </code></pre>

  <h2>📝 Practice Exercises</h2>
  <ol>
    <li>Set your webpage background to a gradient from blue to purple.</li>
    <li>Use a fixed background image and overlay it with a dark transparent layer.</li>
    <li>Create striped list items using alternating background colors.</li>
    <li>Experiment with HSL colors to design a light and dark theme.</li>
    <li>Design a button with a hover gradient effect.</li>
  </ol>

  <h2>🚀 What’s Next?</h2>
  <p>
    In the next lesson, we’ll explore <strong>Text & Fonts</strong> in CSS. You’ll learn how to style typography with
    custom fonts, font sizes, line spacing, and text effects to make your content stand out.
  </p>
</article>

    `},
    {title: "Text & Fonts ", content: `<article>
  <h2>📝 Introduction</h2>
  <p>
    Text is at the heart of nearly every website. From blog posts to e-commerce product descriptions, typography plays a critical role in how users interact with content. In CSS, you can control not just the font itself but also how it scales, aligns, spaces, and even animates. In this lesson, we’ll dive deep into <strong>fonts and text styling</strong>, covering everything from the basics of font families to advanced typography techniques.
  </p>

  <h2>🔤 Font Families & Fallbacks</h2>
  <p>
    A font family is a group of typefaces with a similar design. In CSS, you can set a font for text using the <code>font-family</code> property. Because not every user’s computer has the same fonts installed, developers must include <strong>fallbacks</strong>.
  </p>

  <pre><code>p {
  font-family: "Times New Roman", Times, serif;
}</code></pre>

  <p>
    In this example, the browser tries <code>"Times New Roman"</code> first. If it’s unavailable, it uses <code>Times</code>, and if that’s also missing, it falls back to the generic <code>serif</code>.
  </p>

  <ul>
    <li><strong>Serif:</strong> Fonts with small decorative lines (e.g., Times New Roman, Georgia).</li>
    <li><strong>Sans-serif:</strong> Clean, modern fonts without decorative strokes (e.g., Arial, Helvetica).</li>
    <li><strong>Monospace:</strong> All characters have equal width (e.g., Courier New, Consolas).</li>
    <li><strong>Cursive:</strong> Mimics handwriting (e.g., Brush Script MT).</li>
    <li><strong>Fantasy:</strong> Decorative and playful (less commonly used).</li>
  </ul>

  <p>
    Always include at least one generic family (serif, sans-serif, monospace, etc.) as the last option to guarantee legibility.
  </p>

  <h2>📏 Font-Size Units</h2>
  <p>
    The size of text in CSS can be defined with different units. Choosing the right unit is crucial for accessibility and responsive design.
  </p>

  <h3>Absolute Units</h3>
  <ul>
    <li><code>px</code> – Pixels, fixed size, most commonly used for precision.</li>
    <li><code>pt</code>, <code>cm</code>, <code>in</code> – Rarely used for web design, more common in print.</li>
  </ul>

  <h3>Relative Units</h3>
  <ul>
    <li><code>em</code> – Relative to the parent’s font size.</li>
    <li><code>rem</code> – Relative to the root element’s (<code>&lt;html&gt;</code>) font size, more predictable.</li>
    <li><code>%</code> – Relative to the parent’s font size.</li>
    <li><code>vw</code>, <code>vh</code> – Relative to the viewport’s width or height, useful for scalable typography.</li>
  </ul>

  <pre><code>h1 { font-size: 3rem; }
p { font-size: 1em; }
small { font-size: 80%; }</code></pre>

  <p>
    In this example, the heading is three times the root font size, paragraphs match their parent size, and small text is 80% of the parent.
  </p>

  <h2>⚖️ Font Weight, Style, and Variant</h2>
  <p>
    Beyond the typeface and size, CSS lets you adjust how text looks through weight, style, and variants.
  </p>

  <ul>
    <li><code>font-weight</code> – Controls thickness of text. Common values: <code>normal</code>, <code>bold</code>, <code>lighter</code>, or numeric (100–900).</li>
    <li><code>font-style</code> – Normal, italic, or oblique.</li>
    <li><code>font-variant</code> – Enables small caps, e.g., <code>font-variant: small-caps;</code>.</li>
  </ul>

  <pre><code>h2 {
  font-weight: bold;
  font-style: italic;
  font-variant: small-caps;
}</code></pre>

  <p>
    This would render headings in bold, italicized, small capital letters.
  </p>

  <h2>🎨 Text Color, Alignment & Spacing</h2>
  <p>
    Styling text isn’t just about fonts — alignment, spacing, and color also greatly affect readability.
  </p>

  <h3>Text Color</h3>
  <pre><code>p { color: #333333; }</code></pre>
  <p>
    Colors can be defined with HEX, RGB, HSL, or named values. Using darker gray instead of pure black improves readability on screens.
  </p>

  <h3>Text Alignment</h3>
  <ul>
    <li><code>left</code> – Default for most languages.</li>
    <li><code>right</code> – Common for RTL languages like Arabic.</li>
    <li><code>center</code> – For headings or emphasis.</li>
    <li><code>justify</code> – Spreads text evenly, like in newspapers.</li>
  </ul>

  <pre><code>p { text-align: justify; }</code></pre>

  <h3>Text Spacing</h3>
  <ul>
    <li><code>line-height</code> – Vertical spacing between lines.</li>
    <li><code>letter-spacing</code> – Adjusts space between characters.</li>
    <li><code>word-spacing</code> – Controls distance between words.</li>
  </ul>

  <pre><code>p {
  line-height: 1.6;
  letter-spacing: 0.5px;
  word-spacing: 2px;
}</code></pre>

  <p>
    These properties enhance readability by preventing text from appearing too cramped.
  </p>

  <h2>🌟 Text Shadows</h2>
  <p>
    Shadows can add depth and emphasis to text, but they should be used sparingly for accessibility.
  </p>

  <pre><code>h1 {
  text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
}</code></pre>

  <p>
    This example adds a subtle shadow that makes the heading stand out against light backgrounds.
  </p>

  <h2>🌐 Web Fonts (Google Fonts)</h2>
  <p>
    Relying only on system fonts limits creativity. Services like Google Fonts let you import unique typefaces directly into your CSS.
  </p>

  <pre><code>&lt;link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"&gt;

body {
  font-family: "Roboto", sans-serif;
}</code></pre>

  <p>
    With this code, the <code>Roboto</code> font is loaded from Google Fonts. The <code>sans-serif</code> fallback ensures text is readable even if the web font fails.
  </p>

  <h2>🛠️ Practical Example: Typography Styling</h2>
  <pre><code>body {
  font-family: "Open Sans", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  color: #444;
}

h1 {
font-size: 2.5rem;
font-weight: 700;
text-align: center;
text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
}

p {
margin-bottom: 1.2em;
}</code></pre>

  <p>
    This example applies a modern, clean typography style: a readable font, good line height, and a slightly subdued text color.
  </p>

  <h2>⚡ Common Mistakes in CSS Typography</h2>
  <ul>
    <li>Using too many fonts on one page, which hurts performance and aesthetics.</li>
    <li>Overusing text shadows or neon colors that reduce readability.</li>
    <li>Not using relative units, making sites less responsive.</li>
    <li>Forgetting fallbacks, causing text to default to Times New Roman unintentionally.</li>
  </ul>

  <h2>📚 Summary</h2>
  <p>
    Text and fonts are more than decoration — they define a website’s personality and usability. By mastering font families, size units, weight, style, alignment, spacing, shadows, and web fonts, you can create a professional, accessible, and visually appealing design. In the next lesson, we’ll explore the CSS Box Model — the foundation of layout and spacing.
  </p>
</article>

    `}

    {title: "CSS Box Model", content: `<article>
  <h2>📦 Introduction to the CSS Box Model</h2>
  <p>
    Every element in a webpage is essentially a <em>box</em>. This box defines how content is displayed, how much space
    it takes, and how it interacts with other boxes. This is called the <strong>CSS Box Model</strong>, one of the most
    fundamental concepts in web design and layout. Without mastering it, layouts will feel unpredictable. In this
    lesson, we’ll explore content, padding, border, and margin in detail, along with special properties like
    <code>box-sizing</code> and <code>outline</code>.
  </p>

  <h2>🔹 The Four Layers of the Box Model</h2>
  <p>
    The box model is made of four distinct layers. From inside out, they are:
  </p>
  <ul>
    <li><strong>Content</strong> – The actual text, image, or other data inside the element.</li>
    <li><strong>Padding</strong> – Space between the content and the border.</li>
    <li><strong>Border</strong> – The line surrounding padding and content.</li>
    <li><strong>Margin</strong> – Space outside the border, pushing the element away from neighbors.</li>
  </ul>

  <pre><code>+---------------------------+
|        Margin             |
|  +---------------------+  |
|  |      Border         |  |
|  |  +---------------+  |  |
|  |  |   Padding     |  |  |
|  |  | +-----------+ |  |  |
|  |  | |  Content  | |  |  |
|  |  | +-----------+ |  |  |
|  |  +---------------+  |  |
|  +---------------------+  |
+---------------------------+
  </code></pre>

  <h3>1. Content</h3>
  <p>
    The innermost part of the box is the <strong>content area</strong>. This holds your text, images, or other elements.
    Its size can be controlled using properties like <code>width</code> and <code>height</code>.
  </p>
  <pre><code>p {
  width: 300px;
  height: 150px;
}
  </code></pre>

  <h3>2. Padding</h3>
  <p>
    Padding adds space <em>inside</em> the element, between the content and the border. It ensures that text or images
    don’t touch the edges directly.
  </p>
  <pre><code>p {
  padding: 20px;
}
  </code></pre>
  <p>
    You can control padding individually: <code>padding-top</code>, <code>padding-right</code>,
    <code>padding-bottom</code>, and <code>padding-left</code>. Shorthand notation follows clockwise order.
  </p>
  <pre><code>div {
  padding: 10px 20px 30px 40px; /* top right bottom left */
}
  </code></pre>

  <h3>3. Border</h3>
  <p>
    The border surrounds padding and content. Borders can have width, style, and color.
  </p>
  <pre><code>div {
  border: 2px solid black;
}
  </code></pre>
  <p>
    CSS supports many border styles: <code>dotted</code>, <code>dashed</code>, <code>solid</code>, <code>double</code>,
    <code>groove</code>, <code>ridge</code>, <code>inset</code>, <code>outset</code>, or <code>none</code>.
  </p>

  <h3>4. Margin</h3>
  <p>
    Margin is the outermost layer, adding space between the element and others around it. Unlike padding, margins
    collapse in some cases—for example, when two vertical margins touch, only the larger one is applied.
  </p>
  <pre><code>h1 {
  margin: 40px;
}
  </code></pre>

  <h2>📏 Box-Sizing Property</h2>
  <p>
    By default, when you set <code>width</code> and <code>height</code> in CSS, they apply only to the content box. This
    is called <code>box-sizing: content-box</code>. Padding and borders are added on top, increasing the element’s total
    size.
  </p>
  <pre><code>div {
  width: 200px;
  padding: 20px;
  border: 10px solid;
}
/* Total width = 200 + 20 + 20 + 10 + 10 = 260px */
  </code></pre>
  <p>
    To make layouts easier, we often use <code>box-sizing: border-box</code>. This makes the declared width include
    content, padding, and border.
  </p>
  <pre><code>div {
  box-sizing: border-box;
  width: 200px;
  padding: 20px;
  border: 10px solid;
}
/* Total width stays exactly 200px */
  </code></pre>

  <h2>🖊️ Outline vs Border</h2>
  <p>
    The <code>outline</code> property looks like a border but behaves differently:
  </p>
  <ul>
    <li>Outlines do not take up space—they don’t affect box size.</li>
    <li>They cannot have rounded corners.</li>
    <li>They’re often used for accessibility (e.g., focus indicators).</li>
  </ul>
  <pre><code>input:focus {
  outline: 3px solid blue;
}
  </code></pre>

  <h2>⚡ Practical Exercises with Spacing</h2>
  <h3>Exercise 1: Create a Card</h3>
  <p>
    Build a simple card with padding for text, a border for separation, and margin to space it from other cards.
  </p>
  <pre><code>.card {
  width: 300px;
  padding: 20px;
  border: 1px solid #ccc;
  margin: 15px;
}
  </code></pre>

  <h3>Exercise 2: Compare Content-Box vs Border-Box</h3>
  <p>
    Create two divs of equal declared width but different <code>box-sizing</code> to see how they behave.
  </p>

  <h3>Exercise 3: Margin Collapse</h3>
  <p>
    Add two paragraphs with margins and observe how vertical margins collapse into one.
  </p>

  <h2>📝 Common Pitfalls</h2>
  <ul>
    <li>Forgetting that padding and borders add to element size (unless using border-box).</li>
    <li>Not accounting for margin collapse between block-level elements.</li>
    <li>Mixing outline and border incorrectly.</li>
  </ul>

  <h2>✅ Summary</h2>
  <p>
    The CSS Box Model defines how every element is structured: content inside padding, inside border, surrounded by
    margin. Mastering it allows you to control spacing, layout, and alignment precisely. Combined with
    <code>box-sizing</code>, you can design predictable, responsive layouts without layout bugs.
  </p>

  <h2>📚 Next Steps</h2>
  <p>
    In Lesson 7, we’ll cover <strong>CSS Display & Positioning</strong>, exploring how block, inline, and flex elements
    behave, and how to control where elements appear on the page.
  </p>
</article>

    `}

    {title: "CSS Units & Measurements", content: `<article>

  <h2>📏 Introduction</h2>
  <p>
    Understanding CSS units and measurements is crucial for creating responsive and visually consistent websites. Units define the size of elements, spacing, fonts, and more. Without a solid grasp of both absolute and relative units, your layouts might break on different screen sizes or look inconsistent. In this lesson, we will explore absolute units, relative units, and CSS variables for scalable design.
  </p>

  <h2>🔹 Absolute Units</h2>
  <p>
    Absolute units provide fixed sizes and are independent of other elements. They are ideal for precise control, but less flexible for responsive designs.
  </p>

  <h3>1. Pixels (px)</h3>
  <p>
    Pixels are the most common unit in web design. They represent a single dot on the screen and give precise control over element dimensions.
  </p>
  <pre><code>div {
  width: 300px;
  height: 150px;
}</code></pre>

  <h3>2. Inches (in)</h3>
  <p>
    Inches are rarely used on web pages but can be useful when printing web content.
  </p>
  <pre><code>p {
  width: 2in;
}</code></pre>

  <h3>3. Centimeters (cm)</h3>
  <p>
    Centimeters are also uncommon for screen design but sometimes used for print-oriented CSS.
  </p>
  <pre><code>p {
  height: 5cm;
}</code></pre>

  <p>
    Other absolute units include millimeters (<code>mm</code>), points (<code>pt</code>), and picas (<code>pc</code>), mostly used in print media.
  </p>

  <h2>🌐 Relative Units</h2>
  <p>
    Relative units scale based on other factors such as parent size, root font size, or viewport dimensions. They are essential for responsive design.
  </p>

  <h3>1. em</h3>
  <p>
    The <code>em</code> unit is relative to the font size of its parent element.
  </p>
  <pre><code>p {
  font-size: 1.2em; /* 1.2 times parent font size */
}</code></pre>

  <h3>2. rem</h3>
  <p>
    The <code>rem</code> unit is relative to the root (<code>&lt;html&gt;</code>) font size, providing more predictable scaling than <code>em</code>.
  </p>
  <pre><code>h1 {
  font-size: 2.5rem; /* 2.5 times root font size */
}</code></pre>

  <h3>3. Percentages (%)</h3>
  <p>
    Percentages scale relative to the parent element’s property. For width and height, it’s relative to the parent’s dimensions. For fonts, it’s relative to the parent’s font size.
  </p>
  <pre><code>div {
  width: 50%; /* half the parent’s width */
}</code></pre>

  <h3>4. Viewport Units (vw, vh, vmin, vmax)</h3>
  <p>
    Viewport units allow elements to scale based on the viewport (screen) size:
  </p>
  <ul>
    <li><code>1vw</code> = 1% of viewport width</li>
    <li><code>1vh</code> = 1% of viewport height</li>
    <li><code>vmin</code> = smaller of <code>vw</code> or <code>vh</code></li>
    <li><code>vmax</code> = larger of <code>vw</code> or <code>vh</code></li>
  </ul>
  <pre><code>section {
  width: 80vw;
  height: 50vh;
}</code></pre>
  <p>
    These units are ideal for creating responsive sections, hero images, and full-screen layouts.
  </p>

  <h2>🌀 CSS Variables (Custom Properties)</h2>
  <p>
    CSS variables, also called custom properties, allow you to store values (like colors, sizes, or spacing) and reuse them throughout your stylesheet. They make maintaining and updating designs much easier.
  </p>

  <pre><code>:root {
  --primary-color: #3498db;
  --secondary-padding: 20px;
}

button {
  background-color: var(--primary-color);
  padding: var(--secondary-padding);
}</code></pre>

  <p>
    Using variables ensures consistency across your site. Changing the variable in <code>:root</code> updates every element that uses it.
  </p>

  <h2>🛠️ Combining Units and Variables</h2>
  <p>
    You can combine relative units and variables to create fully responsive, maintainable designs. For example:
  </p>
  <pre><code>:root {
  --base-font-size: 16px;
}

body {
font-size: var(--base-font-size);
}

h1 {
font-size: calc(2rem + 1vw); /* scalable font size */
}</code></pre>

  <h2>⚡ Practical Exercises</h2>
  <ol>
    <li>Set the width of a div to 60% of its parent container using percentages.</li>
    <li>Create a heading that scales with viewport width using <code>vw</code> units.</li>
    <li>Define a color variable for your theme and use it on buttons and headings.</li>
    <li>Experiment with <code>em</code> and <code>rem</code> for font sizes and padding.</li>
    <li>Create a full-screen section using <code>100vh</code> for height.</li>
  </ol>

  <h2>📝 Best Practices</h2>
  <ul>
    <li>Use relative units for responsive design wherever possible.</li>
    <li>Reserve absolute units for precise control when necessary.</li>
    <li>Leverage CSS variables for colors, spacing, fonts, and sizes to ensure consistency.</li>
    <li>Combine viewport units and <code>rem</code> for scalable typography.</li>
  </ul>

  <h2>✅ Summary</h2>
  <p>
    Mastering CSS units is essential for responsive and maintainable web design. Absolute units provide precision, while relative units ensure flexibility across devices. Custom properties (CSS variables) further enhance consistency and scalability. In the next lesson, we will explore <strong>CSS Display & Positioning</strong>, understanding how elements are laid out and positioned in modern web layouts.
  </p>
</article>

    `}

    {title: "CSS Display & Visibility", content: `<article>
  <h2>👀 Introduction</h2>
  <p>
    Understanding how elements are displayed and whether they are visible is crucial for building intuitive and
    responsive web layouts. The CSS <strong>display</strong> and <strong>visibility</strong> properties control
    whether elements occupy space, how they interact with other elements, and how they appear visually. This lesson
    explores block, inline, inline-block elements, differences between <code>display: none</code> and
    <code>visibility: hidden</code>, overflow handling, opacity, and layering with <code>z-index</code>.
  </p>

  <h2>🔹 Display Property</h2>
  <p>
    The <code>display</code> property defines how an element is rendered in the layout flow. The most common values
    include <code>block</code>, <code>inline</code>, <code>inline-block</code>, <code>flex</code>, and
    <code>grid</code>.
  </p>

  <h3>1. Block Elements</h3>
  <p>
    Block elements start on a new line and stretch to fill the container width. Examples include
    <code>&lt;div&gt;</code>, <code>&lt;h1&gt;</code>, <code>&lt;p&gt;</code>.
  </p>
  <pre><code>div {
  display: block;
  width: 100%;
  background-color: #f0f0f0;
}</code></pre>

  <h3>2. Inline Elements</h3>
  <p>
    Inline elements do not start on a new line. Their width is determined by content, and vertical padding/margin
    often does not affect surrounding elements as expected. Examples: <code>&lt;span&gt;</code>, <code>&lt;a&gt;</code>.
  </p>
  <pre><code>span {
  display: inline;
  color: red;
}</code></pre>

  <h3>3. Inline-Block</h3>
  <p>
    Inline-block elements flow inline like text but behave like block elements, respecting width, height, padding,
    and margin.
  </p>
  <pre><code>button {
  display: inline-block;
  padding: 10px 20px;
  background-color: #3498db;
  color: white;
}</code></pre>

  <h2>🔹 Visibility vs Display</h2>
  <p>
    While <code>display</code> determines layout, <code>visibility</code> controls whether an element is visible
    without affecting its space in the layout.
  </p>

  <h3>1. display: none</h3>
  <p>
    Hides the element completely and removes it from the document flow. Neighboring elements behave as if it doesn't
    exist.
  </p>
  <pre><code>p {
  display: none;
}</code></pre>

  <h3>2. visibility: hidden</h3>
  <p>
    Hides the element but keeps its allocated space in the layout. Useful for toggling visibility without affecting
    surrounding elements.
  </p>
  <pre><code>p {
  visibility: hidden;
}</code></pre>

  <h2>📦 Overflow Property</h2>
  <p>
    Overflow controls how content that exceeds an element’s box is displayed. Common values:
  </p>
  <ul>
    <li><code>visible</code> (default) – content spills outside the box.</li>
    <li><code>hidden</code> – content is clipped and not visible.</li>
    <li><code>scroll</code> – adds scrollbars regardless of content size.</li>
    <li><code>auto</code> – adds scrollbars only when content overflows.</li>
  </ul>
  <pre><code>div {
  width: 200px;
  height: 100px;
  overflow: auto;
}</code></pre>

  <h2>🖌️ Opacity</h2>
  <p>
    Opacity determines transparency of elements. Values range from 0 (fully transparent) to 1 (fully opaque). Unlike
    <code>visibility</code>, opacity affects the visual presentation but keeps the element interactive and in the layout.
  </p>
  <pre><code>img {
  opacity: 0.5;
}</code></pre>

  <h2>🧩 Z-Index</h2>
  <p>
    The <code>z-index</code> property controls stacking order of positioned elements (those with <code>position:
    relative|absolute|fixed|sticky</code>). Higher values appear on top.
  </p>
  <pre><code>.box1 {
  position: absolute;
  z-index: 1;
}
.box2 {
  position: absolute;
  z-index: 2; /* appears above box1 */
}</code></pre>

  <h2>⚡ Practical Exercises</h2>
  <ol>
    <li>Create three boxes: one block, one inline, one inline-block, and observe layout differences.</li>
    <li>Toggle an element between <code>display: none</code> and <code>visibility: hidden</code> and observe changes.</li>
    <li>Set a fixed-height container and experiment with <code>overflow: hidden, scroll, auto</code>.</li>
    <li>Create a semi-transparent button using <code>opacity</code>.</li>
    <li>Use <code>z-index</code> to layer multiple divs and create a simple overlapping effect.</li>
  </ol>

  <h2>📝 Best Practices</h2>
  <ul>
    <li>Use <code>display: none</code> when you want to remove elements completely from layout.</li>
    <li>Use <code>visibility: hidden</code> when you need to hide content but maintain space.</li>
    <li>Use <code>overflow: auto</code> for scrollable containers.</li>
    <li>Use opacity carefully for accessibility; ensure text remains readable.</li>
    <li>Always set <code>position</code> when using <code>z-index</code>.</li>
  </ul>

  <h2>✅ Summary</h2>
  <p>
    Mastering display, visibility, overflow, opacity, and z-index is essential for controlling layout and visual hierarchy. These properties give you fine-grained control over how elements appear, behave, and interact. In the next lesson, we will explore <strong>Flexbox</strong>, a powerful modern layout system that simplifies complex layouts and responsive design.
  </p>
</article>

    `}

    {title: "CSS Positioning ", content: `<article>
  
  <h2>📌 Introduction</h2>
  <p>
    Positioning is a fundamental aspect of CSS that determines how elements are placed on the page. Mastering
    positioning allows you to create complex layouts, overlap elements, and control stacking order. In this lesson, we
    will cover <code>static</code>, <code>relative</code>, <code>absolute</code>, <code>fixed</code>, and
    <code>sticky</code> positioning, dive deep into stacking contexts and <code>z-index</code>, and explore practical
    use cases.
  </p>

  <h2>🔹 Position Property Values</h2>

  <h3>1. Static</h3>
  <p>
    <code>static</code> is the default positioning. Elements are placed in normal document flow, and top, bottom, left,
    and right properties have no effect.
  </p>
  <pre><code>div {
  position: static;
}</code></pre>

  <h3>2. Relative</h3>
  <p>
    <code>relative</code> keeps the element in the normal flow but allows you to offset it using <code>top</code>,
    <code>right</code>, <code>bottom</code>, or <code>left</code>. The space it originally occupies is preserved.
  </p>
  <pre><code>div {
  position: relative;
  top: 20px; /* moves element down 20px from its normal position */
  left: 15px; /* moves element right 15px */
}</code></pre>

  <h3>3. Absolute</h3>
  <p>
    <code>absolute</code> positions an element relative to its nearest positioned ancestor (non-static). If no such
    ancestor exists, it is positioned relative to the <code>html</code> root. Absolute elements are removed from the
    normal flow.
  </p>
  <pre><code>.container {
  position: relative;
}
.child {
  position: absolute;
  top: 10px;
  right: 20px;
}</code></pre>

  <h3>4. Fixed</h3>
  <p>
    <code>fixed</code> positions an element relative to the viewport. It stays in place even when scrolling. Often used
    for headers or sticky navigation bars.
  </p>
  <pre><code>header {
  position: fixed;
  top: 0;
  width: 100%;
  background-color: #333;
  color: white;
}</code></pre>

  <h3>5. Sticky</h3>
  <p>
    <code>sticky</code> is a hybrid between relative and fixed. The element behaves like <code>relative</code> until
    a scroll threshold is reached, after which it behaves like <code>fixed</code>.
  </p>
  <pre><code>h2 {
  position: sticky;
  top: 10px;
  background-color: #f0f0f0;
}</code></pre>

  <h2>🧩 Stacking Context & Z-Index in Depth</h2>
  <p>
    Every element in CSS belongs to a <strong>stacking context</strong>. A stacking context determines how elements
    overlap when they share the same space. Certain properties like <code>position</code> (other than static), 
    <code>z-index</code>, <code>opacity</code> (less than 1), <code>transform</code>, and <code>filter</code> create
    new stacking contexts.
  </p>

  <h3>Understanding Z-Index</h3>
  <p>
    <code>z-index</code> sets the stack order of positioned elements. Higher values are displayed on top. Elements with
    the same stacking context and same z-index follow the order they appear in the HTML.
  </p>
  <pre><code>.box1 {
  position: relative;
  z-index: 1;
}
.box2 {
  position: relative;
  z-index: 2; /* appears above box1 */
}</code></pre>

  <h3>Creating New Stacking Contexts</h3>
  <p>
    Examples of properties that create new stacking contexts:
  </p>
  <ul>
    <li><code>position: relative|absolute|fixed|sticky</code> with <code>z-index</code> other than auto</li>
    <li><code>opacity</code> less than 1</li>
    <li><code>transform</code></li>
    <li><code>filter</code></li>
    <li><code>mix-blend-mode</code></li>
  </ul>

  <h2>⚡ Practical Use Cases</h2>

  <h3>1. Tooltip</h3>
  <pre><code>.tooltip {
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  background-color: black;
  color: white;
  padding: 5px 10px;
  border-radius: 4px;
  z-index: 10;
}</code></pre>

  <h3>2. Sticky Header</h3>
  <pre><code>header {
  position: sticky;
  top: 0;
  background: #fff;
  border-bottom: 1px solid #ccc;
}</code></pre>

  <h3>3. Overlapping Cards</h3>
  <pre><code>.card {
  position: relative;
  z-index: 1;
}
.card.highlight {
  position: relative;
  z-index: 5;
}</code></pre>

  <h2>📝 Best Practices</h2>
  <ul>
    <li>Use <code>relative</code> for small positional adjustments.</li>
    <li>Use <code>absolute</code> for elements removed from flow like dropdowns and tooltips.</li>
    <li>Use <code>fixed</code> for persistent headers or floating elements.</li>
    <li>Use <code>sticky</code> for scroll-sensitive elements like section headers.</li>
    <li>Always be mindful of stacking contexts to avoid unexpected overlaps.</li>
  </ul>

  <h2>✅ Summary</h2>
  <p>
    Positioning in CSS provides powerful tools to control where elements appear and how they overlap. Understanding
    static, relative, absolute, fixed, and sticky positioning, along with z-index and stacking contexts, allows you to
    build complex, responsive, and visually engaging layouts. The next lesson will introduce <strong>Flexbox</strong>,
    a modern system for flexible, one-dimensional layouts.
  </p>
</article>

    `}

    {title: "CSS Flexbox Part 1", content: `<article>
  
  <h2>📐 Introduction to Flexbox</h2>
  <p>
    Flexbox, or the Flexible Box Layout, is a modern CSS layout module that makes it easier to design flexible and
    responsive layouts. Before Flexbox, aligning and distributing space among elements required complicated float and
    positioning hacks. Flexbox simplifies one-dimensional layouts—either rows or columns—by controlling alignment,
    spacing, and order of elements efficiently.
  </p>

  <h2>🔹 Main Axis vs Cross Axis</h2>
  <p>
    Flexbox operates along two axes:
  </p>
  <ul>
    <li><strong>Main Axis:</strong> The primary axis defined by <code>flex-direction</code>. In <code>row</code> mode,
      it runs horizontally; in <code>column</code> mode, vertically.</li>
    <li><strong>Cross Axis:</strong> Perpendicular to the main axis. Alignments along this axis are controlled with
      <code>align-items</code> and <code>align-self</code>.</li>
  </ul>

  <pre><code>/* Example: row layout */
.container {
  display: flex;
  flex-direction: row; /* main axis: horizontal */
}</code></pre>

  <h2>🔹 Display: flex</h2>
  <p>
    To create a flex container, set <code>display: flex</code> on a parent element. All direct children become flex
    items and can be aligned along the main and cross axes.
  </p>
  <pre><code>.container {
  display: flex;
}</code></pre>

  <h2>🔹 Justify-Content (Main Axis Alignment)</h2>
  <p>
    <code>justify-content</code> controls alignment of items along the main axis. Common values:
  </p>
  <ul>
    <li><code>flex-start</code>: items align at the start of the container (default)</li>
    <li><code>flex-end</code>: items align at the end</li>
    <li><code>center</code>: items are centered</li>
    <li><code>space-between</code>: even space between items</li>
    <li><code>space-around</code>: even space around items</li>
    <li><code>space-evenly</code>: equal space between and around items</li>
  </ul>
  <pre><code>.container {
  display: flex;
  justify-content: space-between;
}</code></pre>

  <h2>🔹 Align-Items (Cross Axis Alignment)</h2>
  <p>
    <code>align-items</code> aligns flex items along the cross axis. Common values:
  </p>
  <ul>
    <li><code>stretch</code> (default) – items stretch to fill the container</li>
    <li><code>flex-start</code> – aligned at the start of cross axis</li>
    <li><code>flex-end</code> – aligned at the end</li>
    <li><code>center</code> – aligned at the center</li>
    <li><code>baseline</code> – aligned by text baseline</li>
  </ul>
  <pre><code>.container {
  display: flex;
  align-items: center;
}</code></pre>

  <h2>🔹 Flex Direction</h2>
  <p>
    The <code>flex-direction</code> property determines the main axis orientation:
  </p>
  <ul>
    <li><code>row</code> – default, left to right</li>
    <li><code>row-reverse</code> – right to left</li>
    <li><code>column</code> – top to bottom</li>
    <li><code>column-reverse</code> – bottom to top</li>
  </ul>
  <pre><code>.container {
  display: flex;
  flex-direction: column;
}</code></pre>

  <h2>🔹 Flex Wrap</h2>
  <p>
    By default, flex items try to fit in a single line, potentially shrinking too much. <code>flex-wrap</code> allows
    items to move to a new line when necessary.
  </p>
  <ul>
    <li><code>nowrap</code> – default, no wrapping</li>
    <li><code>wrap</code> – items wrap to next line</li>
    <li><code>wrap-reverse</code> – wraps in reverse direction</li>
  </ul>
  <pre><code>.container {
  display: flex;
  flex-wrap: wrap;
}</code></pre>

  <h2>🛠️ Practical Example</h2>
  <pre><code>.container {
  display: flex;
  flex-direction: row;
  justify-content: space-around;
  align-items: center;
  flex-wrap: wrap;
}

.item {
width: 150px;
height: 100px;
background-color: #3498db;
color: white;
display: flex;
align-items: center;
justify-content: center;
margin: 10px;
}</code></pre>

  <p>
    This creates a responsive row of boxes that wraps to the next line if necessary. Items are evenly spaced along the
    main axis and vertically centered along the cross axis.
  </p>

  <h2>⚡ Practical Exercises</h2>
  <ol>
    <li>Create a flex container with 5 boxes and align them using <code>justify-content</code> values: <code>flex-start</code>, <code>center</code>, <code>space-between</code>.</li>
    <li>Change <code>flex-direction</code> to column and observe changes.</li>
    <li>Experiment with <code>flex-wrap: wrap</code> to handle overflowing items.</li>
    <li>Combine <code>align-items</code> and <code>justify-content</code> for creative layouts.</li>
    <li>Use nested flex containers to practice flexible layouts inside another flex container.</li>
  </ol>

  <h2>📝 Best Practices</h2>
  <ul>
    <li>Always define a <code>flex-direction</code> for clarity.</li>
    <li>Use <code>flex-wrap</code> to maintain responsive designs.</li>
    <li>Align items carefully on both axes to improve readability and balance.</li>
    <li>Combine Flexbox with relative units for scalability.</li>
  </ul>

  <h2>✅ Summary</h2>
  <p>
    Flexbox simplifies layout management by controlling alignment and spacing along one axis. By mastering
    <code>display: flex</code>, main vs cross axes, <code>justify-content</code>, <code>align-items</code>,
    <code>flex-direction</code>, and <code>flex-wrap</code>, you can create clean, responsive, and adaptive designs.
    In the next lesson, we will cover <strong>Flexbox Part 2 – Advanced Properties</strong> to further enhance your
    layout skills.
  </p>
</article>

    `}






            ,
    {title: "CSS Flexbox Part 2 ", content: `<article>
  
  <h2>📐 Introduction</h2>
  <p>
    In Lesson 10, we explored the basics of Flexbox: creating a flex container, understanding main and cross axes, and
    controlling alignment using <code>justify-content</code> and <code>align-items</code>. In this lesson, we’ll dive
    deeper into advanced Flexbox properties that give you even more control over your layouts. These include
    <code>align-content</code>, <code>order</code>, <code>flex-grow</code>, <code>flex-shrink</code>, <code>flex-basis</code>,
    the shorthand <code>flex</code> property, and nested flex layouts.
  </p>

  <h2>🔹 Align-Content</h2>
  <p>
    While <code>align-items</code> aligns individual items along the cross axis, <code>align-content</code> controls
    spacing between rows or columns in multi-line flex containers (requires <code>flex-wrap: wrap</code>).
  </p>
  <ul>
    <li><code>flex-start</code> – packs rows at the start</li>
    <li><code>flex-end</code> – packs rows at the end</li>
    <li><code>center</code> – packs rows at the center</li>
    <li><code>space-between</code> – evenly distributes rows, no space at start/end</li>
    <li><code>space-around</code> – evenly distributes rows with space around them</li>
    <li><code>stretch</code> – stretches rows to fill container (default)</li>
  </ul>
  <pre><code>.container {
  display: flex;
  flex-wrap: wrap;
  align-content: space-between;
}</code></pre>

  <h2>🔹 Order Property</h2>
  <p>
    The <code>order</code> property allows you to rearrange the visual order of flex items without changing the HTML.
    Lower numbers appear first. The default value is <code>0</code>.
  </p>
  <pre><code>.item1 { order: 2; }
.item2 { order: 1; }
.item3 { order: 3; }</code></pre>

  <p>
    This is useful for responsive designs where the content order on small screens might differ from desktop layouts.
  </p>

  <h2>🔹 Flex Grow, Shrink, and Basis</h2>
  <p>
    The <code>flex</code> shorthand property combines three properties: <code>flex-grow</code>, <code>flex-shrink</code>,
    and <code>flex-basis</code>. These determine how items grow, shrink, and what base size they occupy.
  </p>

  <h3>1. Flex Grow</h3>
  <p>
    Defines how much an item can grow relative to others when extra space is available.
  </p>
  <pre><code>.item {
  flex-grow: 2; /* will grow twice as fast as other items with flex-grow: 1 */
}</code></pre>

  <h3>2. Flex Shrink</h3>
  <p>
    Defines how much an item can shrink relative to others when space is limited.
  </p>
  <pre><code>.item {
  flex-shrink: 1; /* default; will shrink proportionally with other items */
}</code></pre>

  <h3>3. Flex Basis</h3>
  <p>
    Defines the initial size of an item before growing or shrinking.
  </p>
  <pre><code>.item {
  flex-basis: 150px;
}</code></pre>

  <h3>4. Flex Shorthand</h3>
  <p>
    Combine all three properties conveniently:
  </p>
  <pre><code>.item {
  flex: 1 1 150px; /* flex-grow:1, flex-shrink:1, flex-basis:150px */
}</code></pre>

  <h2>🔹 Nested Flexbox Layouts</h2>
  <p>
    Flexbox can be nested to create complex layouts. Each nested container behaves independently, allowing precise
    alignment within subcontainers.
  </p>
  <pre><code>.parent {
  display: flex;
  justify-content: space-between;
}
.child-container {
  display: flex;
  flex-direction: column;
  align-items: center;
}</code></pre>

  <p>
    This approach is extremely useful for designing cards with multiple sections, responsive grids, and complex UI
    components.
  </p>

  <h2>⚡ Practical Exercises</h2>
  <ol>
    <li>Create a multi-row flex container and adjust <code>align-content</code> to see the effect on row spacing.</li>
    <li>Use <code>order</code> to rearrange elements visually without altering HTML.</li>
    <li>Create items with different <code>flex-grow</code> values and observe how they expand relative to each other.</li>
    <li>Experiment with <code>flex-shrink</code> and <code>flex-basis</code> to understand shrinking behavior.</li>
    <li>Design a nested flexbox card with header, body, and footer sections using nested flex containers.</li>
  </ol>

  <h2>📝 Best Practices</h2>
  <ul>
    <li>Use <code>flex</code> shorthand for cleaner, more maintainable code.</li>
    <li>Be mindful of <code>align-content</code> only affecting multi-line containers.</li>
    <li>Combine <code>order</code> and responsive media queries for flexible layouts.</li>
    <li>Nested flex containers help modularize complex components without losing flexibility.</li>
  </ul>

  <h2>✅ Summary</h2>
  <p>
    Advanced Flexbox properties give developers granular control over spacing, alignment, and order of elements. By
    mastering <code>align-content</code>, <code>order</code>, <code>flex-grow</code>, <code>flex-shrink</code>,
    <code>flex-basis</code>, and nested flexbox layouts, you can build highly responsive and modular designs. The next
    lesson will introduce <strong>CSS Grid – Part 1 (Basics)</strong>, a powerful system for two-dimensional layouts.
  </p>
</article>

    `}

    {title: "CSS Grid Part 1", content: `
<article>
 
  <h2>📐 Introduction to CSS Grid</h2>
  <p>
    CSS Grid Layout is a powerful two-dimensional layout system that allows developers to create complex web layouts with ease. Unlike Flexbox, which is mainly one-dimensional (row or column), Grid handles both rows and columns simultaneously. This makes it ideal for designing responsive websites, dashboards, and grids of content without relying on floats or positioning hacks.
  </p>

  <h2>🔹 Defining Rows and Columns</h2>
  <p>
    A grid container is created by applying <code>display: grid</code> or <code>display: inline-grid</code> to a parent element. Rows and columns are then defined using <code>grid-template-rows</code> and <code>grid-template-columns</code>.
  </p>
  <pre><code>.container {
  display: grid;
  grid-template-columns: 200px 200px 200px; /* three columns of 200px each */
  grid-template-rows: 100px 100px;         /* two rows of 100px each */
}</code></pre>

  <p>
    You can also use fractional units (<code>fr</code>) for proportional sizing:
  </p>
  <pre><code>.container {
  display: grid;
  grid-template-columns: 1fr 2fr 1fr; /* middle column twice as wide */
}</code></pre>

  <h2>🔹 Gap vs Margin</h2>
  <p>
    The <code>gap</code> property (formerly <code>grid-gap</code>) creates consistent spacing between grid items without affecting outer margins. Unlike using <code>margin</code> on individual items, <code>gap</code> ensures uniform spacing and cleaner code.
  </p>
  <pre><code>.container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px; /* 20px space between rows and columns */
}</code></pre>

  <h2>🔹 Placing Items with Grid-Column & Grid-Row</h2>
  <p>
    Grid items can be placed precisely using <code>grid-column</code> and <code>grid-row</code>. This allows items to span multiple columns or rows.
  </p>
  <pre><code>.item1 {
  grid-column: 1 / 3; /* spans from column 1 to 2 */
  grid-row: 1 / 2;    /* spans first row */
}

.item2 {
grid-column: 3 / 4;
grid-row: 1 / 3;    /* spans two rows */
}</code></pre>

  <h2>🔹 Repeat Notation</h2>
  <p>
    The <code>repeat()</code> function simplifies grid definitions:
  </p>
  <pre><code>.container {
  display: grid;
  grid-template-columns: repeat(4, 1fr); /* four equal columns */
  grid-template-rows: repeat(2, 150px);  /* two rows, 150px each */
}</code></pre>

  <h2>🔹 Auto-Fill and Auto-Fit</h2>
  <p>
    For responsive layouts, <code>auto-fill</code> and <code>auto-fit</code> work with <code>minmax()</code> to automatically adjust columns:
  </p>
  <pre><code>.container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 20px;
}</code></pre>
  <p>
    This creates as many columns as will fit, each at least 150px wide, and distributes remaining space evenly.
  </p>

  <h2>🔹 Aligning Items</h2>
  <p>
    Use <code>justify-items</code> for horizontal alignment and <code>align-items</code> for vertical alignment of grid items within their cells:
  </p>
  <pre><code>.container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  justify-items: center; /* horizontally center items */
  align-items: start;    /* align items to top */
}</code></pre>

  <h2>⚡ Practical Exercises</h2>
  <ol>
    <li>Create a 3x3 grid and place items in different rows and columns using <code>grid-column</code> and <code>grid-row</code>.</li>
    <li>Use <code>gap</code> to add 15px spacing between items.</li>
    <li>Experiment with <code>repeat(auto-fit, minmax(100px, 1fr))</code> to make a responsive layout.</li>
    <li>Align items differently using <code>justify-items</code> and <code>align-items</code>.</li>
    <li>Combine <code>grid-template-rows</code> and <code>grid-template-columns</code> to create a card layout.</li>
  </ol>

  <h2>📝 Best Practices</h2>
  <ul>
    <li>Use <code>gap</code> instead of margins for consistent spacing.</li>
    <li>Use fractional units (<code>fr</code>) for proportional sizing instead of fixed pixels.</li>
    <li>Leverage <code>repeat()</code> and <code>auto-fit</code>/<code>auto-fill</code> for responsive grids.</li>
    <li>Place items using <code>grid-column</code> and <code>grid-row</code> for precise layouts.</li>
    <li>Combine Grid with media queries for fully responsive designs.</li>
  </ul>

  <h2>✅ Summary</h2>
  <p>
    CSS Grid provides a robust system for creating two-dimensional layouts with precise control over rows, columns, and spacing. By mastering grid templates, gaps, and item placement, you can design complex, responsive layouts efficiently. In the next lesson, we will explore <strong>CSS Grid – Part 2 (Advanced Properties & Alignment)</strong> to further enhance your layout capabilities.
  </p>
</article>





    `}

    {title: "CSS Grid Part 2", content: `<article>
  
  <h2>📐 Introduction to Advanced CSS Grid</h2>
  <p>
    CSS Grid is a powerful two-dimensional layout system. In Part 1, we covered grid basics: defining rows and columns, using <code>gap</code>, and placing items with <code>grid-column</code> and <code>grid-row</code>. In this lesson, we explore advanced techniques including <strong>grid areas</strong>, responsive design strategies using <code>auto-fit</code> and <code>auto-fill</code>, and guidance on when to use Grid versus Flexbox.
  </p>

  <h2>🔹 Grid Areas</h2>
  <p>
    Grid areas allow you to name sections of the grid and place items easily using those names. This simplifies complex layouts by avoiding manual row and column calculations.
  </p>
  <pre><code>.container {
  display: grid;
  grid-template-columns: 1fr 2fr 1fr;
  grid-template-rows: 100px 200px;
  grid-template-areas:
    "header header header"
    "sidebar main main";
}

.header { grid-area: header; }
.sidebar { grid-area: sidebar; }
.main { grid-area: main; }</code></pre>

  <p>
    Here, the <code>header</code> spans all three columns in the first row, while <code>sidebar</code> occupies the first column of the second row, and <code>main</code> spans the remaining two columns.
  </p>

  <h2>🔹 Auto-Fit and Auto-Fill</h2>
  <p>
    These functions dynamically create columns or rows to make your grid responsive. Both are used with <code>repeat()</code> and <code>minmax()</code>.
  </p>
  <ul>
    <li><code>auto-fill</code> – fills the container with as many tracks as possible, even if empty.</li>
    <li><code>auto-fit</code> – fits items into the available space, collapsing empty tracks.</li>
  </ul>
  <pre><code>.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 20px;
}</code></pre>
  <p>
    This ensures items resize and wrap automatically, maintaining a responsive layout across devices.
  </p>

  <h2>🔹 Responsive Grids</h2>
  <p>
    Responsive design is essential for modern websites. CSS Grid combined with <code>minmax()</code> and media queries allows layouts to adapt seamlessly to different screen sizes.
  </p>
  <pre><code>@media (max-width: 768px) {
  .container {
    grid-template-columns: 1fr; /* stack items vertically on small screens */
  }
}</code></pre>
  <p>
    Use flexible units such as <code>fr</code>, percentages, and <code>minmax()</code> to create grids that naturally adjust to screen sizes without breaking the design.
  </p>

  <h2>🔹 When to Use Grid vs Flexbox</h2>
  <p>
    Both Grid and Flexbox are powerful, but their use cases differ:
  </p>
  <ul>
    <li><strong>Flexbox:</strong> Best for one-dimensional layouts (rows or columns). Use for toolbars, navbars, or inline element alignment.</li>
    <li><strong>Grid:</strong> Ideal for two-dimensional layouts (rows + columns). Use for page layouts, dashboards, or complex card grids.</li>
    <li>It’s common to combine them: use Grid for the main page layout and Flexbox for internal components like buttons or lists.</li>
  </ul>

  <h2>⚡ Practical Exercises</h2>
  <ol>
    <li>Create a grid layout with named grid areas for header, sidebar, main content, and footer.</li>
    <li>Use <code>auto-fit</code> and <code>minmax()</code> to make a responsive card grid.</li>
    <li>Compare layouts using <code>auto-fill</code> vs <code>auto-fit</code> to understand differences.</li>
    <li>Stack items vertically using media queries for smaller screens.</li>
    <li>Combine Grid for the layout and Flexbox inside grid items for buttons or lists.</li>
  </ol>

  <h2>📝 Best Practices</h2>
  <ul>
    <li>Use named grid areas for readability in complex layouts.</li>
    <li>Prefer fractional units and <code>minmax()</code> over fixed pixels for responsive designs.</li>
    <li>Combine Grid and Flexbox strategically for maximum flexibility.</li>
    <li>Test layouts on multiple screen sizes to ensure responsiveness.</li>
  </ul>

  <h2>✅ Summary</h2>
  <p>
    Advanced CSS Grid techniques like grid areas, auto-fit/auto-fill, and responsive strategies allow developers to create dynamic, scalable layouts. Understanding when to use Grid versus Flexbox ensures efficient and maintainable design. The next lesson will cover <strong>CSS Transitions & Animations</strong>, adding motion and interactivity to your designs.
  </p>
</article>

    `}

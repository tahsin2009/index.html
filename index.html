<script>
/* Modified demo app
   - Removed image/video upload entirely
   - Upload supports multiple source-code entries per post
   - Each code entry can be marked public/private
   - Posts store sourceCodes: array of {id, code, public, lang}
*/


function showAlert(message) {
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.style.display = 'block';
  modalRoot.innerHTML = `
    <div class="modal">
      <div class="card">
        <p>${escapeHtml(message)}</p>
        <div style="text-align:right;margin-top:12px">
          <button id="closeAlert" class="small-btn">OK</button>
        </div>
      </div>
    </div>`;
  document.getElementById('closeAlert').addEventListener('click', closeModal);
}

function showConfirm(message, onConfirm) {
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.style.display = 'block';
  modalRoot.innerHTML = `
    <div class="modal">
      <div class="card">
        <p>${escapeHtml(message)}</p>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
          <button id="cancelConfirm" class="small-btn">Cancel</button>
          <button id="okConfirm" class="small-btn danger">OK</button>
        </div>
      </div>
    </div>`;
  document.getElementById('cancelConfirm').addEventListener('click', closeModal);
  document.getElementById('okConfirm').addEventListener('click', () => {
    closeModal();
    if (onConfirm) onConfirm();
  });
}




const APPKEY = 'codeshare_v2_no_media';
const local = {
  get(){ try { return JSON.parse(localStorage.getItem(APPKEY)||'{}') } catch(e){ return {} } },
  set(obj){ localStorage.setItem(APPKEY, JSON.stringify(obj)); }
};

let state = { user: null, data: null };

function init(){
  state.data = local.get();
  if(!state.data.posts) state.data.posts = [];
  if(!state.data.users) state.data.users = [];
  if(!state.data.saved) state.data.saved = {};

  setupTabs();
  document.getElementById('addCodeBtn').addEventListener('click', addCodeEntry);
  document.getElementById('postBtn').addEventListener('click', handlePost);
  document.getElementById('btnLogin').addEventListener('click', showAuth);
  document.getElementById('btnLogout').addEventListener('click', logout);

  // seed one code entry by default
  addCodeEntry();

  renderFeed(); renderProfile(); renderSaved();
  setUserFromStorage();
}

function setUserFromStorage(){
  const uid = localStorage.getItem('codeshare_current_user');
  if(uid){ const u = state.data.users.find(x=>x.id===uid); if(u) state.user = u; }
  updateUserUI();
}

function updateUserUI(){
  const user = firebase.auth().currentUser;
  const btnLogin = document.getElementById('btnLogin');
  const btnLogout = document.getElementById('btnLogout');
  const userName = document.getElementById('currentUserName');
  const profileName = document.getElementById('profileName');
  const profileEmail = document.getElementById('profileEmail');
  const avatar = document.getElementById('profileAvatar');

  if (user) {
    const name = user.email.split('@')[0];
    userName.textContent = name;
    profileName.textContent = name;
    profileEmail.textContent = user.email;
    avatar.textContent = name[0].toUpperCase();
    btnLogin.style.display = 'none';
    btnLogout.style.display = 'inline-flex';
  } else {
    userName.textContent = "Guest";
    profileName.textContent = "Guest";
    profileEmail.textContent = "Not signed in";
    avatar.textContent = "G";
    btnLogin.style.display = 'inline-flex';
    btnLogout.style.display = 'none';
  }

  renderMyPosts();
}


function setupTabs(){
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', (e)=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      e.currentTarget.classList.add('active');
      const page = e.currentTarget.dataset.page; showPage(page);
    })
  })
}

function showPage(page){
  ['feed','upload','saved','profile'].forEach(p=>{ document.getElementById(p+'Page').style.display = p===page ? '' : 'none'; });
  if(page==='feed') renderFeed();
  if(page==='saved') renderSaved();
  if(page==='profile') renderProfile();
}

/* --- Upload code entries --- */
let codeEntryCounter = 0;
function addCodeEntry(initialText=''){
  const list = document.getElementById('codeList');
  const id = 'codeEntry_' + (++codeEntryCounter);
  const wrapper = document.createElement('div');
  wrapper.style.display='flex'; wrapper.style.flexDirection='column'; wrapper.style.gap='6px'; wrapper.id = id;
  wrapper.innerHTML = `
    <textarea class="textarea code-input" data-entry-id="${id}" rows="6" placeholder="Paste source code here...">${escapeHtml(initialText)}</textarea>
    <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
      <div style="display:flex;gap:8px;align-items:center">
        <label class="small-btn"><input type="checkbox" class="code-public" /> Public</label>
        <select class="code-lang small-btn" style="padding:6px;border-radius:6px;border:1px solid #ddd">
          <option value="javascript">JavaScript</option>
          <option value="python">Python</option>
          <option value="css">CSS</option>
          <option value="markup">HTML</option>
        </select>
      </div>
      <div>
        <button type="button" class="small-btn remove-code">Remove</button>
      </div>
    </div>
  `;
  list.appendChild(wrapper);

  // attach remove handler
  wrapper.querySelector('.remove-code').addEventListener('click', ()=>{ wrapper.remove(); });
}

function collectCodeEntries(){
  const arr = [];
  document.querySelectorAll('#codeList .code-input').forEach(tx=>{
    const codeText = tx.value.trim();
    if(!codeText) return;
    const parent = tx.closest('div');
    const publicChk = parent.querySelector('.code-public');
    const langSel = parent.querySelector('.code-lang') || { value: 'javascript' };
    arr.push({ id: 'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), code: codeText, public: !!publicChk.checked, lang: langSel.value });
  });
  return arr;
}
// ---------- POST ----------
async function handlePost() {
  const user = auth.currentUser;
  if (!user) return alert("Please log in first!");

  const desc = document.getElementById('desc').value.trim();
  const codeInputs = document.querySelectorAll('#codeList .code-input');
  
  const codeData = Array.from(codeInputs).map(el => ({
    lang: el.closest('div').querySelector('.code-lang')?.value || 'javascript',
    code: el.value.trim(),
    public: el.closest('div').querySelector('.code-public')?.checked || false
  })).filter(c => c.code !== "");

  if (!desc && codeData.length === 0) {
    alert("Please write something!");
    return;
  }

  try {
    await db.collection("posts").add({
      userId: user.uid,
      userName: user.email.split('@')[0],
      description: desc,
      sourceCodes: codeData,
      likes: [],
      comments: [],
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("Posted!");
    document.getElementById('desc').value = '';
    document.getElementById('codeList').innerHTML = '';
    addCodeEntry();
    renderFeed();
  } catch (err) {
    alert("Error posting: " + err.message);
  }
}



function saveData(){ local.set(state.data); }


// ---------- FEED ----------
async function renderFeed() {
  const feedList = document.getElementById('feedList');
  feedList.innerHTML = "<div style='padding:18px;color:#666'>Loading posts...</div>";

  try {
    const snapshot = await db.collection("posts").orderBy("createdAt", "desc").get();
    feedList.innerHTML = "";

    if (snapshot.empty) {
      feedList.innerHTML = "<div style='padding:18px;color:#666'>No posts yet — create one from the upload tab.</div>";
      return;
    }

    snapshot.forEach(doc => {
      const post = doc.data();
      const postId = doc.id;
      const likes = post.likes?.length || 0;
      const desc = post.description || "";
      const codes = post.sourceCodes || [];

      const codeBlocks = codes.map(c => `
        <pre class="code-block"><code class="language-${c.lang || 'javascript'}">${escapeHtml(c.code)}</code></pre>
      `).join('');

            const postHTML = `
  <div class="post">
    <div class="meta">
      <div class="avatar">${escapeHtml((post.userName?.[0] || 'U').toUpperCase())}</div>
      <div>
        <div class="username">${escapeHtml(post.userName || 'Unknown')}</div>
        <div class="posted-time muted">${post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString() : ''}</div>
      </div>
    </div>

    <!-- description with id so it can be toggled -->
    <div class="desc" id="desc-${postId}">${escapeHtml(desc)}</div>

    <!-- show toggle button only for long descriptions -->
    ${desc && desc.length > 100 ? `<div style="margin-top:6px"><button class="small-btn" id="toggleDesc-${postId}" onclick="toggleDescription('${postId}')">Show more</button></div>` : ''}

    ${codeBlocks}

    <div class="actions" style="margin-top:8px">
      <button class="small-btn" onclick="toggleLike('${postId}')">❤️ ${likes}</button>
      <button class="small-btn" onclick="openComments('${postId}')">💬</button>
      <button class="small-btn" onclick="toggleSave('${postId}')">🔖</button>
    </div>
  </div>
`;


      feedList.innerHTML += postHTML;
    });

    // highlight code with Prism.js
    if (window.Prism && typeof Prism.highlightAll === 'function') Prism.highlightAll();
  } catch (err) {
    console.error("Error loading posts:", err);
    feedList.innerHTML = "<div style='padding:18px;color:red'>Failed to load posts.</div>";
  }
}


// ---------- LIKE ----------
async function toggleLike(postId) {
  const user = auth.currentUser;
  if (!user) return alert("Please log in!");

  try {
    const ref = db.collection("posts").doc(postId);
    const docSnap = await ref.get();
    const likes = docSnap.data().likes || [];

    if (likes.includes(user.uid)) {
      await ref.update({
        likes: firebase.firestore.FieldValue.arrayRemove(user.uid)
      });
    } else {
      await ref.update({
        likes: firebase.firestore.FieldValue.arrayUnion(user.uid)
      });
    }

    renderFeed();
  } catch (err) {
    alert("Error liking post: " + err.message);
  }
}




// ---------- COMMENTS (Modal style) ----------
async function openComments(postId) {
  const user = auth.currentUser;
  if (!user) return alert("Please log in!");

  const modalRoot = document.getElementById('modalRoot');
  modalRoot.style.display = 'block';
  modalRoot.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="card">
        <h3>Comments</h3>
        <div id="commentsList" class="comments-list">
          <div style="padding:8px;color:#666">Loading comments...</div>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <input id="commentText" placeholder="Write a comment" class="input" style="flex:1"/>
          <button id="sendComment" class="small-btn">Send</button>
        </div>
        <div style="text-align:right;margin-top:8px">
          <button id="closeModal" class="small-btn">Close</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('sendComment').addEventListener('click', async () => {
    const text = document.getElementById('commentText').value.trim();
    if (!text) return alert("Please write something!");
    try {
      await db.collection("posts").doc(postId).collection("comments").add({
        userId: user.uid,
        userName: user.email.split('@')[0],
        text,
        at: firebase.firestore.FieldValue.serverTimestamp()
      });
      document.getElementById('commentText').value = '';
      loadComments(postId);
    } catch (err) {
      alert("Error adding comment: " + err.message);
    }
  });

  // load comments
  loadComments(postId);
}

// helper to load and display comments
async function loadComments(postId) {
  const list = document.getElementById('commentsList');
  list.innerHTML = "<div style='padding:8px;color:#666'>Loading comments...</div>";
  try {
    const snap = await db.collection("posts").doc(postId)
      .collection("comments").orderBy("at", "asc").get();

    if (snap.empty) {
      list.innerHTML = "<div style='padding:8px;color:#666'>No comments yet.</div>";
      return;
    }

    list.innerHTML = "";
    snap.forEach(doc => {
      const c = doc.data();
      const time = c.at ? new Date(c.at.toDate()).toLocaleString() : "";
      list.innerHTML += `
        <div class="comment">
          <strong>${escapeHtml(c.userName || "User")}</strong>
          <div class="muted">${time}</div>
          <div>${escapeHtml(c.text)}</div>
        </div>
      `;
    });
  } catch (err) {
    list.innerHTML = "<div style='padding:8px;color:red'>Failed to load comments.</div>";
    console.error("Error loading comments:", err);
  }
}






// ---------- SAVE ----------
async function toggleSave(postId) {
  const user = auth.currentUser;
  if (!user) return alert("Please log in!");

  try {
    const saveRef = db.collection("saves").doc(user.uid);
    const docSnap = await saveRef.get();
    const saved = docSnap.exists ? docSnap.data().savedPosts || [] : [];

    if (saved.includes(postId)) {
      await saveRef.update({
        savedPosts: firebase.firestore.FieldValue.arrayRemove(postId)
      });
    } else {
      await saveRef.set({
        savedPosts: firebase.firestore.FieldValue.arrayUnion(postId)
      }, { merge: true });
    }

    alert("Saved!");
  } catch (err) {
    alert("Error saving post: " + err.message);
  }
}
async function renderSaved() {
  const box = document.getElementById('savedList');
  box.innerHTML = "<div style='padding:8px;color:#666'>Loading saved posts...</div>";

  const user = auth.currentUser;
  if (!user) {
    box.innerHTML = '<div style="padding:8px;color:#666">Login to see saved posts.</div>';
    return;
  }

  try {
    const saveRef = db.collection("saves").doc(user.uid);
    const saveSnap = await saveRef.get();

    if (!saveSnap.exists || !saveSnap.data().savedPosts?.length) {
      box.innerHTML = '<div style="padding:8px;color:#666">You have no saved posts.</div>';
      return;
    }

    const savedPosts = saveSnap.data().savedPosts;

    // Get the posts that are saved
    const postsSnap = await db.collection("posts")
      .where(firebase.firestore.FieldPath.documentId(), "in", savedPosts)
      .get();

    box.innerHTML = "";
    postsSnap.forEach(doc => {
      const post = doc.data();
      const postId = doc.id;
      const desc = post.description || "";
      const codes = post.sourceCodes || [];
      const likes = post.likes?.length || 0;

      const codeBlocks = codes.map(c => `
        <pre class="code-block"><code class="language-${c.lang || 'javascript'}">${escapeHtml(c.code)}</code></pre>
      `).join('');

      box.innerHTML += `
        <div class="post">
          <div class="meta">
            <div class="avatar">${escapeHtml((post.userName?.[0] || 'U').toUpperCase())}</div>
            <div>
              <div class="username">${escapeHtml(post.userName || 'Unknown')}</div>
              <div class="posted-time muted">${post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString() : ''}</div>
            </div>
          </div>
          <div class="desc">${escapeHtml(desc)}</div>
          ${codeBlocks}
          <div class="actions" style="margin-top:8px">
            <button class="small-btn" onclick="toggleLike('${postId}')">❤️ ${likes}</button>
            <button class="small-btn" onclick="openComments('${postId}')">💬</button>
            <button class="small-btn" onclick="toggleSave('${postId}')">🔖</button>
          </div>
        </div>
      `;
    });

    if (window.Prism && typeof Prism.highlightAll === 'function') Prism.highlightAll();
  } catch (err) {
    console.error("Error loading saved posts:", err);
    box.innerHTML = "<div style='padding:8px;color:red'>Failed to load saved posts.</div>";
  }
}


function renderProfile(){ renderMyPosts(); }
function renderMyPosts() {
  const container = document.getElementById('myPosts');
  container.innerHTML = '';

  if (!state.user) {
    container.innerHTML = '<div style="padding:8px;color:#666">Login to see your posts.</div>';
    return;
  }

  const mine = state.data.posts.filter(p => p.userId === state.user.id);
  if (mine.length === 0) {
    container.innerHTML = '<div style="padding:8px;color:#666">You have not posted anything yet.</div>';
    return;
  }

  mine.forEach(p => {
    const d = document.createElement('div');
    d.className = 'post';

    d.innerHTML = `
      <div>
        <div class="username">${escapeHtml(p.description || 'Untitled')}</div>
        <div class="muted" style="margin-top:4px">${timeAgo(p.createdAt)}</div>
        <div style="margin-top:10px;">
          <button class="small-btn delMy" data-id="${p.id}">Delete</button>
        </div>
      </div>
    `;

    container.appendChild(d);
  });

  // Delete button handler
  document.querySelectorAll('.delMy').forEach(b =>
    b.addEventListener('click', e => {
      if (!confirm('Delete this post?')) return;
      const id = e.currentTarget.dataset.id;
      state.data.posts = state.data.posts.filter(p => p.id !== id);
      saveData();
      renderMyPosts();
      renderFeed();
      renderSaved();
    })
  );
}

/*  modal (unchanged) */
function closeModal(){ const modalRoot = document.getElementById('modalRoot'); modalRoot.style.display = 'none'; modalRoot.innerHTML=''; }

/* ---------- AUTH MODAL + FIREBASE AUTH ---------- */

function showAuth() {
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.style.display = 'block';
  modalRoot.innerHTML = `
  <div class="modal">
      <div class="card">
        <h3>Sign up / Login</h3>
        <div style="display:flex;gap:8px;margin-bottom:8px;flex-direction:column">
          <input id="authName" class="input" placeholder="Name" />
          <input id="authEmail" class="input" placeholder="Email" />
          <input id="authPassword" class="input" placeholder="Password" type="password" />
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button id="cancelAuth" class="small-btn">Cancel</button>
          <button id="doSignup" class="small-btn">Sign up</button>
          <button id="doLogin" class="small-btn">Login</button>
        </div>
      </div>
    </div>
  `;
   document.getElementById('cancelAuth').addEventListener('click', closeModal);

  document.getElementById('doSignup').addEventListener('click', () => {
    const name = document.getElementById('authName').value.trim();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value.trim();
    if (!name || !email || !password) {
      alert('All fields required');
      return;
    }
    signup(email, password, name);
    closeModal();
  });

  document.getElementById('doLogin').addEventListener('click', () => {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value.trim();
    if (!email || !password) {
      alert('Email and password required');
      return;
    }
    login(email, password);
    closeModal();
  });
}

function logout() {
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.style.display = 'block';
  modalRoot.innerHTML = `
    <div class="modal">
      <div class="card">
        <h3>Confirm Logout</h3>
        <p>Do you really want to log out?</p>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
          <button id="cancelLogout" class="small-btn">Cancel</button>
          <button id="doLogout" class="small-btn danger">Log out</button>
        </div>
      </div>
    </div>
  `;

    document.getElementById('cancelLogout').addEventListener('click', closeModal);
  document.getElementById('doLogout').addEventListener('click', () => {
    auth.signOut()
      .then(() => {
        alert('Logged out successfully');
        closeModal();
      })
      .catch(err => alert(err.message));
  });
}

// ---------- AUTH ----------
function signup(email, password, name) {
  auth.createUserWithEmailAndPassword(email, password)
    .then(userCred => {
      const user = userCred.user;
      return db.collection("users").doc(user.uid).set({
        name: name,
        email: email,
        joinedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    })
    .then(() => alert("Signup successful!"))
    .catch(err => alert(err.message));
}

function login(email, password) {
  auth.signInWithEmailAndPassword(email, password)
    .catch(err => alert(err.message));
}

auth.onAuthStateChanged(user => {
  const userName = document.getElementById("currentUserName");
  const profileName = document.getElementById("profileName");
  const profileEmail = document.getElementById("profileEmail");
  const avatar = document.getElementById("profileAvatar");
  
  if (user) {
    const name = user.email.split('@')[0];
    userName.textContent = name;
    profileName.textContent = name;
    profileEmail.textContent = user.email;
    avatar.textContent = name[0].toUpperCase();
    renderFeed();
  } else {
    userName.textContent = "Guest";
    profileName.textContent = "Guest";
    profileEmail.textContent = "Not signed in";
    avatar.textContent = "G";
  }

  updateUserUI();

});



/* Helpers */
function timeAgo(ts){ const sec = Math.floor((Date.now() - ts)/1000); if(sec<60) return `${sec}s`; if(sec<3600) return `${Math.floor(sec/60)}m`; if(sec<86400) return `${Math.floor(sec/3600)}h`; return `${Math.floor(sec/86400)}d`; }
function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>\"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;', '"':'&quot;',"'":'&#39;' })[c]); }


function toggleDescription(postId) {
  const descEl = document.getElementById('desc-' + postId);
  const btn = document.getElementById('toggleDesc-' + postId);
  if (!descEl || !btn) return;

  const expanded = descEl.classList.toggle('expanded');
  btn.textContent = expanded ? 'Show less' : 'Show more';
}
